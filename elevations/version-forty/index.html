<html lang="en">
<head>

<style>
  :root{
    --bg:#0d0f11; --panel:rgba(20,22,25,.68); --panel-line:rgba(255,255,255,.09);
    --ink:#eceae4; --ink-dim:#9a9890; --brass:#c9a36a; --brass-dim:rgba(201,163,106,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg); color:var(--ink);
    font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #c:active{cursor:grabbing}
  #titleblock{position:fixed;top:max(18px, env(safe-area-inset-top));left:22px;z-index:6;user-select:none;
    text-shadow:0 1px 12px rgba(0,0,0,.55)}
  #titleblock h1{font-family:Archivo,Inter,sans-serif;font-weight:700;font-size:15px;letter-spacing:.28em;line-height:1.35}
  #titleblock p{font-size:10.5px;letter-spacing:.22em;color:var(--ink-dim);margin-top:4px}
  #titleblock i{display:block;width:46px;height:2px;background:var(--brass);margin-top:10px}
  #titleblock .ver{margin-top:8px;font-size:10px;letter-spacing:.18em;color:var(--brass)}
  #compass{position:fixed;top:max(18px, env(safe-area-inset-top));right:20px;z-index:6;
    width:52px;height:52px;border-radius:50%;
    background:var(--panel);border:1px solid var(--panel-line);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  #needle{position:absolute;inset:0;transition:transform .15s ease-out}
  #needle::before{content:"";position:absolute;left:50%;top:7px;width:2px;height:19px;margin-left:-1px;
    background:linear-gradient(var(--brass),transparent)}
  #needle::after{content:"N";position:absolute;left:50%;top:5px;transform:translateX(-50%);
    font-size:8.5px;font-weight:600;color:var(--brass);letter-spacing:0}
  #compass b{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--ink-dim)}
  .bar{position:fixed;left:50%;transform:translateX(-50%);z-index:7;
    display:flex;background:var(--panel);border:1px solid var(--panel-line);border-radius:11px;overflow:hidden;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex-wrap:wrap;justify-content:center;max-width:96vw}
  .bar button{appearance:none;background:none;border:none;color:var(--ink-dim);cursor:pointer;
    font-family:Archivo,Inter,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.16em;
    padding:13px 14px 12px;position:relative;transition:color .2s}
  .bar button + button{border-left:1px solid var(--panel-line)}
  .bar button.on{color:var(--ink)}
  .bar button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:7px;height:2px;background:var(--brass)}
  .bar button:hover{color:var(--ink)}
  #views{bottom:calc(20px + env(safe-area-inset-bottom))}
  #sun{bottom:calc(70px + env(safe-area-inset-bottom))}
  #sun .lbl{padding:13px 12px 12px;font-family:Archivo,Inter,sans-serif;font-size:10.5px;font-weight:600;
    letter-spacing:.16em;color:var(--brass);border-right:1px solid var(--panel-line)}
  #hint{position:fixed;left:50%;bottom:calc(122px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;
    font-size:10.5px;letter-spacing:.12em;color:var(--ink-dim);transition:opacity .8s;white-space:nowrap;
    text-shadow:0 1px 10px rgba(0,0,0,.6)}
  #hint.fade{opacity:0}
  /* convergence readout — the image keeps refining while you hold still */
  #conv{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:7;
    font-family:Archivo,Inter,sans-serif;font-size:9.5px;letter-spacing:.16em;color:var(--ink-dim);
    background:var(--panel);border:1px solid var(--panel-line);border-radius:9px;padding:9px 12px;
    backdrop-filter:blur(10px);display:flex;align-items:center;gap:9px;transition:opacity .5s}
  #conv.done{opacity:.35}
  #conv u{display:block;width:52px;height:2px;background:rgba(255,255,255,.12);border-radius:1px;overflow:hidden}
  #conv u i{display:block;height:100%;width:0;background:var(--brass);transition:width .18s linear}
  #nav{position:fixed;top:max(18px, env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:6;
    display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:70vw}
  #nav a{font-size:10px;letter-spacing:.14em;text-decoration:none;color:var(--ink-dim);
    padding:8px 12px;border-radius:8px;border:1px solid var(--panel-line);
    background:var(--panel);backdrop-filter:blur(10px)}
  #nav a:hover{color:var(--ink);border-color:var(--brass-dim)}
  #nav a.on{color:var(--ink);border-color:var(--brass-dim);background:rgba(201,163,106,.12)}
  #loading{position:fixed;inset:0;z-index:20;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    transition:opacity .6s}
  #loading.done{opacity:0;pointer-events:none}
  #loading .lt{font-family:Archivo;font-weight:700;font-size:14px;letter-spacing:.32em;text-align:center}
  #loading .ls{font-size:10px;letter-spacing:.24em;color:var(--ink-dim);text-align:center;padding:0 24px}
  #loading .pb{width:150px;height:2px;background:rgba(255,255,255,.08);border-radius:1px;overflow:hidden;margin-top:8px}
  #loading .pb i{display:block;width:40%;height:100%;background:var(--brass);border-radius:1px;
    animation:shimmer 1.2s ease-in-out infinite}
  @keyframes shimmer{0%{transform:translateX(-110%)}100%{transform:translateX(380%)}}
  @media (max-width:720px){
    #titleblock h1{font-size:12px;letter-spacing:.18em}
    #nav{top:auto;bottom:calc(126px + env(safe-area-inset-bottom));left:12px;right:12px;transform:none;max-width:none}
    .bar button{padding:11px 9px;font-size:9.5px;letter-spacing:.1em}
    #hint,#conv{display:none}
  }

<script>
(function () {
  'use strict';

  /* Without a trailing slash, relative "houseScene.js" resolves to
     /elevations/houseScene.js (404) → FAILED TO LOAD SCENE. */
  var p = location.pathname || '';
  if (p.slice(-1) !== '/' && !/\.html?$/i.test(p)) {
    location.replace(p + '/' + (location.search || '') + (location.hash || ''));
    return;
  }

  var STAMP = 'V26_OFFW_20260816b';

  function say(msg) {
    var ls = document.querySelector('#loading .ls');
    if (ls) ls.textContent = msg;
  }
  function bootFail(msg) {
    say(msg);
    var pb = document.querySelector('#loading .pb');
    if (pb) pb.style.display = 'none';
    console.error(msg);
  }
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src; s.async = false;
      s.onload = function () { resolve(src); };
      s.onerror = function () { reject(new Error('Failed to load ' + src)); };
      document.head.appendChild(s);
    });
  }
  function loadOne(candidates, optional) {
    var i = 0;
    function next(err) {
      if (i >= candidates.length) {
        if (optional) return Promise.resolve(null);
        return Promise.reject(err || new Error('No candidates left'));
      }
      return loadScript(candidates[i++]).catch(next);
    }
    return next();
  }

  loadOne(['../../lib/three.min.js', '/lib/three.min.js',
           'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'], false)
    .then(function () { return loadOne(['../../lib/GLTFLoader.js', '/lib/GLTFLoader.js'], true); })
    .then(function () { return loadOne(['../../lib/DRACOLoader.js', '/lib/DRACOLoader.js'], true); })
    .then(function () { return loadOne(['../../perf.js', '/perf.js'], true); })
    .then(function () { return loadOne(['houseScene.js?v=' + STAMP,
                                        '/elevations/version-forty/houseScene.js?v=' + STAMP], false); })
    .then(function () {
      if (!window.THREE) { bootFail('FAILED TO LOAD 3D ENGINE'); return; }
      if (!window.HouseScene) { bootFail('FAILED TO LOAD SCENE'); return; }
      try { boot(); }
      catch (err) { console.error(err); bootFail('BOOT ERROR: ' + (err && err.message ? err.message : err)); }
    })
    .catch(function (e) { bootFail('FAILED TO LOAD: ' + (e && e.message ? e.message : e)); });

/* ============================================================================
   PHOTOREAL EXTERIOR RENDERER

   The geometry starts as Version Nineteen, copied into Version Twenty-Six. The renderer is the V19 photoreal pipeline.

   A forward-rendered scene with a shadow map and a screen-space AO pass looks
   like architectural software. What separates that from a photograph is not
   more tuning; it is four missing things, and this file adds all four:

     1 · INDIRECT LIGHT. Real shade is lit by light that bounced off something
         nearby, and it carries that thing's colour. A flat hemisphere constant
         cannot do that. Here: screen-space GI, one bounce, cosine-sampled.
     2 · CONVERGENCE. Every real photograph is an integral over an aperture and
         a shutter. Here: a jittered projection accumulated over many frames, so
         holding still resolves the image — edges, GI and reflections all clean
         up together, the way a render farm's does.
     3 · REFLECTIONS. Glass that only reflects a blurred environment probe reads
         as plastic. Here: screen-space reflections, so the windows carry the
         actual building, the actual sky, the actual car.
     4 · IMPERFECTION. Nothing real is perfectly clean, perfectly sharp-edged,
         or free of services. Here: grime that collects where water runs, leaf
         cards over the canopy shells, and the downpipes, condensers, dish and
         service drop that every real house on that street has.
   ============================================================================ */
function boot() {
  const THREE = window.THREE;
  const canvas = document.getElementById('c');
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

  const Q = window.Perf ? Perf.detect()
    : { tier: 'high', dpr: Math.min(window.devicePixelRatio || 1, 2), antialias: true,
        shadows: true, shadowType: 'pcfsoft', shadowMap: 2048, anisotropy: 8,
        powerPreference: 'high-performance' };
  const TIER = Q.tier || 'high';
  const HI = TIER === 'high';

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: false,               // temporal jitter does the antialiasing
      powerPreference: Q.powerPreference || 'high-performance',
      alpha: false, stencil: false
    });
  } catch (e) { bootFail('WEBGL UNAVAILABLE ON THIS DEVICE'); return; }

  const WEBGL2 = !!renderer.capabilities.isWebGL2;
  if ('outputColorSpace' in renderer && THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
  else if (renderer.outputEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;      // fallback path only
  renderer.toneMappingExposure = 1.0;
  const SHADOW_TYPE = { basic: THREE.BasicShadowMap, pcf: THREE.PCFShadowMap, pcfsoft: THREE.PCFSoftShadowMap };
  renderer.shadowMap.enabled = Q.shadows !== false;
  renderer.shadowMap.type = SHADOW_TYPE[Q.shadowType] || THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  renderer.shadowMap.needsUpdate = Q.shadows !== false;

  const MAXANISO = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 4;
  const ANISO = Math.min(MAXANISO, HI ? 16 : 4);
  const MAXTEX = renderer.capabilities.maxTextureSize || 4096;

  /* Render scale. With temporal accumulation, supersampling is no longer the
     antialiasing strategy — the jittered accumulation is, and it is strictly
     better. Render close to 1:1 and spend the budget on GI rays instead. */
  const BASE_DPR = Math.min(Q.dpr || window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(HI ? Math.min(BASE_DPR * 1.15, 2) : BASE_DPR);
  renderer.setSize(window.innerWidth, window.innerHeight, false);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.5, 1200);

  /* ==========================================================================
     1 · PROCEDURAL TEXTURE KITS
     ========================================================================== */
  const texCache = {};
  const TEX_S = HI ? Math.min(2048, MAXTEX) : (TIER === 'medium' ? 1024 : 512);
  const TEX_S_SM = Math.max(256, TEX_S >> 2);

  function cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h || w; return c; }
  function asTex(canvas, srgb) {
    const t = new THREE.CanvasTexture(canvas);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = ANISO;
    if (srgb) { if ('colorSpace' in t && THREE.SRGBColorSpace) t.colorSpace = THREE.SRGBColorSpace; else t.encoding = THREE.sRGBEncoding; }
    return t;
  }
  function speckle(x, w, h, spread) {
    const img = x.getImageData(0, 0, w, h), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const r = (Math.random() - 0.5) * spread;
      d[i] = clamp(d[i] + r, 0, 255); d[i + 1] = clamp(d[i + 1] + r, 0, 255); d[i + 2] = clamp(d[i + 2] + r, 0, 255);
    }
    x.putImageData(img, 0, 0);
  }
  function noiseLayer(res) {
    const n = cv(res), nx = n.getContext('2d');
    const img = nx.createImageData(res, res);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = (Math.random() * 256) | 0;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
    }
    nx.putImageData(img, 0, 0);
    return n;
  }
  function fbmCanvas(size, base, oct) {
    const c = cv(size), x = c.getContext('2d');
    x.fillStyle = '#808080'; x.fillRect(0, 0, size, size);
    let alpha = 0.5, res = base || 4;
    x.imageSmoothingEnabled = true;
    for (let o = 0; o < (oct || 5); o++) {
      x.globalAlpha = alpha;
      x.drawImage(noiseLayer(res), 0, 0, size, size);
      alpha *= 0.55; res = Math.min(res * 2, size);
    }
    x.globalAlpha = 1;
    return c;
  }
  function normalFromHeight(hc, strength) {
    const w = hc.width, h = hc.height;
    const src = hc.getContext('2d').getImageData(0, 0, w, h).data;
    const out = cv(w, h), ox = out.getContext('2d');
    const img = ox.createImageData(w, h);
    const H = (X, Y) => src[(((Y + h) % h) * w + ((X + w) % w)) * 4] / 255;
    for (let Y = 0; Y < h; Y++) for (let X = 0; X < w; X++) {
      const dx = (H(X + 1, Y) - H(X - 1, Y)) * strength;
      const dy = (H(X, Y + 1) - H(X, Y - 1)) * strength;
      const il = 1 / Math.sqrt(dx * dx + dy * dy + 1);
      const i = (Y * w + X) * 4;
      img.data[i] = (-dx * il * 0.5 + 0.5) * 255;
      img.data[i + 1] = (dy * il * 0.5 + 0.5) * 255;
      img.data[i + 2] = (il * 0.5 + 0.5) * 255;
      img.data[i + 3] = 255;
    }
    ox.putImageData(img, 0, 0);
    return out;
  }
  function roughCanvas(size, base, blobs, blobVal, streaky) {
    const c = cv(size), x = c.getContext('2d');
    const b = (base * 255) | 0;
    x.fillStyle = 'rgb(' + b + ',' + b + ',' + b + ')'; x.fillRect(0, 0, size, size);
    for (let i = 0; i < blobs; i++) {
      const v = ((blobVal + (Math.random() - 0.5) * 0.1) * 255) | 0;
      x.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',0.35)';
      const px = Math.random() * size, py = Math.random() * size;
      x.save(); x.translate(px, py); x.rotate(Math.random() * Math.PI);
      if (streaky) x.scale(3 + Math.random() * 3, 1);
      x.beginPath(); x.arc(0, 0, 6 + Math.random() * 22, 0, 7); x.fill(); x.restore();
    }
    speckle(x, size, size, 14);
    return c;
  }

  function kitPlaster() {
    if (texCache.plaster) return texCache.plaster;
    const s = TEX_S, c = cv(s), x = c.getContext('2d');
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, s, s);
    x.globalAlpha = 0.115; x.drawImage(fbmCanvas(s, 10, 5), 0, 0);
    x.globalAlpha = 0.080; x.drawImage(fbmCanvas(s, 24, 4), 0, 0);
    x.globalAlpha = 1;
    /* A faint float direction, same principle as the east wall: broad
       horizontal sweeps at low amplitude. It is what stops a large flat wall
       reading as paint on cardboard, and because it is DIRECTIONAL it adds
       surface without ever looking like staining. */
    x.globalAlpha = 0.05;
    for (let i = 0; i < 40; i++) {
      const yy = Math.random() * s, hh = s * (0.010 + Math.random() * 0.035);
      const gg = x.createLinearGradient(0, yy - hh, 0, yy + hh);
      const up = Math.random() < 0.5;
      gg.addColorStop(0, 'rgba(255,255,255,0)');
      gg.addColorStop(0.5, up ? 'rgba(255,255,255,0.9)' : 'rgba(158,155,150,0.9)');
      gg.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = gg; x.fillRect(0, yy - hh, s, hh * 2);
    }
    x.globalAlpha = 1;
    // patch repairs: a real wall is skimmed in sections and they never match
    x.globalAlpha = 0.05;
    for (let i = 0; i < 9; i++) {
      x.save(); x.translate(Math.random() * s, Math.random() * s); x.rotate(Math.random() * 0.5 - 0.25);
      x.fillStyle = Math.random() < 0.5 ? '#8d8880' : '#ffffff';
      x.fillRect(0, 0, s * (0.1 + Math.random() * 0.25), s * (0.08 + Math.random() * 0.2));
      x.restore();
    }
    x.globalAlpha = 0.055;
    for (let i = 0; i < 26; i++) {
      const px = Math.random() * s, w = 2 + Math.random() * 9;
      const g = x.createLinearGradient(0, 0, 0, s);
      g.addColorStop(0, 'rgba(118,112,102,0.55)');
      g.addColorStop(0.5, 'rgba(140,134,124,0.20)');
      g.addColorStop(1, 'rgba(160,154,144,0)');
      x.fillStyle = g; x.fillRect(px, Math.random() * s * 0.2, w, s);
    }
    x.globalAlpha = 1;
    speckle(x, s, s, 7);
    const hs = TEX_S >> 1;
    const height = fbmCanvas(hs, 12, HI ? 6 : 3);
    speckle(height.getContext('2d'), hs, hs, 34);
    const kit = { map: asTex(c, true), ns: 0.72,
                  roughnessMap: asTex(roughCanvas(TEX_S_SM, 0.88, 22, 0.78, false), false) };
    if (TIER !== 'potato') kit.normalMap = asTex(normalFromHeight(height, 1.7), false);
    return texCache.plaster = kit;
  }
  /* Sand-float / sponge-float plaster for the east walls.

     Ported from V19's own sandFloat() — the version the owner likes — rather
     than reinvented. Its key ingredient, which two attempts here missed, is
     the TROWEL term: horizontal striation at two frequencies, warped by noise.

     That is the whole distinction. Directional striation reads as a surface a
     human floated. Random blobs of the same amplitude read as damp, which is
     exactly what my previous version produced. Same energy, opposite meaning —
     it is the DIRECTION that carries the craft, not the contrast.

     Kept from the original: the value-noise octaves, the trowel frequencies,
     and an albedo amplitude in the same range (raised a little, to ~13 %, as
     asked). Improved: 4x the resolution, a real tangent-space normal derived
     from the field instead of a 0.032 bumpScale, and fine grit on top for
     close range. */
  function kitSandFloat() {
    if (texCache.sandfloat) return texCache.sandfloat;
    const SIZE = HI ? Math.min(2048, MAXTEX) : 512;
    const cell = SIZE / 64;                       // same ratio as the original 512/8
    const gw = Math.round(SIZE / cell), gh = gw;
    const grid = new Float32Array(gw * gh);
    for (let i = 0; i < grid.length; i++) grid[i] = Math.random();
    const gAt = (ix, iy) => grid[(((iy % gh) + gh) % gh) * gw + (((ix % gw) + gw) % gw)];
    function smooth(px, py) {
      const x0 = Math.floor(px), y0 = Math.floor(py);
      const tx = px - x0, ty = py - y0;
