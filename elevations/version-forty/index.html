    const hgt = cv(s), hx = hgt.getContext('2d');
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, s, s);
    hx.fillStyle = '#808080'; hx.fillRect(0, 0, s, s);
    for (let i = 0; i < 520; i++) {
      const px = Math.random() * s, w = 2 + Math.random() * 10;
      const dark = Math.random() < 0.55;
      x.fillStyle = dark ? 'rgba(70,58,44,0.5)' : 'rgba(215,200,178,0.28)';
      hx.fillStyle = dark ? 'rgba(30,30,30,0.6)' : 'rgba(210,210,210,0.4)';
      let py = 0;
      while (py < s) {
        const seg = 16 + Math.random() * 68;
        const jx = px + (Math.random() - 0.5) * 10;
        x.fillRect(jx, py, w, seg); hx.fillRect(jx, py, w, seg);
        py += seg + Math.random() * 10;
      }
    }
    speckle(x, s, s, 20); speckle(hx, s, s, 24);
    const kit = { map: asTex(c, true), ns: 0.9,
                  roughnessMap: asTex(roughCanvas(TEX_S_SM, 0.95, 12, 0.85, false), false) };
    if (TIER !== 'potato') kit.normalMap = asTex(normalFromHeight(hgt, 1.6), false);
    return texCache.bark = kit;
  }
  function kitMetal() {
    if (texCache.metal) return texCache.metal;
    const s = TEX_S_SM * 2, c = cv(s), x = c.getContext('2d');
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, s, s);
    x.globalAlpha = 0.05; x.drawImage(fbmCanvas(s, 12, 3), 0, 0); x.globalAlpha = 1;
    speckle(x, s, s, 5);
    const hgt = fbmCanvas(s, 24, 3);
    const kit = { map: asTex(c, true), ns: 0.18,
                  roughnessMap: asTex(roughCanvas(s, 0.45, 14, 0.55, false), false) };
    if (TIER !== 'potato') kit.normalMap = asTex(normalFromHeight(hgt, 0.35), false);
    return texCache.metal = kit;
  }
  function kitCarPaint() {
    if (texCache.carPaint) return texCache.carPaint;
    const s = TEX_S_SM, c = cv(s), x = c.getContext('2d');
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, s, s);
    speckle(x, s, s, 4);
    return texCache.carPaint = { map: asTex(c, true), ns: 0.1,
      roughnessMap: asTex(roughCanvas(s, 0.2, 8, 0.28, false), false) };
  }
  function kitField() {
    if (texCache.field) return texCache.field;
    const s = HI ? 768 : 384, c = cv(s), x = c.getContext('2d');   // distant farmland, never inspected
    x.fillStyle = '#8d8468'; x.fillRect(0, 0, s, s);
    const plots = ['#94895f', '#7f8b52', '#a09468', '#6e7d47', '#9b9070', '#87834f', '#a89a72', '#77854c'];
    for (let i = 0; i < 54; i++) {
      x.save();
      x.translate(Math.random() * s, Math.random() * s);
      x.rotate(Math.random() * Math.PI);
      x.fillStyle = plots[(Math.random() * plots.length) | 0];
      x.globalAlpha = 0.55 + Math.random() * 0.35;
      const w = s * (0.07 + Math.random() * 0.20), h = s * (0.05 + Math.random() * 0.16);
      x.fillRect(-w / 2, -h / 2, w, h);
      x.globalAlpha = 0.32;
      x.fillStyle = '#4d5c33';
      x.fillRect(-w / 2, -h / 2, w, s * 0.005);
      x.fillRect(-w / 2, -h / 2, s * 0.005, h);
      x.restore();
    }
    x.globalAlpha = 0.5; x.drawImage(fbmCanvas(s, 6, 6), 0, 0);
    x.globalAlpha = 0.2; x.drawImage(fbmCanvas(s, 18, 5), 0, 0);
    x.globalAlpha = 1;
    speckle(x, s, s, 18);
    return texCache.field = { map: asTex(c, true), ns: 0.3 };
  }

  const TEX = {
    plaster: kitPlaster, sandfloat: kitSandFloat, stone: kitStone, concrete: kitConcrete, wood: kitWood,
    tile: kitTile, paver: kitPaver, asphalt: kitAsphalt, grass: kitGrass,
    dirt: kitDirt, leaf: kitLeaf, bark: kitBark, metal: kitMetal,
    carPaint: kitCarPaint, field: kitField
  };

  /* ==========================================================================
     2 · MATERIAL TREATMENTS
     ========================================================================== */
  const C = window.HouseScene.COLORS;
  const UNMAPPED = {};

  function treatment(name) {
    switch (name) {
      case 'white':       return { tex: 'plaster', tile: 3.0, rough: 0.93, metal: 0, env: 0.45, grime: 1.0 };
      case 'white2':      return { tex: 'plaster', tile: 2.6, rough: 0.90, metal: 0, env: 0.48, grime: 0.7 };
      /* 1.0 m tile. At 2048 px that is ~0.5 mm per texel, so the grains land
         at roughly their real size instead of being stretched into patches.
         Low grime as well — the previous 0.9 was adding its own streaks on top
         of an already-blotchy map and compounding the stained look. */
      case 'eastPlaster': return { tex: 'sandfloat', tile: 1.0, rough: 0.98, metal: 0, env: 0.34, grime: 0.35 };
      case 'sand':        return { tex: 'plaster', tile: 2.8, rough: 0.94, metal: 0, env: 0.42, grime: 1.0 };
      case 'tank':        return { tex: 'plaster', tile: 1.4, rough: 0.62, metal: 0, env: 0.45, grime: 0.5 };
      case 'nbr1': case 'nbr2': case 'nbr3':
        return { tex: 'plaster', tile: 3.6, rough: 0.95, metal: 0, env: 0.38, grime: 1.4 };
      case 'stone':       return { tex: 'stone', tile: 2.4, rough: 0.62, metal: 0, env: 0.55, grime: 0.8 };
      case 'copingLight': return { tex: 'stone', tile: 2.0, rough: 0.60, metal: 0, env: 0.58, grime: 0.9 };
      case 'plinth':      return { tex: 'stone', tile: 1.8, rough: 0.72, metal: 0, env: 0.48, grime: 1.5 };
      case 'charcoal': case 'charDark': case 'solarFrm':
        return { tex: 'concrete', tile: 3.4, rough: 0.86, metal: 0, env: 0.45, grime: 1.1 };
      case 'concrete':    return { tex: 'concrete', tile: 2.6, rough: 0.92, metal: 0, env: 0.40, grime: 1.2 };
      /* Outdoor tile — matte, not polished. It shares the vitrified-tile kit
         with the indoor floors and that kit's roughness map is authored around
         0.35, which turned the open terrace into a mirror of its own pergola
         and railing. `matte` skips the kit's roughness map so the literal
         value below survives. Same change as the root viewer. */
      case 'terraceF': case 'balcTile': case 'tOut':
        return { tex: 'tile', tile: 1.35, rough: 0.78, metal: 0, env: 0.40, reflect: 0.09, matte: true };
      // Dry paving is not a mirror — it only reflects at grazing angles, and
      // the SSR pass already applies Fresnel on top of these. Anything above
      // ~0.1 here and the street reads as wet.
      case 'pave': case 'paver': case 'paver2':
        return { tex: 'paver', tile: 1.4, rough: 0.90, metal: 0, env: 0.36, reflect: 0.05 };
      case 'road':        return { tex: 'asphalt', tile: 7.0, rough: 0.96, metal: 0, env: 0.24, reflect: 0.05 };
      case 'roadLine':    return { tex: 'concrete', tile: 1.4, rough: 0.80, metal: 0, env: 0.30 };
      case 'ground':      return { tex: 'field', tile: 46, rough: 1.0, metal: 0, env: 0.28 };
      case 'plotPad':     return { tex: 'dirt', tile: 9.0, rough: 1.0, metal: 0, env: 0.28 };
      case 'soil':        return { tex: 'dirt', tile: 0.7, rough: 1.0, metal: 0, env: 0.20 };
      case 'grass':       return { tex: 'grass', tile: 2.4, rough: 1.0, metal: 0, env: 0.30 };
      case 'leafDark': case 'leafLight':
        return { tex: 'leaf', tile: 1.5, rough: 0.90, metal: 0, env: 0.42, cutout: 0.48, twoSided: true };
      case 'green': case 'green2':
        return { tex: 'leaf', tile: 1.1, rough: 0.90, metal: 0, env: 0.40, cutout: 0.40, twoSided: true };
      case 'boug': case 'ixora': case 'flowerPink':
        return { tex: 'leaf', tile: 0.45, rough: 0.85, metal: 0, env: 0.4 };
      case 'bark': case 'barkLight':
        return { tex: 'bark', tile: 0.6, rough: 0.95, metal: 0, env: 0.28 };
      case 'walnut': case 'woodF': case 'woodD': case 'skirt':
        return { tex: 'wood', tile: 1.0, rough: 0.42, metal: 0, env: 0.75, reflect: 0.3 };
      case 'ms':         return { tex: 'metal', tile: 0.8, rough: 0.42, metal: 0.30, env: 1.0, reflect: 0.35 };
      case 'frame':      return { tex: 'metal', tile: 0.6, rough: 0.36, metal: 0.65, env: 1.05, reflect: 0.5 };
      /* Balustrades and the gate. The palette calls these stainless and at
         metalness 1.0 with a light base they behave like one: a mirror pointed
         at a bright sky, which renders as a pale washed-out line exactly where
         the facade most needs a crisp one. Real architectural balustrades are
         nearly always powder-coated mild steel — a dielectric with a dark
         colour and a soft sheen. Treated as that, so the horizontals read as
         fine dark lines instead of dissolving into the wall behind them. */
      case 'steel':
        return { tex: 'metal', tile: 0.5, rough: 0.44, metal: 0.28, env: 0.80, reflect: 0.28 };
      case 'liftSteel': case 'liftDoor':
        return { rough: 0.26, metal: 1.0, env: 1.15, reflect: 0.8 };
      case 'brass': case 'accentWarm':
        return { rough: 0.30, metal: 0.92, env: 1.15, reflect: 0.7 };
      case 'chrome': case 'liftChrome':
        return { rough: 0.14, metal: 1.0, env: 1.15, reflect: 0.9 };
      case 'solar':      return { rough: 0.10, metal: 0.55, env: 1.45, reflect: 0.9 };
      case 'nbrWin':     return { rough: 0.08, metal: 0.45, env: 1.35, reflect: 0.9 };
      case 'whiteG':     return { rough: 0.08, metal: 0.02, env: 1.1, reflect: 0.6 };
      case 'tharRed': case 'carBody':
        return { tex: 'carPaint', tile: 0.5, rough: 0.16, metal: 0.85, env: 1.5, reflect: 0.95 };
      case 'carDark':    return { rough: 0.55, metal: 0.25, env: 0.6 };
      case 'fabric': case 'fabric2': case 'curtain': case 'curtain2': case 'rug':
        return { tex: 'plaster', tile: 0.7, rough: 0.95, metal: 0, env: 0.3 };
      /* The east vertical fins. Thin members, so a small tile: box-projected
         UVs give a 40 mm-wide fin a near-constant u, which makes it display one
         entire copy of the texture down its face — any low-frequency blob in
         the map then lands on the screen as a metre-wide stain. Low grime too;
         a vertical fin sheds rather than collects. Colour is left exactly as
         the palette has it. */
      case 'fin': case 'fin2':
        return { tex: 'plaster', tile: 1.5, rough: 0.88, metal: 0, env: 0.55, grime: 0.35 };
      // Handled by their own branches in the re-skin loop, but named here so
      // they do not register as unmapped and make the coverage report lie.
      case 'glass': case 'carGlass':  return { handledElsewhere: true };
      case 'lamp': case 'downlight':  return { handledElsewhere: true };
      case 'dark':       return { rough: 0.55, metal: 0.1, env: 0.4 };
      default:
        // Anything reaching here is an untextured surface. Recorded so coverage
        // can be asserted rather than assumed — see the report below.
        UNMAPPED[name] = (UNMAPPED[name] || 0) + 1;
        return { tex: 'plaster', tile: 2.4, rough: 0.85, metal: 0, env: 0.5 };
    }
  }

  /* ---- palette: white + a grey scale, nothing warm ----------------------
     Every warm note is gone. The lime-white now reads as white, the greige
     becomes a true neutral light grey, and the timber doors become dark grey
     like the rest of the metalwork. A monochrome scheme cannot clash with
     itself — the only job left is spacing the values evenly, which is what
     makes it read as designed rather than as beige.

     Value ladder, lightest to darkest:
       white2 / white   body plaster, soffits, reveals   — bright
       fin / fin2       east screen                       — bright
       copingLight      wall copings                      — light
       eastPlaster      east face                         — light grey, TEXTURED
       sand / stone     secondary planes                  — light grey
       plinth           base course                       — mid grey
       charDark         slab fascias, soffits             — grey
       charcoal         compound wall, site masonry       — deeper grey
       walnut / woodD   doors                             — dark grey
       steel            balustrades, gate                 — anthracite
       ms               grilles, railings                 — graphite
       frame            window frames                     — near-black          */
  const COL = {
    white:      0xf7f6f4,   // brighter — it should read as white, not cream
    white2:     0xfbfaf9,
    fin:        0xf1f0ee,
    fin2:       0xf7f6f5,
    // East face: a light NEUTRAL grey, half a step off the body, so the
    // sand-float has something to sit on and the plane reads as its own.
    eastPlaster:0xd9dad9,
    sand:       0xd6d7d6,
    stone:      0xd4d5d4,
    copingLight:0xe9eae9,
    tank:       0xe9eaea,
    plinth:     0x9fa1a1,
    charDark:   0x76797a,   // slab fascias + soffits
    charcoal:   0x6a6d6e,   // compound wall + site masonry
    /* Doors in timber. 'walnut' is the door leaf and 'woodD' its mouldings
       and frames, so both are wood; 'woodF' is balcony furniture, kept in the
       same family. The grain map is neutral now, so these colours land true
       instead of the muddy grey-brown a warm map would have given.
       One warm accent against white walls and graphite metal — which is the
       classic reason it works, and the only warmth left in the scheme. */
    walnut:     0x8a5c31,   // GF / FF / terrace door leaves — teak
    woodD:      0x6b4524,   // door mouldings, frames, furniture edges
    woodF:      0x9a6e40,   // balcony furniture tops
    skirt:      0x4a4e51,   // skirting stays grey — it is not joinery
    // and the brass line becomes a satin grey, so nothing gold remains
    brass:      0x8d9295,
    accentWarm: 0x93989b,
    ms:         0x3c4043,
    frame:      0x26292c,
    steel:      0x44484c,
    chrome:     0x9aa1a7,
    solarFrm:   0x4a4640,

    ground:  0x9c9078, plotPad: 0xa3977d, soil: 0x5d4b34,
    grass:   0x66794a, road: 0x494b4f,
    leafDark: 0x34492a, leafLight: 0x5d7838,
    green: 0x4a5f34, green2: 0x5a7239,
    boug: 0xa8496f, ixora: 0xbc5c33, flowerPink: 0xc06a86
  };

  const hex2name = {};
  for (const k in C) { if (!(C[k] in hex2name)) hex2name[C[k]] = k; }

  function boxUV(geo, tile) {
    const p = geo.attributes.position, n = geo.attributes.normal;
    if (!p || !n) return;
    const uv = new Float32Array(p.count * 2), inv = 1 / tile;
    for (let i = 0; i < p.count; i++) {
      const px = p.getX(i), py = p.getY(i), pz = p.getZ(i);
      const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
      let u, v;
      if (ay >= ax && ay >= az) { u = px; v = pz; }
      else if (ax >= az) { u = pz; v = py; }
      else { u = px; v = py; }
      uv[2 * i] = u * inv; uv[2 * i + 1] = v * inv;
    }
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  }

  /* ==========================================================================
     3 · SKY, IBL, SUN
     ========================================================================== */
  /* Anantapur: 14°N, semi-arid, ~300 clear days a year. The sky is a pale
     hazy blue rather than an alpine one, there is dust in the air, and the
     ground is dry ochre — so warm bounce reaches every shaded face. That bounce
     is the climate signature and it is present in all three presets.

     The three now differ mainly in SUN ANGLE, which is what actually changes a
     facade. Hue moves only a little. The previous set swung the whole sky from
     blue (0x87b2da) to grey-lavender (0x9fa2b6) and the haze from cold to
     orange, so they read as three different colour schemes rather than one
     house at three hours of the same day. */
  const SUNS = {
    morning: {                                    // ~9 am, low ESE
      dir: [0.83, 0.39, 0.22], sunC: 0xfff0d8, sunI: 2.30,
      hemiSky: 0xc3d4e4, hemiGnd: 0xd0a878, hemiI: 0.34,
      skyTop: 0x3a72b4, skyMid: 0x9dc0dd, skyBot: 0xe8ddc8,
      fog: 0xd6dbd8, exp: 0.96, fillC: 0xdcc9a8, fillI: 0.17,
      envHz: '#e9e2d0', envGnd: '#b18f61'
    },
    midday: {                                     // high sun, bleached and flat
      dir: [0.30, 0.90, 0.24], sunC: 0xfff8ec, sunI: 2.55,
      hemiSky: 0xbed0e4, hemiGnd: 0xcda875, hemiI: 0.38,
      skyTop: 0x3570b0, skyMid: 0xa2c4e0, skyBot: 0xe4dcc9,
      fog: 0xd4dad9, exp: 0.91, fillC: 0xdac9ac, fillI: 0.16,
      envHz: '#e7e0ce', envGnd: '#b2926a'
    },
    golden: {                                     // ~5 pm, raking, warm not orange
      dir: [0.88, 0.235, 0.20], sunC: 0xffdcae, sunI: 2.20,
      hemiSky: 0xc8cbd4, hemiGnd: 0xc89a68, hemiI: 0.30,
      skyTop: 0x3a6ba2, skyMid: 0xb9bfcb, skyBot: 0xf0cfa4,
      fog: 0xe2cfb4, exp: 0.99, fillC: 0xd0b490, fillI: 0.15,
      envHz: '#f0dcbc', envGnd: '#a07f56'
    }
  };
  let sunKey = 'morning';
  const SUN_DIR = new THREE.Vector3().fromArray(SUNS.morning.dir).normalize();

  function cloudNoiseCanvas(size) {
    const c = cv(size), x = c.getContext('2d');
    x.fillStyle = '#828282'; x.fillRect(0, 0, size, size);
    for (let i = 0; i < 1100; i++) {
      const r = 5 + Math.pow(Math.random(), 2.2) * 72;
      const px = Math.random() * size, py = Math.random() * size;
      const bright = Math.random() > 0.44;
      const a = 0.05 + Math.random() * 0.13;
      for (const ox of [0, -size, size]) for (const oy of [0, -size, size]) {
        if ((ox && Math.abs(px + ox - size / 2) > size / 2 + r) ||
            (oy && Math.abs(py + oy - size / 2) > size / 2 + r)) continue;
        const g = x.createRadialGradient(px + ox, py + oy, 0, px + ox, py + oy, r);
        g.addColorStop(0, (bright ? 'rgba(255,255,255,' : 'rgba(18,18,18,') + a.toFixed(3) + ')');
        g.addColorStop(1, 'rgba(128,128,128,0)');
        x.fillStyle = g; x.fillRect(px + ox - r, py + oy - r, r * 2, r * 2);
      }
    }
    return c;
  }
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      top: { value: new THREE.Color(SUNS.morning.skyTop) },
      mid: { value: new THREE.Color(SUNS.morning.skyMid) },
      bot: { value: new THREE.Color(SUNS.morning.skyBot) },
      sunDir: { value: SUN_DIR.clone() },
      sunTint: { value: new THREE.Color(0xffeecf) },
      skyGain: { value: 1.15 },
      tNoise: { value: asTex(cloudNoiseCanvas(512), false) }
    },
    vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `
      varying vec3 vDir;
      uniform vec3 top; uniform vec3 mid; uniform vec3 bot; uniform vec3 sunDir; uniform vec3 sunTint;
      uniform float skyGain;
      uniform sampler2D tNoise;
      /* Every colour reaching this shader is LINEAR radiance, converted on the
         JS side. A raw ShaderMaterial is not touched by three's tone mapping or
         output encoding, so writing sRGB-valued numbers here used to look right
         on a direct-to-canvas render purely by accident — the canvas
         reinterpreted them as sRGB. Feed the same numbers into an HDR buffer
         that a real tone map then reads as radiance and the sky blows out to a
         white wash. */
      void main(){
        vec3 d = normalize(vDir);
        float h = clamp(d.y, -1.0, 1.0);
        vec3 col = h > 0.0 ? mix(mid, top, pow(h, 0.52)) : mix(mid, bot, pow(-h, 0.5));
        float haze = pow(1.0 - abs(h), 7.0);
        col = mix(col, vec3(0.86, 0.88, 0.88), haze * 0.16);
        float s = max(dot(d, normalize(sunDir)), 0.0);
        if (h > 0.012) {
          vec2 uv = d.xz / (d.y + 0.34);
          float n1 = texture2D(tNoise, uv * 0.30 + vec2(0.13, 0.40)).r;
          float n2 = texture2D(tNoise, uv * 0.84 + vec2(0.55, 0.10)).r;
          float n3 = texture2D(tNoise, uv * 2.20 + vec2(0.31, 0.77)).r;
          float n = n1 * 0.58 + n2 * 0.29 + n3 * 0.13;
          float cov = smoothstep(0.505, 0.655, n);
          float fade = smoothstep(0.055, 0.30, h);
          float dense = smoothstep(0.58, 0.78, n);
          vec3 cloudCol = mix(vec3(1.35, 1.34, 1.30), vec3(0.66, 0.68, 0.75), dense * 0.9);
          cloudCol += sunTint * pow(s, 3.0) * 0.45;
          col = mix(col, cloudCol, cov * fade * 0.88);
        }
        col *= skyGain;
        col += sunTint * pow(s, 1400.0) * 26.0;               // sun disc
        col += sunTint * pow(s, 6.0) * 0.28;                  // forward glare
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  const skyDome = new THREE.Mesh(new THREE.SphereGeometry(1000, 48, 24), skyMat);
  skyDome.frustumCulled = false;
  scene.add(skyDome);

  // fromEquirectangular is the robust path — pmrem.fromScene() over a custom
  // ShaderMaterial sky yields a malformed env map that NaNs every PBR surface.
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  let envRT = null;
  function buildEnv(S) {
    const w = HI ? 1024 : (TIER === 'medium' ? 512 : 256), h = w >> 1;
    const c = cv(w, h), x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, h);
    const hex = (n) => '#' + ('000000' + n.toString(16)).slice(-6);
    g.addColorStop(0.00, hex(S.skyTop));
    g.addColorStop(0.40, hex(S.skyMid));
    g.addColorStop(0.50, S.envHz);
    g.addColorStop(0.52, S.envGnd);
    g.addColorStop(1.00, S.envGnd);
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 18; i++) {
      const cx = Math.random() * w, cy = h * (0.12 + Math.random() * 0.28);
      const cg = x.createRadialGradient(cx, cy, 0, cx, cy, 26 + Math.random() * 54);
      cg.addColorStop(0, 'rgba(255,253,248,0.55)'); cg.addColorStop(1, 'rgba(255,253,248,0)');
      x.fillStyle = cg; x.fillRect(0, 0, w, h);
    }
    const d = new THREE.Vector3().fromArray(S.dir).normalize();
    const az = Math.atan2(d.x, d.z), el = Math.asin(d.y);
    const sx = (az / (Math.PI * 2) + 0.5) * w, sy = (0.5 - el / Math.PI) * h;
    const sg = x.createRadialGradient(sx, sy, 0, sx, sy, w * 0.11);
    sg.addColorStop(0, 'rgba(255,248,228,1)'); sg.addColorStop(1, 'rgba(255,248,228,0)');
    x.fillStyle = sg; x.fillRect(0, 0, w, h);
    const eq = new THREE.CanvasTexture(c);
    eq.mapping = THREE.EquirectangularReflectionMapping;
    if ('colorSpace' in eq && THREE.SRGBColorSpace) eq.colorSpace = THREE.SRGBColorSpace; else eq.encoding = THREE.sRGBEncoding;
    const rt = pmrem.fromEquirectangular(eq);
    eq.dispose();
    if (envRT) envRT.dispose();
    envRT = rt;
    scene.environment = rt.texture;
  }

  const hemi = new THREE.HemisphereLight(SUNS.morning.hemiSky, SUNS.morning.hemiGnd, SUNS.morning.hemiI);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(SUNS.morning.sunC, SUNS.morning.sunI);
  sun.castShadow = Q.shadows !== false;
  const SHMAP = Math.min(MAXTEX, HI ? 4096 : (Q.shadowMap || 2048));
  sun.shadow.mapSize.set(SHMAP, SHMAP);
  const shc = sun.shadow.camera;
  shc.left = -42; shc.right = 42; shc.top = 42; shc.bottom = -42; shc.near = 20; shc.far = 210;
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.035;
  const sunTarget = new THREE.Object3D();
  sunTarget.position.set(8.3, 4.0, -4.4);
  scene.add(sunTarget); sun.target = sunTarget; scene.add(sun);
  const fill = new THREE.DirectionalLight(SUNS.morning.fillC, SUNS.morning.fillI);
  fill.position.set(-50, 34, -26);
  scene.add(fill);

  scene.fog = new THREE.Fog(SUNS.morning.fog, 250, 1100);
  scene.background = new THREE.Color(SUNS.morning.fog);

  const SKY_UP = new THREE.Color(), SKY_DN = new THREE.Color();
  function applySun(key) {
    const S = SUNS[key] || SUNS.morning;
    sunKey = key;
    SUN_DIR.fromArray(S.dir).normalize();
    sun.position.copy(SUN_DIR).multiplyScalar(110).add(sunTarget.position);
    sun.color.setHex(S.sunC); sun.intensity = S.sunI;
    hemi.color.setHex(S.hemiSky); hemi.groundColor.setHex(S.hemiGnd); hemi.intensity = S.hemiI;
    fill.color.setHex(S.fillC); fill.intensity = S.fillI;
    // The sky dome, the fog colour and the clear colour all feed a linear HDR
    // buffer when the pipeline is on, so they must be linear radiance. On the
    // fallback path they go straight to an sRGB canvas and must not be.
    const asLin = (hex) => POST.on ? new THREE.Color(hex).convertSRGBToLinear() : new THREE.Color(hex);
    skyMat.uniforms.top.value.copy(asLin(S.skyTop));
    skyMat.uniforms.mid.value.copy(asLin(S.skyMid));
    skyMat.uniforms.bot.value.copy(asLin(S.skyBot));
    skyMat.uniforms.sunDir.value.copy(SUN_DIR);
    skyMat.uniforms.sunTint.value.copy(asLin(S.sunC));
    skyMat.uniforms.skyGain.value = POST.on ? 1.15 : 1.0;
    scene.fog.color.copy(asLin(S.fog));
    scene.background.copy(asLin(S.fog));
    SKY_UP.setHex(S.skyMid).convertSRGBToLinear();
    SKY_DN.set(S.envGnd).convertSRGBToLinear();
    POST.exposure = S.exp;
    if (!POST.on) renderer.toneMappingExposure = S.exp;
    buildEnv(S);
    if (Q.shadows !== false) renderer.shadowMap.needsUpdate = true;
    document.querySelectorAll('#sun button').forEach(b =>
      b.classList.toggle('on', b.getAttribute('data-sun') === key));
    resetAccum();
  }

  /* ==========================================================================
     4 · BUILD + RE-SKIN
     ========================================================================== */
  say('BUILDING GEOMETRY');
  let data;
  try { data = window.HouseScene.build(THREE); }
  catch (err) { console.error(err); bootFail('SCENE BUILD FAILED: ' + (err && err.message ? err.message : err)); return; }
  scene.add(data.root);

  if (data.site) data.site.visible = true;
  if (data.exterior) data.exterior.visible = true;
  if (data.outdoors) data.outdoors.forEach(g => { g.visible = true; });
  if (data.floors) data.floors.forEach(f => { if (f.group) f.group.visible = false; });

  /* Grime. Water runs down a wall, collects dirt, and leaves it where the wall
     meets the ground and under every horizontal that sheds. No real building is
     the same tone top to bottom, and a uniform one is the single most reliable
     "this is CG" signal on a plaster facade. Patched into the standard shader
     so it works off true world position rather than baked UVs. */
  function addGrime(m, amount) {
    m.onBeforeCompile = (sh) => {
      sh.uniforms.uGrime = { value: amount };
      sh.vertexShader = 'varying vec3 vWP_;\nvarying vec3 vWN_;\n' + sh.vertexShader.replace(
        '#include <begin_vertex>',
        '#include <begin_vertex>\n  vWP_ = (modelMatrix * vec4(transformed, 1.0)).xyz;\n  vWN_ = normalize(mat3(modelMatrix) * objectNormal);'
      );
      sh.fragmentShader = 'varying vec3 vWP_;\nvarying vec3 vWN_;\nuniform float uGrime;\n' + sh.fragmentShader.replace(
        '#include <map_fragment>',
        `#include <map_fragment>
         {
           float vert = 1.0 - abs(vWN_.y);                       // walls, not slabs
           float splash = exp(-max(vWP_.y - 0.05, 0.0) * 4.5);   // rain splash-back
           float base   = exp(-max(vWP_.y - 0.05, 0.0) * 1.1) * 0.45;
           float g = (splash * 0.85 + base) * vert * uGrime;
           // horizontal dust ledges: dirt sits on top of every up-facing plane
           float ledge = max(vWN_.y, 0.0) * 0.10 * uGrime;
           diffuseColor.rgb *= (1.0 - clamp(g, 0.0, 0.42));
           diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * vec3(0.94, 0.92, 0.86), clamp(ledge, 0.0, 0.3));
         }`
      );
    };
    m.customProgramCacheKey = () => 'grime' + amount.toFixed(2);
  }

  say('APPLYING PBR MATERIALS');
  const REFLECTIVE = [];                     // meshes worth tracing reflections for
  const doneMat = new Set();
  const COVERAGE = {};
  /* V19's garden is real 3D geometry that already carries its own photographic
     leaf cards, hedge and grass-blade textures, built in houseScene from the
     owner's own plant photos. Re-skinning it here would overwrite all of that
     with generic procedural foliage, so it is left alone — it still gets a
     normal-buffer material below, so GI, SSR and the edge pass all see it. */
  const gardenGroup = data.root.getObjectByName('garden');
  const inGarden = (o) => {
    for (let p = o; p; p = p.parent) if (p === gardenGroup) return true;
    return false;
  };

  data.root.traverse(o => {
    if (!o.isMesh || !o.material) return;
    const key = o.userData.matKey || hex2name[o.material.color ? o.material.color.getHex() : -1] || '';
    COVERAGE[key] = (COVERAGE[key] || 0) + 1;
    if (inGarden(o)) {
      o.castShadow = true; o.receiveShadow = true;
      o.userData.reflect = 0;
      return;
    }
    const t = treatment(key);
    const m = o.material;

    if (!doneMat.has(m)) {
      doneMat.add(m);
      m.userData.name = key;
      if (key === 'glass' || key === 'carGlass') {
        m.transparent = true; m.depthWrite = false;
        m.roughness = 0.045; m.metalness = 0.0;
        m.envMapIntensity = 1.6;
        if (key === 'carGlass') { m.color.setHex(0x171b1f); m.opacity = 0.86; }
        else { m.color.setHex(0x1e262c); m.opacity = 0.72; }
      } else if (key === 'lamp' || key === 'downlight') {
        if (m.emissive) m.emissive.setHex(0xffdcae);
        m.emissiveIntensity = 2.2; m.envMapIntensity = 0.2;
      } else {
        if ('roughness' in m) m.roughness = t.rough;
        if ('metalness' in m) m.metalness = t.metal || 0;
        m.envMapIntensity = t.env != null ? t.env : 0.5;
        if (COL[key] != null && m.color) m.color.copy(new THREE.Color(COL[key]).convertSRGBToLinear());
        /* Highlight shoulder, not a full-range squeeze.

           The old curve (0.035 + 0.76c) pulled the lime-white down 20 % — which
           it should, 0.87 linear is brighter than snow — but it also LIFTED the
           window frames by 16 %, because the +0.035 floor does proportionally
           most to the darkest values. It compressed the picture from both ends
           at once and took wall-to-railing contrast from 3.4:1 to 3.0:1.

           A shoulder only touches the top. Whites land where they should and
           every dark stays exactly as dark as the palette intended. */
        if (m.color) {
          const sh = (v) => v <= 0.45 ? v : 0.45 + (v - 0.45) * 0.58;
          m.color.r = sh(m.color.r);
          m.color.g = sh(m.color.g);
          m.color.b = sh(m.color.b);
        }
        m.bumpMap = null; m.bumpScale = 1;      // houseScene ships its own; it fights the normalMap
        if (t.tex && TEX[t.tex]) {
          const kit = TEX[t.tex]();
          m.map = kit.map;
          if (kit.normalMap) { m.normalMap = kit.normalMap; m.normalScale = new THREE.Vector2(kit.ns, kit.ns); }
          // `matte` treatments keep their literal roughness — the shared kits
          // encode the POLISHED version of each material (see 'terraceF').
          if (kit.roughnessMap && !t.matte) { m.roughnessMap = kit.roughnessMap; m.roughness = 1.0; }
          if (t.cutout && kit.alphaMap) { m.alphaMap = kit.alphaMap; m.alphaTest = t.cutout; }
        }
        if (t.twoSided) m.side = THREE.DoubleSide;
        if (t.grime) addGrime(m, t.grime);
      }
      m.needsUpdate = true;
    }

    if (t.tex) boxUV(o.geometry, t.tile);

    const isGlass = key === 'glass' || key === 'carGlass';
    o.castShadow = !(isGlass || key === 'ground' || key === 'plotPad' || key === 'road' || key === 'roadLine');
    o.receiveShadow = !isGlass;
    o.userData.reflect = isGlass ? 0.9 : (t.reflect || 0);
    if (o.userData.reflect > 0.05) REFLECTIVE.push(o);
  });

  /* Coverage report. "Every surface is textured" is a claim worth checking
     rather than asserting, so every palette key that appears in the geometry is
     counted and every key that fell through to the default branch is named. */
  const MATERIAL_COVERAGE = {
    keysInScene: Object.keys(COVERAGE).sort(),
    unmapped: Object.keys(UNMAPPED),
    gardenSkipped: !!gardenGroup
  };
  if (MATERIAL_COVERAGE.unmapped.length) {
    console.warn('[coverage] surfaces with no explicit treatment:', MATERIAL_COVERAGE.unmapped);
  } else {
    console.info('[coverage] all ' + MATERIAL_COVERAGE.keysInScene.length + ' surface types explicitly textured');
  }

  /* ==========================================================================
     5 · SURROUNDINGS, FOLIAGE FUZZ, SERVICES
     ========================================================================== */
  let seed = 20260814;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;

  /* The site ground box is 230 m and its edge shows against the sky from any
     drone-height camera, which reads as a diorama on a table. A field plane out
     past the fog distance gives a real ground-to-sky horizon.

     No trees, foliage cards or services are added here: V19 builds its own 3D
     garden (trunks, canopy volumes, hedge, grass tufts) and adding a second set
     would double it up. Nothing in this file adds an element to the design. */
  (function farGround() {
    const m = new THREE.MeshStandardMaterial({
      color: new THREE.Color(COL.ground).convertSRGBToLinear().multiplyScalar(0.76).addScalar(0.035),
      roughness: 1.0, metalness: 0.0, envMapIntensity: 0.28, map: TEX.field().map,
      polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2
    });
    const g = new THREE.CircleGeometry(900, 64);
    g.rotateX(-Math.PI / 2);
    // world-space UVs, matching how boxUV maps the site ground box — a
    // local-space mapping offsets the field pattern and the join shows as a
    // straight line ruled across the landscape
    const uv = g.attributes.uv, pos = g.attributes.position;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, (pos.getX(i) + 10.5) / 46, (pos.getZ(i) - 9.0) / 46);
    const mesh = new THREE.Mesh(g, m);
    mesh.position.set(10.5, 0.0, -9.0);
    mesh.receiveShadow = false; mesh.castShadow = false; mesh.frustumCulled = false;
    scene.add(mesh);
  })();

  /* ==========================================================================
     6 · RENDER PIPELINE
     scene + normals ▸ SSGI ▸ SSR ▸ composite ▸ temporal accumulate ▸ AgX
     ========================================================================== */
  const POST = { on: false, exposure: SUNS.morning.exp, render: null, samples: 0, max: 1 };
  let accumDirty = true;
  function resetAccum() { accumDirty = true; POST.samples = 0; }

  /* Per-mesh depth/normal/reflectivity material.

     Every visible mesh needs one. A mesh left out does not simply go missing
     from the buffer — it renders with its ORDINARY material, so its albedo
     lands in the normal channels and its opaque alpha reads as "fully
     reflective". That is how the distant fields turned into a lake and the
     canopies grew white speckles: SSR was faithfully reflecting the sky off
     everything that had been forgotten here.

     A shared overrideMaterial can't do the job either — three skips re-uploading
     uniforms when the material instance doesn't change between draws, so
     per-mesh reflectivity would never reach the shader. Hence one clone each. */
  const NR_VS = `
    varying vec3 vN; varying vec2 vUvNR;
    void main(){
      vUvNR = uv;
      #ifdef USE_INSTANCING
        mat4 im = instanceMatrix;
        vN = normalize(normalMatrix * (mat3(im) * normal));
        gl_Position = projectionMatrix * modelViewMatrix * im * vec4(position, 1.0);
      #else
        vN = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      #endif
    }`;
  const NR_FS = `
    varying vec3 vN; varying vec2 vUvNR;
    uniform float uRefl;
    uniform sampler2D uAlpha; uniform float uUseAlpha; uniform float uCut;
    void main(){
      if (uUseAlpha > 0.5 && texture2D(uAlpha, vUvNR).g < uCut) discard;
      gl_FragColor = vec4(normalize(vN) * 0.5 + 0.5, uRefl);
    }`;
  const nrList = [];
  function buildNormalMaterials() {
    nrList.length = 0;
    scene.traverse(o => {
      if (!o.isMesh || !o.material || o === skyDome) return;
      const m = o.material;
      const nm = new THREE.ShaderMaterial({
        vertexShader: NR_VS, fragmentShader: NR_FS,
        side: m.side, uniforms: {
          uRefl: { value: o.userData.reflect || 0 },
          uAlpha: { value: m.alphaMap || null },
          uUseAlpha: { value: m.alphaMap ? 1 : 0 },
          uCut: { value: m.alphaTest || 0.5 }
        }
      });
      nrList.push({ mesh: o, nr: nm });
    });
  }

  function renderNormals(rt) {
    for (const e of nrList) { e.mesh.userData._m = e.mesh.material; e.mesh.material = e.nr; }
    const bg = scene.background, fg = scene.fog;
    scene.background = null; scene.fog = null;
    skyDome.visible = false;
    renderer.setRenderTarget(rt);
    renderer.setClearColor(0x000000, 0);
    renderer.clear();
    renderer.render(scene, camera);
    skyDome.visible = true;
    scene.background = bg; scene.fog = fg;
    for (const e of nrList) e.mesh.material = e.mesh.userData._m;
  }

  buildNormalMaterials();   // after every mesh is in the scene, not before

  (function buildPipeline() {
    if (!WEBGL2 || TIER === 'low' || TIER === 'potato') return;
    POST.on = true;
    renderer.toneMapping = THREE.NoToneMapping;
    POST.max = HI ? 64 : 24;

    const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const fsGeo = new THREE.PlaneGeometry(2, 2);
    function pass(frag, uniforms) {
      const m = new THREE.ShaderMaterial({
        uniforms, depthTest: false, depthWrite: false,
        vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
        fragmentShader: frag
      });
      const sc = new THREE.Scene(); sc.add(new THREE.Mesh(fsGeo, m));
      return { scene: sc, mat: m, u: uniforms };
    }

    const COMMON = `
      uniform sampler2D tDepth; uniform sampler2D tNorm; uniform sampler2D tColor;
      uniform mat4 projInv; uniform mat4 proj; uniform vec2 res; uniform float uSeed;
      float readDepth(vec2 uv){ return texture2D(tDepth, uv).x; }
      vec3 viewPos(vec2 uv){
        float d = readDepth(uv);
        vec4 ndc = vec4(uv * 2.0 - 1.0, d * 2.0 - 1.0, 1.0);
        vec4 v = projInv * ndc;
        return v.xyz / v.w;
      }
      vec3 viewNorm(vec2 uv){ return normalize(texture2D(tNorm, uv).xyz * 2.0 - 1.0); }
      /* Sky test. NOT a depth threshold: the dome sits at r=1000 against a far
         plane of 1200, so its window depth is 0.99991 — under any "close to
         1.0" epsilon you would naturally pick. Treated as geometry, every sky
         pixel gets ray-marched with a garbage normal and has bounce light
         injected into it, which turns a deep blue sky into flat white haze.
         The normal buffer is cleared to zero and the dome is excluded from it,
         so an all-zero texel is exactly and only sky. */
      bool isSky(vec2 uv){ vec3 r = texture2D(tNorm, uv).xyz; return dot(r, r) < 0.0015; }
      vec2 project(vec3 vp){
        vec4 c = proj * vec4(vp, 1.0);
        return (c.xy / c.w) * 0.5 + 0.5;
      }
      float hash13(vec3 p){
        p = fract(p * 0.1031); p += dot(p, p.yzx + 33.33);
        return fract((p.x + p.y) * p.z);
      }`;

    /* --- SSGI. Cosine-sample the hemisphere, march each ray through the depth
       buffer, and look at what it hits.

       The ray result is stored as a DIFFERENCE, not as radiance: (hit colour −
       sky reference). This matters. The forward pass has already lit every
       pixel with an IBL that assumed open sky in all directions, so adding raw
       bounce radiance on top double-counts and floods the shadows — the whole
       frame goes milky and cast shadows disappear, which is exactly what raw
       SSGI does to a forward renderer. As a difference it is self-correcting
       and unifies both effects: a ray that hits something darker than sky
       subtracts (that is ambient occlusion), one that hits a sunlit wall adds
       (that is colour bleed), and one that sees sky changes nothing because the
       IBL already had it right.

       Two rays per pixel is far too few to be smooth — which is what the
       temporal accumulation is for. The noise is zero-mean, so 64 frames of
       different seeds converge on the true integral. */
    const giPass = pass(COMMON + `
      varying vec2 vUv;
      uniform float uRadius; uniform float uThickness; uniform vec3 uSkyRef;
      void main(){
        if (isSky(vUv)) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }
        vec3 P = viewPos(vUv);
        vec3 N = viewNorm(vUv);
        vec3 T = normalize(abs(N.z) < 0.9 ? cross(N, vec3(0.0, 0.0, 1.0)) : cross(N, vec3(1.0, 0.0, 0.0)));
        vec3 B = cross(N, T);
        vec3 gi = vec3(0.0); float occ = 0.0;
        const int RAYS = 2, STEPS = 12;
        for (int r = 0; r < RAYS; r++) {
          float h1 = hash13(vec3(vUv * res, uSeed + float(r) * 17.3));
          float h2 = hash13(vec3(vUv * res + 91.7, uSeed * 1.7 + float(r) * 7.1));
          float phi = 6.2831853 * h1;
          float ct = sqrt(1.0 - h2);              // cosine-weighted
          float st = sqrt(h2);
          vec3 dir = normalize(T * (cos(phi) * st) + B * (sin(phi) * st) + N * ct);
          float stepLen = uRadius / float(STEPS);
          vec3 pos = P + N * 0.02;
          bool hit = false;
          for (int s = 0; s < STEPS; s++) {
            pos += dir * stepLen * (1.0 + float(s) * 0.35);   // grow strides
            vec2 uv = project(pos);
            if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) break;
            if (isSky(uv)) continue;              // a ray that sees sky is a miss
            vec3 sp = viewPos(uv);
            float diff = sp.z - pos.z;            // view space: -z is forward
            if (diff > 0.0 && diff < uThickness) {
              // distance falloff: a wall 20 m away contributes far less bounce
              // than the soffit 1 m overhead, and without this the far side of
              // the street lights the portico
              float fall = 1.0 / (1.0 + length(pos - P) * 0.55);
              gi += (texture2D(tColor, uv).rgb - uSkyRef) * fall;
              occ += fall; hit = true; break;
            }
          }
          if (!hit) gi += vec3(0.0);
        }
        gi /= float(RAYS);
        float ao = 1.0 - occ / float(RAYS);
        gl_FragColor = vec4(gi, ao);
      }`,
      { tDepth: { value: null }, tNorm: { value: null }, tColor: { value: null },
        projInv: { value: new THREE.Matrix4() }, proj: { value: new THREE.Matrix4() },
        res: { value: new THREE.Vector2(1, 1) }, uSeed: { value: 0 },
        uRadius: { value: 4.0 }, uThickness: { value: 1.4 },
        uSkyRef: { value: new THREE.Vector3(0.42, 0.46, 0.52) } });

    // depth-aware cross blur — cleans single-frame noise without bleeding
    // across silhouettes; accumulation then does the rest
    const blurFrag = `
      varying vec2 vUv;
      uniform sampler2D tGI; uniform sampler2D tDepth;
      uniform vec2 dir; uniform vec2 res; uniform vec2 nearFar;
      float linZ(float d){ return nearFar.x * nearFar.y / (nearFar.y - d * (nearFar.y - nearFar.x)); }
      void main(){
        float z0 = linZ(texture2D(tDepth, vUv).x);
        vec4 sum = texture2D(tGI, vUv); float wsum = 1.0;
        for (int i = 1; i <= 5; i++) {
          vec2 o = dir * float(i) / res;
          for (int s = 0; s < 2; s++) {
            vec2 uv = s == 0 ? vUv + o : vUv - o;
            float z = linZ(texture2D(tDepth, uv).x);
            float w = exp(-float(i * i) * 0.10) * smoothstep(0.08, 0.0, abs(z - z0) / max(z0, 0.2));
            sum += texture2D(tGI, uv) * w; wsum += w;
          }
        }
        gl_FragColor = sum / wsum;
      }`;
    const nf = { value: new THREE.Vector2(camera.near, camera.far) };
    const blurH = pass(blurFrag, { tGI: { value: null }, tDepth: { value: null }, dir: { value: new THREE.Vector2(1, 0) }, res: { value: new THREE.Vector2(1, 1) }, nearFar: nf });
    const blurV = pass(blurFrag, { tGI: { value: null }, tDepth: { value: null }, dir: { value: new THREE.Vector2(0, 1) }, res: { value: new THREE.Vector2(1, 1) }, nearFar: nf });

    /* --- SSR. Only for surfaces flagged reflective (alpha of the normal
       buffer). Rays that leave the screen fall back to the sky gradient, so a
       window at the frame edge still reflects something plausible rather than
       going black — off-screen fallback is the difference between SSR that
       helps and SSR that draws attention to itself. */
    const ssrPass = pass(COMMON + `
      varying vec2 vUv;
      uniform vec3 skyUp; uniform vec3 skyDn; uniform mat4 viewInv;
      void main(){
        float refl = texture2D(tNorm, vUv).a;
        if (refl < 0.05 || isSky(vUv)) { gl_FragColor = vec4(0.0); return; }
        vec3 P = viewPos(vUv);
        vec3 N = viewNorm(vUv);
        vec3 V = normalize(P);
        vec3 R = reflect(V, N);
        float fres = pow(1.0 - max(dot(-V, N), 0.0), 4.0);
        float strength = refl * mix(0.22, 1.0, fres);
        vec3 pos = P + N * 0.03;
        float stepLen = 0.22;
        vec3 col = vec3(0.0); float found = 0.0;
        for (int s = 0; s < 28; s++) {
          pos += R * stepLen;
          stepLen *= 1.16;
          vec2 uv = project(pos);
          if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) break;
          if (isSky(uv)) continue;               // let the sky fallback handle it
          vec3 sp = viewPos(uv);
          float diff = sp.z - pos.z;
          if (diff > 0.0 && diff < stepLen * 2.2) {
            // fade at the screen border so reflections don't pop at the edge
            vec2 e = smoothstep(vec2(0.0), vec2(0.10), uv) * (1.0 - smoothstep(vec2(0.90), vec2(1.0), uv));
            col = texture2D(tColor, uv).rgb; found = min(e.x, e.y);
            break;
          }
        }
        vec3 wR = normalize((viewInv * vec4(R, 0.0)).xyz);
        vec3 sky = mix(skyDn, skyUp, clamp(wR.y * 0.5 + 0.5, 0.0, 1.0));
        col = mix(sky, col, found);
        gl_FragColor = vec4(col, strength);
      }`,
      { tDepth: { value: null }, tNorm: { value: null }, tColor: { value: null },
        projInv: { value: new THREE.Matrix4() }, proj: { value: new THREE.Matrix4() },
        res: { value: new THREE.Vector2(1, 1) }, uSeed: { value: 0 },
        skyUp: { value: new THREE.Color(0x87b2da) }, skyDn: { value: new THREE.Color(0xad8a5c) },
        viewInv: { value: new THREE.Matrix4() } });

    /* --- Composite, plus the edge treatment.

       Nothing in the world has a mathematically perfect 90° arris. Every real
       corner is chipped, chamfered or rendered slightly round by the plaster
       itself, and at any distance that reads as a bright hairline on the convex
       edge and a dark one in the concave corner. Their absence is the single
       most persistent "this is CG" signal left on a clean facade, and it cannot
       be fixed with textures because it is a geometry cue.

       Rebuilding the model with bevelled solids is the correct fix and is not
       available here — the geometry arrives pre-merged. So the curvature is
       recovered in screen space instead: compare each pixel's plane against its
       neighbours' positions, and light the result the way a real chamfer would
       catch the sky. */
    const compPass = pass(`
      varying vec2 vUv;
      uniform sampler2D tCol; uniform sampler2D tGI; uniform sampler2D tSSR;
      uniform sampler2D tDepth; uniform sampler2D tNorm;
      uniform mat4 projInv; uniform vec2 res;
      uniform float aoStrength; uniform float giStrength; uniform float edgeAmt;

      vec3 viewPosC(vec2 uv){
        float d = texture2D(tDepth, uv).x;
        vec4 ndc = vec4(uv * 2.0 - 1.0, d * 2.0 - 1.0, 1.0);
        vec4 v = projInv * ndc;
        return v.xyz / v.w;
      }
      float cavity(vec2 uv){
        vec3 rawN = texture2D(tNorm, uv).xyz;
        if (dot(rawN, rawN) < 0.0015) return 0.0;              // sky
        vec3 N = normalize(rawN * 2.0 - 1.0);
        vec3 P = viewPosC(uv);
        vec2 px = 1.0 / res;
        float acc = 0.0;
        for (int i = 0; i < 4; i++) {
          vec2 o = i == 0 ? vec2(px.x, 0.0) : i == 1 ? vec2(-px.x, 0.0)
                 : i == 2 ? vec2(0.0, px.y) : vec2(0.0, -px.y);
          vec3 dv = viewPosC(uv + o) - P;
          float len = length(dv);
          if (len < 1e-5 || len > 0.35) continue;              // ignore silhouettes
          acc += dot(dv / len, N);
        }
        return clamp(acc * 0.5, -1.0, 1.0);
      }

      void main(){
        vec3 c = texture2D(tCol, vUv).rgb;
        vec4 gi = texture2D(tGI, vUv);
        // A small extra occlusion term for the tight creases the ray march is
        // too coarse to resolve — reveals, soffit corners, the stair underside.
        float ao = mix(1.0, clamp(gi.a, 0.0, 1.0), aoStrength);
        c *= ao;
        // Bounce is tinted by the RECEIVER's albedo as well as the source's
        // colour. A forward renderer has no albedo buffer, so take the
        // receiver's hue from its own shaded colour normalised to unit
        // luminance: correct hue, no double-counted brightness.
        float lum = max(dot(c, vec3(0.2126, 0.7152, 0.0722)), 1e-3);
        vec3 tint = clamp(c / lum, 0.0, 2.0);
        c += gi.rgb * giStrength * tint;
        c = max(c, vec3(0.0));
        // convex arris catches sky, concave corner loses it
        float cav = cavity(vUv);
        c *= 1.0 + clamp(-cav, 0.0, 1.0) * edgeAmt * 0.9      // convex: highlight
                 - clamp( cav, 0.0, 1.0) * edgeAmt * 1.25;    // concave: contact shade
        vec4 ssr = texture2D(tSSR, vUv);
        c = mix(c, ssr.rgb, clamp(ssr.a, 0.0, 0.92));
        gl_FragColor = vec4(max(c, vec3(0.0)), 1.0);
      }`,
      { tCol: { value: null }, tGI: { value: null }, tSSR: { value: null },
        tDepth: { value: null }, tNorm: { value: null },
        projInv: { value: new THREE.Matrix4() }, res: { value: new THREE.Vector2(1, 1) },
        aoStrength: { value: 0.30 }, giStrength: { value: 0.42 }, edgeAmt: { value: 0.5 } });

    // temporal accumulation — the whole point of jittering the projection
    const accPass = pass(`
      varying vec2 vUv;
      uniform sampler2D tNew; uniform sampler2D tOld; uniform float w;
      void main(){
        vec3 n = texture2D(tNew, vUv).rgb;
        vec3 o = texture2D(tOld, vUv).rgb;
        gl_FragColor = vec4(mix(o, n, w), 1.0);
      }`,
      { tNew: { value: null }, tOld: { value: null }, w: { value: 1 } });

    /* --- Output. AgX rather than ACES: ACES pushes bright saturated values
       toward its primaries and skews hue as it clips, which on a sunlit
       white-plaster facade shows as that faintly plastic, slightly pink
       highlight roll-off. AgX desaturates into the highlight instead, the way
       film and every modern camera pipeline does. */
    const outPass = pass(`
      varying vec2 vUv;
      uniform sampler2D tCol; uniform sampler2D tDepth;
      uniform vec2 res; uniform float exposure; uniform float t;
      uniform float focusZ; uniform float dofAmt; uniform vec2 nearFar;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      float linZ(float d){ return nearFar.x * nearFar.y / (nearFar.y - d * (nearFar.y - nearFar.x)); }

      // three.js's fitted ACES (Stephen Hill). Tried AgX here — it is the more
      // modern transform and rolls highlights off more gracefully, but it is a
      // display transform with no look attached, and on this scene it landed
      // visibly flatter than the reference direct render for no gain worth the
      // risk. A plain Narkowicz fit is not a substitute: it reads washed grey.
      vec3 RRTAndODTFit(vec3 v){
        vec3 a = v * (v + 0.0245786) - 0.000090537;
        vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081;
        return a / b;
      }
      vec3 tonemap(vec3 color){
        const mat3 inM = mat3(
          0.59719, 0.07600, 0.02840,
          0.35458, 0.90834, 0.13383,
          0.04823, 0.01566, 0.83777);
        const mat3 outM = mat3(
           1.60475, -0.10208, -0.00327,
          -0.53108,  1.10813, -0.07276,
          -0.07367, -0.00605,  1.07602);
        color *= 1.0 / 0.6;
        return clamp(outM * RRTAndODTFit(inM * color), 0.0, 1.0);
      }

      // One sampler for the whole lens model: transverse chromatic aberration
      // is a per-channel change of MAGNIFICATION, so each channel must travel
      // the same defocus path with a slightly different scale. Sampling R and B
      // from a different (sharp) source than G is what puts colour fringes on
      // every silhouette.
      vec3 sampleLens(vec2 uv, float coc, vec2 d){
        float ca = dot(d, d) * 0.0035;
        vec2 uvR = uv + d * ca, uvG = uv, uvB = uv - d * ca;
        if (coc <= 0.02) {
          return vec3(texture2D(tCol, uvR).r, texture2D(tCol, uvG).g, texture2D(tCol, uvB).b);
        }
        vec2 px = 1.0 / res;
        vec3 sum = vec3(0.0);
        float j = hash(uv * res) * 6.283;
        for (int i = 0; i < 8; i++) {
          vec2 o = vec2(cos(float(i) * 0.7853981 + j), sin(float(i) * 0.7853981 + j)) * px * coc * 5.0;
          sum += vec3(texture2D(tCol, uvR + o).r, texture2D(tCol, uvG + o).g, texture2D(tCol, uvB + o).b);
        }
        return sum / 8.0;
      }

      void main(){
        vec2 d = vUv - 0.5;
        /* Depth of field: tiny, but a lens always has some, and its absence is
           one of the quiet reasons renders read as diagrams.

           It has to be a thin-lens model — defocus goes with the difference of
           RECIPROCAL distances, not of distances. A linear |z − focus| term
           saturates everything past the subject, so the sky (at the far plane)
           lands on maximum blur and the clouds smear into a flat wash. That is
           not depth of field; that is a fogged lens. */
        float z = linZ(texture2D(tDepth, vUv).x);
        float coc = clamp(abs(1.0 / max(z, 0.5) - 1.0 / focusZ) * focusZ * dofAmt, 0.0, 1.0);
        vec3 c = sampleLens(vUv, coc, d);

        c = tonemap(c * exposure);
        /* "Dull" on a deliberately minimal palette is almost never a shortage
           of colour — pushing saturation on a lime-white house just makes it
           look cheap. It is a shortage of TONAL separation: too little distance
           between the sunlit face, the shaded face and the sky. So the S-curve
           does the work, saturation barely moves, and the vignette is eased
           back because a heavy one reads as murk rather than as a lens. */
        float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
        c = mix(vec3(l), c, 1.18);
        c = clamp(c, 0.0, 1.0);
        c = c * c * (3.0 - 2.0 * c) * 0.42 + c * 0.58;
        // a little extra bite in the top end so sunlit plaster reads crisp
        // against the haze rather than dissolving into it
        c = clamp(c * 1.012 - 0.006, 0.0, 1.0);
        l = dot(c, vec3(0.2126, 0.7152, 0.0722));
        // hot-climate cast: warm the highlights a touch more than before, and
        // keep the shadows from going blue — dry-earth bounce, not sky
        c *= mix(vec3(1.000, 0.998, 0.996), vec3(1.034, 1.010, 0.968), smoothstep(0.10, 0.90, l));
        float vd = length(d) * 1.4142;
        c *= 1.0 - 0.14 * pow(smoothstep(0.46, 1.0, vd), 1.8);
        c = pow(max(c, 0.0), vec3(1.0 / 2.2));
        c += (hash(vUv * res + vec2(t, t * 1.7)) - 0.5) * 0.012 * (1.0 - l * 0.6);
        gl_FragColor = vec4(c, 1.0);
      }`,
      { tCol: { value: null }, tDepth: { value: null }, res: { value: new THREE.Vector2(1, 1) },
        exposure: { value: 1 }, t: { value: 0 },
        focusZ: { value: 30 }, dofAmt: { value: 0.10 }, nearFar: nf });

    let rtScene = null, rtNorm = null, rtGI = null, rtGIb = null, rtSSR = null,
        rtHDR = null, rtAcc = [null, null], rw = 0, rh = 0, accIdx = 0;
    const _dbs = new THREE.Vector2();
    function ensureRT() {
      renderer.getDrawingBufferSize(_dbs);
      const w = Math.max(2, _dbs.x | 0), h = Math.max(2, _dbs.y | 0);
      if (w === rw && h === rh) return;
      rw = w; rh = h;
      [rtScene, rtNorm, rtGI, rtGIb, rtSSR, rtHDR, rtAcc[0], rtAcc[1]].forEach(rt => {
        if (rt) { if (rt.depthTexture) rt.depthTexture.dispose(); rt.dispose(); }
      });
      const dt = new THREE.DepthTexture(w, h);
      dt.type = THREE.UnsignedIntType;
      const lin = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false };
      const hdr = Object.assign({ type: THREE.HalfFloatType }, lin);
      rtScene = new THREE.WebGLRenderTarget(w, h, {
        type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
        depthBuffer: true, stencilBuffer: false, depthTexture: dt
      });
      rtNorm = new THREE.WebGLRenderTarget(w, h, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true, stencilBuffer: false });
      const gw = Math.max(2, w >> 1), gh = Math.max(2, h >> 1);
      rtGI = new THREE.WebGLRenderTarget(gw, gh, hdr);
      rtGIb = new THREE.WebGLRenderTarget(gw, gh, hdr);
      rtSSR = new THREE.WebGLRenderTarget(gw, gh, hdr);
      rtHDR = new THREE.WebGLRenderTarget(w, h, hdr);
      rtAcc[0] = new THREE.WebGLRenderTarget(w, h, hdr);
      rtAcc[1] = new THREE.WebGLRenderTarget(w, h, hdr);
      giPass.u.res.value.set(gw, gh);
      ssrPass.u.res.value.set(gw, gh);
      blurH.u.res.value.set(gw, gh); blurV.u.res.value.set(gw, gh);
      compPass.u.res.value.set(w, h);
      outPass.u.res.value.set(w, h);
      resetAccum();
    }

    // Halton — a low-discrepancy sequence covers the pixel far more evenly than
    // random offsets, so the image converges in far fewer samples
    function halton(i, b) {
      let f = 1, r = 0;
      while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); }
      return r;
    }
    let frameNo = 0;
    const _pv = new THREE.Vector3();

    POST.render = function () {
      ensureRT();
      if (!rtScene) { renderer.render(scene, camera); return; }
      nf.value.set(camera.near, camera.far);

      if (accumDirty) { POST.samples = 0; accumDirty = false; }
      const n = POST.samples;
      if (n >= POST.max) {                       // converged — just re-present
        outPass.u.tCol.value = rtAcc[accIdx].texture;
        outPass.u.tDepth.value = rtScene.depthTexture;
        outPass.u.exposure.value = POST.exposure;
        outPass.u.t.value = 0;
        renderer.setRenderTarget(null); renderer.render(outPass.scene, fsCam);
        return;
      }

      // --- jitter the projection by a sub-pixel offset for this sample
      const jx = (halton(n + 1, 2) - 0.5), jy = (halton(n + 1, 3) - 0.5);
      camera.setViewOffset(rw, rh, jx, jy, rw, rh);
      camera.updateProjectionMatrix();

      renderer.setClearColor(0x000000, 1);
      renderer.setRenderTarget(rtScene);
      renderer.render(scene, camera);
      renderNormals(rtNorm);

      const projInv = new THREE.Matrix4().copy(camera.projectionMatrix).invert();
      giPass.u.tDepth.value = rtScene.depthTexture;
      giPass.u.tNorm.value = rtNorm.texture;
      giPass.u.tColor.value = rtScene.texture;
      giPass.u.projInv.value.copy(projInv);
      giPass.u.proj.value.copy(camera.projectionMatrix);
      giPass.u.uSeed.value = n * 13.7 + 3.1;
      renderer.setRenderTarget(rtGI); renderer.render(giPass.scene, fsCam);

      blurH.u.tGI.value = rtGI.texture; blurH.u.tDepth.value = rtScene.depthTexture;
      renderer.setRenderTarget(rtGIb); renderer.render(blurH.scene, fsCam);
      blurV.u.tGI.value = rtGIb.texture; blurV.u.tDepth.value = rtScene.depthTexture;
      renderer.setRenderTarget(rtGI); renderer.render(blurV.scene, fsCam);

      ssrPass.u.tDepth.value = rtScene.depthTexture;
      ssrPass.u.tNorm.value = rtNorm.texture;
      ssrPass.u.tColor.value = rtScene.texture;
      ssrPass.u.projInv.value.copy(projInv);
      ssrPass.u.proj.value.copy(camera.projectionMatrix);
      ssrPass.u.viewInv.value.copy(camera.matrixWorld);
      ssrPass.u.skyUp.value.copy(SKY_UP);
      ssrPass.u.skyDn.value.copy(SKY_DN);
      renderer.setRenderTarget(rtSSR); renderer.render(ssrPass.scene, fsCam);

      compPass.u.tCol.value = rtScene.texture;
      compPass.u.tGI.value = rtGI.texture;
      compPass.u.tSSR.value = rtSSR.texture;
      compPass.u.tDepth.value = rtScene.depthTexture;
      compPass.u.tNorm.value = rtNorm.texture;
      compPass.u.projInv.value.copy(projInv);
      renderer.setRenderTarget(rtHDR); renderer.render(compPass.scene, fsCam);

      const src = accIdx, dst = 1 - accIdx;
      accPass.u.tNew.value = rtHDR.texture;
      accPass.u.tOld.value = rtAcc[src].texture;
      accPass.u.w.value = n === 0 ? 1.0 : 1.0 / (n + 1);
      renderer.setRenderTarget(rtAcc[dst]); renderer.render(accPass.scene, fsCam);
      accIdx = dst;

      camera.clearViewOffset();
      camera.updateProjectionMatrix();

      // focus on whatever is at the centre of frame
      _pv.copy(ctl.target).applyMatrix4(camera.matrixWorldInverse);
      outPass.u.focusZ.value = Math.max(1, -_pv.z);
      outPass.u.tCol.value = rtAcc[accIdx].texture;
      outPass.u.tDepth.value = rtScene.depthTexture;
      outPass.u.exposure.value = POST.exposure;
      outPass.u.t.value = (frameNo = (frameNo + 1) % 1024);
      renderer.setRenderTarget(null); renderer.render(outPass.scene, fsCam);

      POST.samples = n + 1;
    };

    POST.dbg = { giPass, ssrPass, compPass, outPass, accPass,
                 rt: () => ({ rtScene, rtNorm, rtGI, rtSSR, rtHDR, rtAcc, accIdx }) };
  })();

  applySun('morning');

  function renderFrame() {
    if (POST.on && POST.render) POST.render(); else renderer.render(scene, camera);
  }

  /* ==========================================================================
     7 · CAMERA + INTERACTION
     ========================================================================== */
  const VIEWS = {
    hero:   { pos: [39.0, 13.2, 9.5],  target: [9.5, 5.0, -4.6] },
    east:   { pos: [44.0, 8.6, -4.4],  target: [12.6, 5.4, -4.4] },
    north:  { pos: [8.3, 9.0, -34.0],  target: [8.3, 5.2, -4.4] },
    south:  { pos: [8.3, 9.0, 24.0],   target: [8.3, 5.2, -4.4] },
    west:   { pos: [-24.0, 9.0, -4.4], target: [6.0, 5.2, -4.4] },
    aerial: { pos: [34.0, 30.0, 18.0], target: [8.5, 2.5, -5.0] }
  };
  const ctl = {
    theta: 0, phi: 1.15, radius: 34,
    target: new THREE.Vector3(9.5, 5.0, -4.6),
    dragging: false, panning: false, lx: 0, ly: 0, interacted: false
  };
  function applyView(name) {
    const v = VIEWS[name] || VIEWS.hero;
    const pos = new THREE.Vector3().fromArray(v.pos);
    const tgt = new THREE.Vector3().fromArray(v.target);
    ctl.target.copy(tgt);
    const off = pos.clone().sub(tgt);
    ctl.radius = off.length();
    ctl.phi = Math.acos(clamp(off.y / ctl.radius, -1, 1));
    ctl.theta = Math.atan2(off.x, off.z);
    document.querySelectorAll('#views button').forEach(b =>
      b.classList.toggle('on', b.getAttribute('data-view') === name));
    updateCamera();
  }
  function updateCamera() {
    const s = Math.sin(ctl.phi);
    camera.position.set(
      ctl.target.x + ctl.radius * s * Math.sin(ctl.theta),
      ctl.target.y + ctl.radius * Math.cos(ctl.phi),
      ctl.target.z + ctl.radius * s * Math.cos(ctl.theta)
    );
    camera.lookAt(ctl.target);
    camera.updateMatrixWorld();
    skyDome.position.copy(camera.position);
    const needle = document.getElementById('needle');
    if (needle) needle.style.transform = 'rotate(' + (-ctl.theta * 180 / Math.PI) + 'deg)';
    resetAccum();
  }
  applyView('hero');

  document.querySelectorAll('#views button').forEach(btn => {
    btn.addEventListener('click', () => { ctl.interacted = true; applyView(btn.getAttribute('data-view')); });
  });
  document.querySelectorAll('#sun button').forEach(btn => {
    btn.addEventListener('click', () => { applySun(btn.getAttribute('data-sun')); });
  });

  canvas.addEventListener('pointerdown', e => {
    ctl.dragging = e.button === 0; ctl.panning = e.button === 2 || e.button === 1;
    ctl.lx = e.clientX; ctl.ly = e.clientY; ctl.interacted = true;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!ctl.dragging && !ctl.panning) return;
    const dx = e.clientX - ctl.lx, dy = e.clientY - ctl.ly;
    ctl.lx = e.clientX; ctl.ly = e.clientY;
    if (ctl.panning) {
      const pan = ctl.radius * 0.0014;
      const right = new THREE.Vector3(); camera.getWorldDirection(right);
      right.cross(camera.up).normalize();
      ctl.target.addScaledVector(right, -dx * pan);
      ctl.target.addScaledVector(camera.up, dy * pan);
    } else {
      ctl.theta -= dx * 0.0052;
      ctl.phi = clamp(ctl.phi + dy * 0.0042, 0.10, Math.PI * 0.5 - 0.012);
    }
    updateCamera();
  });
  canvas.addEventListener('pointerup', () => { ctl.dragging = false; ctl.panning = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    ctl.radius = clamp(ctl.radius * (1 + e.deltaY * 0.0012), 6, 160);
    ctl.interacted = true; updateCamera();
  }, { passive: false });

  let pinchDist = 0;
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                             e.touches[0].clientY - e.touches[1].clientY);
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchDist > 0) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                           e.touches[0].clientY - e.touches[1].clientY);
      ctl.radius = clamp(ctl.radius * (pinchDist / d), 6, 160);
      pinchDist = d; ctl.interacted = true; updateCamera();
    }
  }, { passive: true });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    resetAccum();
  });

  setTimeout(() => {
    const h = document.getElementById('hint');
    if (h) h.classList.add('fade');
  }, 6000);

  /* ==========================================================================
     8 · FRAME LOOP
     ========================================================================== */
  const convEl = document.getElementById('conv');
  const convBar = convEl ? convEl.querySelector('i') : null;
  let autoUntil = performance.now() + 9000;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) return;
    if (!ctl.interacted && !reduceMotion && now < autoUntil) {
      ctl.theta += 0.0016;
      updateCamera();
    }
    renderFrame();
    if (convBar) {
      const f = POST.on ? Math.min(1, POST.samples / POST.max) : 1;
      convBar.style.width = (f * 100).toFixed(0) + '%';
      convEl.classList.toggle('done', f >= 1);
    }
  }

  requestAnimationFrame(() => {
    say('BAKING SHADOWS');
    if (Q.shadows !== false) renderer.shadowMap.needsUpdate = true;
    renderFrame();
    const el = document.getElementById('loading');
    if (el) el.classList.add('done');
    requestAnimationFrame(frame);
  });

  // The car GLB arrives after boot; its meshes need normal-buffer materials too
  // or SSR treats the whole vehicle as a mirror.
  window.addEventListener('houseCarReady', () => {
    buildNormalMaterials();
    if (Q.shadows !== false) renderer.shadowMap.needsUpdate = true;
    resetAccum();
  });

  window.__el = {
    THREE, scene, camera, renderer, ctl, data, applySun, applyView, updateCamera, POST,
    coverage: MATERIAL_COVERAGE,
    look: (tx, ty, tz, radius, theta, phi) => {
      ctl.target.set(tx, ty, tz); ctl.radius = radius; ctl.theta = theta; ctl.phi = phi;
      ctl.interacted = true; updateCamera();
    },
    // render until the temporal accumulation has converged, then capture
    resolve: (n) => { const k = n || POST.max; for (let i = 0; i < k; i++) renderFrame(); },
    render: () => { renderFrame(); }
  };
}
})();
</script>
