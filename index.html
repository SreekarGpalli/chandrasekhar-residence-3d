  $('cardClose').addEventListener('click', clearSelection);

  /* ---------- labels ---------- */
  const v3 = new THREE.Vector3();
  const _v3b = new THREE.Vector3();
  function updateLabels(w, h) {
    const activeFi = VIEW_KEYS.indexOf(activeView) - 1;
    // Hide all labels for other floors
    floorsUI.forEach((f, fi) => {
      if (fi !== activeFi) {
        f.rooms.forEach(room => {
          if (room.el.style.display !== 'none') room.el.style.display = 'none';
        });
      }
    });

    if (activeFi < 0) return;
    const fY = data.floors[activeFi].floorY;
    for (const room of floorsUI[activeFi].rooms) {
      v3.set(room.cx, fY + LABEL_Y_OFFSET, room.cz).project(camera);
      const onScreen = v3.z < 1 && v3.x > -1.08 && v3.x < 1.08 && v3.y > -1.1 && v3.y < 1.1;
      if (!onScreen) {
        if (room.el.style.display !== 'none') room.el.style.display = 'none';
        room._lx = room._ly = undefined;
        continue;
      }
      const x = (v3.x * 0.5 + 0.5) * w, y = (-v3.y * 0.5 + 0.5) * h;
      // Skip DOM writes when the label barely moved (<1px)
      if (room._lx != null && Math.abs(room._lx - x) < 1 && Math.abs(room._ly - y) < 1
          && room.el.style.display === 'block') continue;
      room._lx = x; room._ly = y;
      _v3b.set(room.cx, fY, room.cz);
      const d = camera.position.distanceTo(_v3b);
      const op = clamp((40 - d) / 22, 0, 1) * 0.85 + 0.15;
      const s = clamp(16 / d, 0.72, 1.12);
      room.el.style.display = 'block';
      room.el.style.opacity = op.toFixed(2);
      room.el.style.transform = 'translate(-50%,-120%) translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) scale(' + s.toFixed(2) + ')';
      room.el.style.zIndex = (1000 - Math.round(v3.z * 500));
    }
  }

  /* ---------- compass ---------- */
  const needle = $('needle');
  function updateCompass() {
    const az = Math.atan2(camera.position.x - ctl.target.x, camera.position.z - ctl.target.z);
    needle.style.transform = 'rotate(' + (az * 180 / Math.PI) + 'deg)';
  }

  /* ---------- resize ---------- */
  function resize() {
    const vv = window.visualViewport;
    let w = Math.floor((vv && vv.width) || window.innerWidth || 0);
    let h = Math.floor((vv && vv.height) || window.innerHeight || 0);
    /* A viewport of 0 is not a 1-pixel viewport.
       attachViewport() calls this once during boot, and if the embedder has not
       laid the page out yet, innerWidth/visualViewport can still read 0. The old
       Math.max(1, …) turned that into a 1×1 drawing buffer stretched across the
       window — a single flat colour that never changes and never recovers,
       because nothing resizes again unless the user drags the window. Fall back
       to the canvas's own CSS box, and if even that is degenerate, retry next
       frame rather than committing to a broken size. */
    if (w < 2 || h < 2) {
      w = canvas.clientWidth || 0;
      h = canvas.clientHeight || 0;
    }
    if (w < 2 || h < 2) { requestAnimationFrame(resize); return; }
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    /* Whoever owns the pixel ratio has to re-assert it here, because setSize
       does not, and the two owners want different numbers. The screen-space
       pipeline caps itself well below the device ratio — every one of its
       passes is full-screen, so cost is quadratic in this number and jittered
       accumulation, not supersampling, is what resolves its edges. The dynamic
       scaler owns it on the forward path instead.

       Calling the scaler unconditionally, as this used to, quietly undid the
       pipeline's cap on the very first resize: on a phone at dpr 1.5 that is
       2.25× the intended pixel count for the heaviest render path, restored
       silently after every orientation change and every URL-bar slide. It also
       reverted whatever step the frame-budget watchdog had just taken. */
    if (POST.on && POST.applyDpr) POST.applyDpr();
    else if (scaler && scaler.apply) scaler.apply();
    wake(600);
  }
  if (window.Perf && Perf.attachViewport) Perf.attachViewport(resize);
  else { window.addEventListener('resize', resize); resize(); }

  /* ==========================================================================
     6 · RENDER PIPELINE
     scene + normals ▸ SSGI ▸ SSR ▸ composite ▸ temporal accumulate ▸ AgX
     ========================================================================== */

  /* Per-mesh depth/normal/reflectivity material.

     Every visible mesh needs one. A mesh left out does not simply go missing
     from the buffer — it renders with its ORDINARY material, so its albedo
     lands in the normal channels and its opaque alpha reads as "fully
     reflective". That is how the distant fields turned into a lake and the
     canopies grew white speckles: SSR was faithfully reflecting the sky off
     everything that had been forgotten here.

     A shared overrideMaterial can't do the job either — three skips re-uploading
     uniforms when the material instance doesn't change between draws, so
     per-mesh reflectivity would never reach the shader. Hence one clone each. */
  const NR_VS = `
    varying vec3 vN; varying vec2 vUvNR;
    void main(){
      vUvNR = uv;
      #ifdef USE_INSTANCING
        mat4 im = instanceMatrix;
        vN = normalize(normalMatrix * (mat3(im) * normal));
        gl_Position = projectionMatrix * modelViewMatrix * im * vec4(position, 1.0);
      #else
        vN = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      #endif
    }`;
  const NR_FS = `
    varying vec3 vN; varying vec2 vUvNR;
    uniform float uRefl;
    uniform sampler2D uAlpha; uniform float uUseAlpha; uniform float uCut;
    void main(){
      // uUseAlpha: 0 = opaque, 1 = mask in the alphaMap's GREEN channel
      // (the procedural leaf kit), 2 = mask in the map's ALPHA channel (the
      // photoreal garden's leaf cards, which carry alphaTest on map).
      if (uUseAlpha > 0.5) {
        vec4 a = texture2D(uAlpha, vUvNR);
        float m = uUseAlpha > 1.5 ? a.a : a.g;
        if (m < uCut) discard;
      }
      // Two-sided geometry (leaf cards, curtains) hands the back face the
      // front face's normal, which points away from the camera. Every pass
      // downstream builds a hemisphere around this vector, so an inverted one
      // sends the GI rays straight into the surface they came from.
      vec3 N = normalize(vN);
      if (!gl_FrontFacing) N = -N;
      gl_FragColor = vec4(N * 0.5 + 0.5, uRefl);
    }`;
  const nrList = [];
  function buildNormalMaterials() {
    nrList.length = 0;
    scene.traverse(o => {
      if (!o.isMesh || !o.material || o === skyDome) return;
      const m = o.material;
      const nm = new THREE.ShaderMaterial({
        vertexShader: NR_VS, fragmentShader: NR_FS,
        side: m.side, uniforms: {
          uRefl: { value: o.userData.reflect || 0 },
          /* The garden's leaf cards are alphaTest cut-outs whose mask lives in
             map.a, with no alphaMap at all. Testing only for alphaMap left every
             card a solid quad in the normal buffer, so SSR traced the whole
             canopy as opaque reflective geometry and composited the scene back
             over itself — the model looked semi-transparent from every angle. */
          uAlpha: { value: m.alphaMap || (m.alphaTest > 0 ? m.map : null) || null },
          uUseAlpha: { value: m.alphaMap ? 1 : (m.alphaTest > 0 && m.map ? 2 : 0) },
          uCut: { value: m.alphaTest || 0.5 }
        }
      });
      /* The normal buffer must resolve depth EXACTLY the way the beauty pass
         does, or the two disagree about which surface owns a pixel.

         Every shell wall in this model exists twice — once in the exterior
         shell, once in the floor group that shares its plane — and the floor
         copy carries a negative polygonOffset so it wins consistently. Leaving
         that off here meant the two duplicates z-fought in the normal buffer
         alone: flat walls came out stippled with the wrong normal and the
         wrong reflectivity, so SSGI shot rays sideways out of a wall and SSR
         painted mirror speckle across matte plaster. Worse, the jitter that
         drives the temporal accumulation reshuffles which duplicate wins on
         every sample, so it never averaged out — it boiled.

         depthWrite/depthTest and the transparent ordering come along for the
         same reason. NoBlending keeps the write opaque: `transparent` here is
         only being used to put the draw in the late queue, not to blend. */
      nm.polygonOffset = m.polygonOffset;
      nm.polygonOffsetFactor = m.polygonOffsetFactor;
      nm.polygonOffsetUnits = m.polygonOffsetUnits;
      nm.depthWrite = m.depthWrite;
      nm.depthTest = m.depthTest;
      nm.transparent = m.transparent;
      nm.blending = THREE.NoBlending;
      nrList.push({ mesh: o, nr: nm });
    });
  }

  function renderNormals(rt) {
    for (const e of nrList) { e.mesh.userData._m = e.mesh.material; e.mesh.material = e.nr; }
    const bg = scene.background, fg = scene.fog;
    scene.background = null; scene.fog = null;
    skyDome.visible = false;
    renderer.setRenderTarget(rt);
    renderer.setClearColor(0x000000, 0);
    renderer.clear();
    renderer.render(scene, camera);
    skyDome.visible = true;
    scene.background = bg; scene.fog = fg;
    for (const e of nrList) e.mesh.material = e.mesh.userData._m;
  }

  buildNormalMaterials();   // after every mesh is in the scene, not before

  /* …except two batches are NOT in the scene yet at this point: the car GLB and
     the photoreal garden, both of which load asynchronously and announce
     themselves. A mesh with no normal-buffer material does not go missing from
     that buffer — it renders with its ORDINARY material, so its albedo lands in
     the normal channels and its opaque alpha reads as "fully reflective". SSR
     then traces mirror rays off the whole garden and car, which composites the
     scene back over itself and turns every wall semi-transparent. Rebuild on
     both events; the garden is ~16,800 instances and by far the worse offender. */
  ['houseCarReady', 'houseGardenReady'].forEach(ev => {
    window.addEventListener(ev, () => {
      buildNormalMaterials();
      if (Q.shadows !== false) renderer.shadowMap.needsUpdate = true;
      resetAccum();
      wake(900);
    });
  });

  (function buildPipeline() {
    /* Tiers below `lite` never build this at all — see POST_MODE. They render
       forward with MSAA from the context, which is the right trade on a phone:
       one geometry pass, no full-screen ray marches, no render targets. */
    if (!HEAVY_POST) return;
    POST.on = true;
    POST.lite = POST_MODE === 'lite';
    renderer.toneMapping = THREE.NoToneMapping;
    POST.max = POST.lite ? 20 : 64;
    /* Cap the render scale for the pipeline. Every pass here is full-screen and
       several are per-pixel ray marches, so cost goes with the square of the
       device pixel ratio: a retina display at dpr 2 is FOUR times the work of
       dpr 1, on top of a scene that now carries the interiors and ~16,800
       foliage instances. The temporal accumulation is what resolves edges, so
       there is nothing to gain from supersampling on top of it. */
    const BASE_DPR = Math.min(Q.dpr || window.devicePixelRatio || 1, 2);
    const DPR_STEPS = POST.lite ? [1.0, 0.85, 0.7] : [1.5, 1.15, 0.9];
    let dprStep = 0;
    POST.applyDpr = function () {
      renderer.setPixelRatio(Math.min(BASE_DPR, DPR_STEPS[dprStep]));
    };
    POST.applyDpr();

    // Ray budgets. The `lite` numbers are what a mid-range phone can hold at
    // 60 Hz; the temporal filter is what makes them look like more.
    const GI_RAYS = POST.lite ? 1 : 2;
    const GI_STEPS = POST.lite ? 8 : 12;
    const SSR_STEPS = POST.lite ? 14 : 28;
    const BILATERAL = !POST.lite;      // joint upsample of the half-res buffers

    const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const fsGeo = new THREE.PlaneGeometry(2, 2);
    function pass(frag, uniforms) {
      const m = new THREE.ShaderMaterial({
        uniforms, depthTest: false, depthWrite: false,
        vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
        fragmentShader: frag
      });
      const sc = new THREE.Scene(); sc.add(new THREE.Mesh(fsGeo, m));
      return { scene: sc, mat: m, u: uniforms };
    }

    const COMMON = `
      uniform sampler2D tDepth; uniform sampler2D tNorm; uniform sampler2D tColor;
      uniform mat4 projInv; uniform mat4 proj; uniform vec2 res; uniform float uSeed;
      float readDepth(vec2 uv){ return texture2D(tDepth, uv).x; }
      vec3 viewPos(vec2 uv){
        float d = readDepth(uv);
        vec4 ndc = vec4(uv * 2.0 - 1.0, d * 2.0 - 1.0, 1.0);
        vec4 v = projInv * ndc;
        return v.xyz / v.w;
      }
      vec3 viewNorm(vec2 uv){ return normalize(texture2D(tNorm, uv).xyz * 2.0 - 1.0); }
      /* Sky test. NOT a depth threshold: the dome sits at r=1000 against a far
         plane of 1200, so its window depth is 0.99991 — under any "close to
         1.0" epsilon you would naturally pick. Treated as geometry, every sky
         pixel gets ray-marched with a garbage normal and has bounce light
         injected into it, which turns a deep blue sky into flat white haze.
         The normal buffer is cleared to zero and the dome is excluded from it,
         so an all-zero texel is exactly and only sky. */
      bool isSky(vec2 uv){ vec3 r = texture2D(tNorm, uv).xyz; return dot(r, r) < 0.0015; }
      vec2 project(vec3 vp){
        vec4 c = proj * vec4(vp, 1.0);
        return (c.xy / c.w) * 0.5 + 0.5;
      }
      float hash13(vec3 p){
        p = fract(p * 0.1031); p += dot(p, p.yzx + 33.33);
        return fract((p.x + p.y) * p.z);
      }
      /* Interleaved gradient noise. Unlike a plain hash it is spatially
         well-distributed at every scale, so a SINGLE sample per pixel already
         looks like fine film grain rather than clumped salt-and-pepper. That
         matters far more than it sounds: while the camera is moving there is
         only ever one sample to look at. */
      float ign(vec2 p){ return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }`;

    /* --- SSGI. Cosine-sample the hemisphere, march each ray through the depth
       buffer, and look at what it hits.

       The ray result is stored as a DIFFERENCE, not as radiance: (hit colour −
       sky reference). This matters. The forward pass has already lit every
       pixel with an IBL that assumed open sky in all directions, so adding raw
       bounce radiance on top double-counts and floods the shadows — the whole
       frame goes milky and cast shadows disappear, which is exactly what raw
       SSGI does to a forward renderer. As a difference it is self-correcting
       and unifies both effects: a ray that hits something darker than sky
       subtracts (that is ambient occlusion), one that hits a sunlit wall adds
       (that is colour bleed), and one that sees sky changes nothing because the
       IBL already had it right.

       Two rays per pixel is far too few to be smooth — which is what the
       temporal accumulation is for. The noise is zero-mean, so 64 frames of
       different seeds converge on the true integral. */
    const giPass = pass(COMMON + `
      varying vec2 vUv;
      uniform float uRadius; uniform float uThickness; uniform vec3 uSkyRef;
      void main(){
        if (isSky(vUv)) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }
        vec3 P = viewPos(vUv);
        vec3 N = viewNorm(vUv);
        vec3 T = normalize(abs(N.z) < 0.9 ? cross(N, vec3(0.0, 0.0, 1.0)) : cross(N, vec3(1.0, 0.0, 0.0)));
        vec3 B = cross(N, T);
        vec3 gi = vec3(0.0); float occ = 0.0;
        // one screen-space rotation per pixel, decorrelated per frame
        float rot = 6.2831853 * fract(ign(gl_FragCoord.xy) + uSeed * 0.6180339887);
        const int RAYS = ${GI_RAYS}, STEPS = ${GI_STEPS};
        for (int r = 0; r < RAYS; r++) {
          float h2 = fract(ign(gl_FragCoord.xy + vec2(float(r) * 37.0, uSeed * 11.0)) + uSeed * 0.7548776662);
          float phi = rot + 6.2831853 * float(r) / float(RAYS);
          float ct = sqrt(1.0 - h2);              // cosine-weighted
          float st = sqrt(h2);
          vec3 dir = normalize(T * (cos(phi) * st) + B * (sin(phi) * st) + N * ct);
          float stepLen = uRadius / float(STEPS);
          vec3 pos = P + N * 0.02;
          bool hit = false;
          for (int s = 0; s < STEPS; s++) {
            pos += dir * stepLen * (1.0 + float(s) * 0.35);   // grow strides
            vec2 uv = project(pos);
            if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) break;
            if (isSky(uv)) continue;              // a ray that sees sky is a miss
            vec3 sp = viewPos(uv);
            float diff = sp.z - pos.z;            // view space: -z is forward
            if (diff > 0.0 && diff < uThickness) {
              // distance falloff: a wall 20 m away contributes far less bounce
              // than the soffit 1 m overhead, and without this the far side of
              // the street lights the portico
              float fall = 1.0 / (1.0 + length(pos - P) * 0.55);
              gi += (texture2D(tColor, uv).rgb - uSkyRef) * fall;
              occ += fall; hit = true; break;
            }
          }
          if (!hit) gi += vec3(0.0);
        }
        gi /= float(RAYS);
        float ao = 1.0 - occ / float(RAYS);
        gl_FragColor = vec4(gi, ao);
      }`,
      { tDepth: { value: null }, tNorm: { value: null }, tColor: { value: null },
        projInv: { value: new THREE.Matrix4() }, proj: { value: new THREE.Matrix4() },
        res: { value: new THREE.Vector2(1, 1) }, uSeed: { value: 0 },
        uRadius: { value: 4.0 }, uThickness: { value: 1.4 },
        uSkyRef: { value: new THREE.Vector3(0.42, 0.46, 0.52) } });

    // depth-aware cross blur — cleans single-frame noise without bleeding
    // across silhouettes; accumulation then does the rest
    const blurFrag = `
      varying vec2 vUv;
      uniform sampler2D tGI; uniform sampler2D tDepth;
      uniform vec2 dir; uniform vec2 res; uniform vec2 nearFar;
      float linZ(float d){ return nearFar.x * nearFar.y / (nearFar.y - d * (nearFar.y - nearFar.x)); }
      void main(){
        float z0 = linZ(texture2D(tDepth, vUv).x);
        vec4 sum = texture2D(tGI, vUv); float wsum = 1.0;
        for (int i = 1; i <= 5; i++) {
          vec2 o = dir * float(i) / res;
          for (int s = 0; s < 2; s++) {
            vec2 uv = s == 0 ? vUv + o : vUv - o;
            float z = linZ(texture2D(tDepth, uv).x);
            float w = exp(-float(i * i) * 0.10) * smoothstep(0.08, 0.0, abs(z - z0) / max(z0, 0.2));
            sum += texture2D(tGI, uv) * w; wsum += w;
          }
        }
        gl_FragColor = sum / wsum;
      }`;
    const nf = { value: new THREE.Vector2(camera.near, camera.far) };
    const blurH = pass(blurFrag, { tGI: { value: null }, tDepth: { value: null }, dir: { value: new THREE.Vector2(1, 0) }, res: { value: new THREE.Vector2(1, 1) }, nearFar: nf });
    const blurV = pass(blurFrag, { tGI: { value: null }, tDepth: { value: null }, dir: { value: new THREE.Vector2(0, 1) }, res: { value: new THREE.Vector2(1, 1) }, nearFar: nf });

    /* --- SSR. Returns the reflected COLOUR only; how much of it survives is
       decided at full resolution in the composite (see there for why).

       The ray is cone-jittered by the surface's own gloss. A single mirror ray
       is only correct for a mirror — trace one off dry tarmac and you get a
       crisp, upside-down photograph of the street lamp, which is exactly what
       made every road and terrace here read as wet. A rough surface reflects an
       AVERAGE over a wide lobe: some sky, some wall, some ground, which
       averages to a dim sheen. Jitter the direction inside that lobe, let the
       temporal filter integrate it, and dry surfaces come back dry while glass
       and polished stone keep a real reflection.

       Rays that leave the screen fall back to the sky gradient, so a window at
       the frame edge still reflects something plausible rather than going
       black — off-screen fallback is the difference between SSR that helps and
       SSR that draws attention to itself. */
    const ssrPass = pass(COMMON + `
      varying vec2 vUv;
      uniform vec3 skyUp; uniform vec3 skyDn; uniform mat4 viewInv;
      void main(){
        float gloss = texture2D(tNorm, vUv).a;
        if (gloss < 0.04 || isSky(vUv)) { gl_FragColor = vec4(0.0); return; }
        vec3 P = viewPos(vUv);
        vec3 N = viewNorm(vUv);
        vec3 V = normalize(P);
        vec3 R = reflect(V, N);

        // Cone half-angle from gloss. 0.9 (glass) barely spreads; 0.09 (road)
        // spreads across most of the hemisphere.
        float spread = (1.0 - gloss) * (1.0 - gloss) * 0.55;
        if (spread > 0.001) {
          vec3 T = normalize(abs(R.z) < 0.9 ? cross(R, vec3(0.0, 0.0, 1.0)) : cross(R, vec3(1.0, 0.0, 0.0)));
          vec3 B = cross(R, T);
          float a = 6.2831853 * fract(ign(gl_FragCoord.xy) + uSeed * 0.6180339887);
          float rr = spread * sqrt(fract(ign(gl_FragCoord.xy + 19.0) + uSeed * 0.7548776662));
          R = normalize(R + (T * cos(a) + B * sin(a)) * rr);
          // never let the jitter push the ray below the surface
          if (dot(R, N) < 0.02) R = normalize(R + N * (0.02 - dot(R, N)));
        }

        vec3 pos = P + N * 0.03;
        float stepLen = 0.22;
        vec3 col = vec3(0.0); float found = 0.0;
        for (int s = 0; s < ${SSR_STEPS}; s++) {
          pos += R * stepLen;
          stepLen *= 1.16;
          vec2 uv = project(pos);
          if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) break;
          if (isSky(uv)) continue;               // let the sky fallback handle it
          vec3 sp = viewPos(uv);
          float diff = sp.z - pos.z;
          if (diff > 0.0 && diff < stepLen * 2.2) {
            // fade at the screen border so reflections don't pop at the edge
            vec2 e = smoothstep(vec2(0.0), vec2(0.10), uv) * (1.0 - smoothstep(vec2(0.90), vec2(1.0), uv));
            col = texture2D(tColor, uv).rgb; found = min(e.x, e.y);
            break;
          }
        }
        vec3 wR = normalize((viewInv * vec4(R, 0.0)).xyz);
        vec3 sky = mix(skyDn, skyUp, clamp(wR.y * 0.5 + 0.5, 0.0, 1.0));
        col = mix(sky, col, found);
        // A single very bright hit inside a wide cone becomes a firefly that
        // the temporal filter then smears for a second. Clamp the tail.
        col = min(col, vec3(4.0));
        gl_FragColor = vec4(col, 1.0);
      }`,
      { tDepth: { value: null }, tNorm: { value: null }, tColor: { value: null },
        projInv: { value: new THREE.Matrix4() }, proj: { value: new THREE.Matrix4() },
        res: { value: new THREE.Vector2(1, 1) }, uSeed: { value: 0 },
        skyUp: { value: new THREE.Color(0x87b2da) }, skyDn: { value: new THREE.Color(0xad8a5c) },
        viewInv: { value: new THREE.Matrix4() } });

    /* --- Composite, plus the edge treatment.

       Nothing in the world has a mathematically perfect 90° arris. Every real
       corner is chipped, chamfered or rendered slightly round by the plaster
       itself, and at any distance that reads as a bright hairline on the convex
       edge and a dark one in the concave corner. Their absence is the single
       most persistent "this is CG" signal left on a clean facade, and it cannot
       be fixed with textures because it is a geometry cue.

       Rebuilding the model with bevelled solids is the correct fix and is not
       available here — the geometry arrives pre-merged. So the curvature is
       recovered in screen space instead: compare each pixel's plane against its
       neighbours' positions, and light the result the way a real chamfer would
       catch the sky. */
    const compPass = pass(`
      varying vec2 vUv;
      uniform sampler2D tCol; uniform sampler2D tGI; uniform sampler2D tSSR;
      uniform sampler2D tDepth; uniform sampler2D tNorm;
      uniform mat4 projInv; uniform vec2 res; uniform vec2 loRes; uniform vec2 nearFar;
      uniform float aoStrength; uniform float giStrength; uniform float edgeAmt;

      vec3 viewPosC(vec2 uv){
        float d = texture2D(tDepth, uv).x;
        vec4 ndc = vec4(uv * 2.0 - 1.0, d * 2.0 - 1.0, 1.0);
        vec4 v = projInv * ndc;
        return v.xyz / v.w;
      }
      float linZC(float d){ return nearFar.x * nearFar.y / (nearFar.y - d * (nearFar.y - nearFar.x)); }

      /* Joint-bilateral upsample of a half-resolution buffer.

         Plain bilinear is what put a ghost of the balcony railing on the face
         of every vertical rod on the east screen. Those rods are ~40 mm wide;
         at half resolution one texel straddles a rod AND the gap beside it, so
         it traces its ray through the gap, hits the railing behind, and
         bilinear then spreads that answer back across the rod. The result
         reads as if you can see through solid members.

         Weighting each of the four contributing texels by how well its depth
         matches THIS pixel's depth fixes it: a texel that belongs to the
         railing 3 m further back gets essentially no vote on a rod pixel. */
      vec4 upsample(sampler2D t, vec2 uv, float z0){
        #if ${BILATERAL ? 1 : 0}
          vec2 tc = uv * loRes - 0.5;
          vec2 base = floor(tc), f = tc - base;
          vec4 acc = vec4(0.0); float wsum = 0.0;
          for (int i = 0; i < 4; i++) {
            vec2 o = vec2(i == 1 || i == 3 ? 1.0 : 0.0, i >= 2 ? 1.0 : 0.0);
            vec2 suv = (base + o + 0.5) / loRes;
            float bw = (i == 1 || i == 3 ? f.x : 1.0 - f.x) * (i >= 2 ? f.y : 1.0 - f.y);
            float z = linZC(texture2D(tDepth, suv).x);
            float w = bw / (0.01 + abs(z - z0));
            acc += texture2D(t, suv) * w; wsum += w;
          }
          return wsum > 1e-5 ? acc / wsum : texture2D(t, uv);
        #else
          return texture2D(t, uv);
        #endif
      }

      float cavity(vec2 uv){
        vec3 rawN = texture2D(tNorm, uv).xyz;
        if (dot(rawN, rawN) < 0.0015) return 0.0;              // sky
        vec3 N = normalize(rawN * 2.0 - 1.0);
        vec3 P = viewPosC(uv);
        vec2 px = 1.0 / res;
        float acc = 0.0;
        for (int i = 0; i < 4; i++) {
          vec2 o = i == 0 ? vec2(px.x, 0.0) : i == 1 ? vec2(-px.x, 0.0)
                 : i == 2 ? vec2(0.0, px.y) : vec2(0.0, -px.y);
          vec3 dv = viewPosC(uv + o) - P;
          float len = length(dv);
          if (len < 1e-5 || len > 0.35) continue;              // ignore silhouettes
          acc += dot(dv / len, N);
        }
        return clamp(acc * 0.5, -1.0, 1.0);
      }

      void main(){
        vec3 c = texture2D(tCol, vUv).rgb;
        vec4 rawN = texture2D(tNorm, vUv);
        bool sky = dot(rawN.xyz, rawN.xyz) < 0.0015;
        float z0 = linZC(texture2D(tDepth, vUv).x);
        vec4 gi = upsample(tGI, vUv, z0);
        // A small extra occlusion term for the tight creases the ray march is
        // too coarse to resolve — reveals, soffit corners, the stair underside.
        float ao = mix(1.0, clamp(gi.a, 0.0, 1.0), sky ? 0.0 : aoStrength);
        c *= ao;
        // Bounce is tinted by the RECEIVER's albedo as well as the source's
        // colour. A forward renderer has no albedo buffer, so take the
        // receiver's hue from its own shaded colour normalised to unit
        // luminance: correct hue, no double-counted brightness.
        float lum = max(dot(c, vec3(0.2126, 0.7152, 0.0722)), 1e-3);
        vec3 tint = clamp(c / lum, 0.0, 2.0);
        c += gi.rgb * (sky ? 0.0 : giStrength) * tint;
        c = max(c, vec3(0.0));
        // convex arris catches sky, concave corner loses it
        float cav = sky ? 0.0 : cavity(vUv);
        c *= 1.0 + clamp(-cav, 0.0, 1.0) * edgeAmt * 0.9      // convex: highlight
                 - clamp( cav, 0.0, 1.0) * edgeAmt * 1.25;    // concave: contact shade

        /* Reflection strength is computed HERE, at full resolution, and never
           read from the half-res SSR buffer's alpha.

           That buffer knows only what a half-res texel covered. On anything
           thin — the east rods, a balustrade picket, a window mullion — half
           the texels that land on a solid member actually sampled the gap
           beside it and came back "this is reflective". Multiplying by the
           full-res gloss instead means a matte 40 mm rod gets exactly zero
           reflection regardless of what its neighbours reported, and only the
           surface that is genuinely glossy takes any.

           Fresnel is damped by roughness on purpose: a smooth surface really
           does approach a mirror at grazing incidence, but a rough one is
           shadowed by its own microfacets long before it gets there. Without
           that term, dry tarmac seen down the street reflects like a canal. */
        if (!sky && rawN.a > 0.04) {
          vec3 N = normalize(rawN.xyz * 2.0 - 1.0);
          vec3 P = viewPosC(vUv);
          float cosT = clamp(dot(normalize(-P), N), 0.0, 1.0);
          float gloss = rawN.a;
          float fres = pow(1.0 - cosT, 5.0) * mix(0.30, 1.0, gloss);
          float amt = gloss * mix(0.20, 1.0, fres);
          vec3 ssr = upsample(tSSR, vUv, z0).rgb;
          c = mix(c, ssr, clamp(amt, 0.0, 0.9));
        }
        gl_FragColor = vec4(max(c, vec3(0.0)), 1.0);
      }`,
      { tCol: { value: null }, tGI: { value: null }, tSSR: { value: null },
        tDepth: { value: null }, tNorm: { value: null },
        projInv: { value: new THREE.Matrix4() }, res: { value: new THREE.Vector2(1, 1) },
        loRes: { value: new THREE.Vector2(1, 1) }, nearFar: nf,
        aoStrength: { value: 0.30 }, giStrength: { value: 0.42 }, edgeAmt: { value: 0.5 } });

    /* --- Temporal filter.

       Two jobs in one pass. Standing still it is a plain running average over
       POST.max jittered samples, which is what resolves the ray-marched noise
       and antialiases every edge. Moving, it REPROJECTS: the scene is static
       and only the camera moves, so last frame's colour for a given surface
       point can be found exactly by projecting that point with last frame's
       view-projection matrix.

       Before this existed, any camera movement threw the history away and put a
       single 2-ray GI sample on screen — which is precisely the boiling,
       flickering image that shows up the moment you start to orbit. Now ~86 %
       of the previous frame survives the move, so the picture stays resolved
       while it turns.

       The neighbourhood clamp is what keeps that honest. History that no longer
       agrees with the pixels around it — newly revealed geometry, a surface
       that just went behind another — is pulled back into the current frame's
       local colour range instead of smearing across the screen. It is only
       applied while moving: standing still, clamping to a noisy single frame's
       local range would stop the average from ever getting cleaner than one
       sample. */
    const accPass = pass(`
      varying vec2 vUv;
      uniform sampler2D tNew; uniform sampler2D tOld; uniform sampler2D tDepth;
      uniform mat4 projInv; uniform mat4 viewInv; uniform mat4 prevVP;
      uniform vec2 res; uniform float w; uniform float uReproject;
      void main(){
        vec3 cur = texture2D(tNew, vUv).rgb;
        if (uReproject < 0.5) {                       // still: plain average
          gl_FragColor = vec4(mix(texture2D(tOld, vUv).rgb, cur, w), 1.0);
          return;
        }
        float d = texture2D(tDepth, vUv).x;
        vec4 v = projInv * vec4(vUv * 2.0 - 1.0, d * 2.0 - 1.0, 1.0);
        vec4 wp = viewInv * vec4(v.xyz / v.w, 1.0);
        vec4 pc = prevVP * wp;
        vec2 puv = (pc.xy / pc.w) * 0.5 + 0.5;
        if (pc.w <= 0.0 || puv.x < 0.0 || puv.x > 1.0 || puv.y < 0.0 || puv.y > 1.0) {
          gl_FragColor = vec4(cur, 1.0); return;      // came in from off-screen
        }
        vec2 px = 1.0 / res;
        vec3 mn = cur, mx = cur;
        for (int i = 0; i < 8; i++) {
          vec2 o = i == 0 ? vec2(1.0, 0.0) : i == 1 ? vec2(-1.0, 0.0)
                 : i == 2 ? vec2(0.0, 1.0) : i == 3 ? vec2(0.0, -1.0)
                 : i == 4 ? vec2(1.0, 1.0) : i == 5 ? vec2(-1.0, 1.0)
                 : i == 6 ? vec2(1.0, -1.0) : vec2(-1.0, -1.0);
          vec3 s = texture2D(tNew, vUv + o * px).rgb;
          mn = min(mn, s); mx = max(mx, s);
        }
        vec3 hist = clamp(texture2D(tOld, puv).rgb, mn, mx);
        gl_FragColor = vec4(mix(hist, cur, w), 1.0);
      }`,
      { tNew: { value: null }, tOld: { value: null }, tDepth: { value: null },
        projInv: { value: new THREE.Matrix4() }, viewInv: { value: new THREE.Matrix4() },
        prevVP: { value: new THREE.Matrix4() }, res: { value: new THREE.Vector2(1, 1) },
        w: { value: 1 }, uReproject: { value: 0 } });

    /* --- Output: lens, tone map, grade. */
    const outPass = pass(`
      varying vec2 vUv;
      uniform sampler2D tCol;
      uniform vec2 res; uniform float exposure; uniform float t; uniform float sharpen;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

      // three.js's fitted ACES (Stephen Hill). Tried AgX here — it is the more
      // modern transform and rolls highlights off more gracefully, but it is a
      // display transform with no look attached, and on this scene it landed
      // visibly flatter than the reference direct render for no gain worth the
      // risk. A plain Narkowicz fit is not a substitute: it reads washed grey.
      vec3 RRTAndODTFit(vec3 v){
        vec3 a = v * (v + 0.0245786) - 0.000090537;
        vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081;
        return a / b;
      }
      vec3 tonemap(vec3 color){
        const mat3 inM = mat3(
          0.59719, 0.07600, 0.02840,
          0.35458, 0.90834, 0.13383,
          0.04823, 0.01566, 0.83777);
        const mat3 outM = mat3(
           1.60475, -0.10208, -0.00327,
          -0.53108,  1.10813, -0.07276,
          -0.07367, -0.00605,  1.07602);
        color *= 1.0 / 0.6;
        return clamp(outM * RRTAndODTFit(inM * color), 0.0, 1.0);
      }

      void main(){
        vec2 d = vUv - 0.5;
        vec2 px = 1.0 / res;
        vec3 c0 = texture2D(tCol, vUv).rgb;

        /* Unsharp mask, in linear light, before the tone map. Averaging 64
           jittered samples is a box filter over the pixel and a box filter is
           soft; a small negative-lobe kernel puts the acutance back without
           the ringing a wider radius would add.

           It is computed on UNSHIFTED taps, deliberately. Sharpening the
           already-aberrated colour meant the two operations multiplied: the
           lens offset became the edge the sharpener then found and amplified,
           and every road marking grew a red rim on one side and a blue one on
           the other — a couple of tenths of a pixel of physics turned into two
           pixels of artefact. */
        vec3 c = c0;
        if (sharpen > 0.0) {
          vec3 blur = (texture2D(tCol, vUv + vec2(px.x, 0.0)).rgb +
                       texture2D(tCol, vUv - vec2(px.x, 0.0)).rgb +
                       texture2D(tCol, vUv + vec2(0.0, px.y)).rgb +
                       texture2D(tCol, vUv - vec2(0.0, px.y)).rgb) * 0.25;
          c = max(c0 + (c0 - blur) * sharpen, vec3(0.0));
        }

        /* Transverse chromatic aberration: a per-channel change of
           MAGNIFICATION, so red and blue are sampled at a slightly different
           scale about the optical centre. Added afterwards as a difference, at
           its true magnitude — about half a pixel in the extreme corners at
           1080p, nothing at the centre. Its absence is one of the quiet
           reasons a render reads as a diagram; its exaggeration is one of the
           loud reasons one reads as a filter. */
        float ca = dot(d, d) * 0.0013;
        c.r += texture2D(tCol, vUv + d * ca).r - c0.r;
        c.b += texture2D(tCol, vUv - d * ca).b - c0.b;
        c = max(c, vec3(0.0));

        c = tonemap(c * exposure);
        /* "Dull" on a deliberately minimal palette is almost never a shortage
           of colour — pushing saturation on a lime-white house just makes it
           look cheap. It is a shortage of TONAL separation: too little distance
           between the sunlit face, the shaded face and the sky. So the S-curve
           does the work, saturation barely moves, and the vignette is eased
           back because a heavy one reads as murk rather than as a lens. */
        float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
        c = mix(vec3(l), c, 1.18);
        c = clamp(c, 0.0, 1.0);
        c = c * c * (3.0 - 2.0 * c) * 0.42 + c * 0.58;
        // a little extra bite in the top end so sunlit plaster reads crisp
        // against the haze rather than dissolving into it
        c = clamp(c * 1.012 - 0.006, 0.0, 1.0);
        l = dot(c, vec3(0.2126, 0.7152, 0.0722));
        // hot-climate cast: warm the highlights a touch more than before, and
        // keep the shadows from going blue — dry-earth bounce, not sky
        c *= mix(vec3(1.000, 0.998, 0.996), vec3(1.034, 1.010, 0.968), smoothstep(0.10, 0.90, l));
        float vd = length(d) * 1.4142;
        c *= 1.0 - 0.14 * pow(smoothstep(0.46, 1.0, vd), 1.8);
        c = pow(max(c, 0.0), vec3(1.0 / 2.2));
        c += (hash(vUv * res + vec2(t, t * 1.7)) - 0.5) * 0.012 * (1.0 - l * 0.6);
        gl_FragColor = vec4(c, 1.0);
      }`,
      { tCol: { value: null }, res: { value: new THREE.Vector2(1, 1) },
        exposure: { value: 1 }, t: { value: 0 }, sharpen: { value: POST.lite ? 0.16 : 0.22 } });

    let rtScene = null, rtNorm = null, rtGI = null, rtGIb = null, rtSSR = null,
        rtHDR = null, rtAcc = [null, null], rw = 0, rh = 0, accIdx = 0;
    const _dbs = new THREE.Vector2();
    function ensureRT() {
      renderer.getDrawingBufferSize(_dbs);
      const w = Math.max(2, _dbs.x | 0), h = Math.max(2, _dbs.y | 0);
      if (w === rw && h === rh) return;
      rw = w; rh = h;
      [rtScene, rtNorm, rtGI, rtGIb, rtSSR, rtHDR, rtAcc[0], rtAcc[1]].forEach(rt => {
        if (rt) { if (rt.depthTexture) rt.depthTexture.dispose(); rt.dispose(); }
      });
      const dt = new THREE.DepthTexture(w, h);
      dt.type = THREE.UnsignedIntType;
      const lin = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false };
      const hdr = Object.assign({ type: THREE.HalfFloatType }, lin);
      rtScene = new THREE.WebGLRenderTarget(w, h, {
        type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
        depthBuffer: true, stencilBuffer: false, depthTexture: dt
      });
      rtNorm = new THREE.WebGLRenderTarget(w, h, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true, stencilBuffer: false });
      const gw = Math.max(2, w >> 1), gh = Math.max(2, h >> 1);
      rtGI = new THREE.WebGLRenderTarget(gw, gh, hdr);
      rtGIb = new THREE.WebGLRenderTarget(gw, gh, hdr);
      rtSSR = new THREE.WebGLRenderTarget(gw, gh, hdr);
      rtHDR = new THREE.WebGLRenderTarget(w, h, hdr);
      rtAcc[0] = new THREE.WebGLRenderTarget(w, h, hdr);
      rtAcc[1] = new THREE.WebGLRenderTarget(w, h, hdr);
      giPass.u.res.value.set(gw, gh);
      ssrPass.u.res.value.set(gw, gh);
      blurH.u.res.value.set(gw, gh); blurV.u.res.value.set(gw, gh);
      compPass.u.res.value.set(w, h);
      compPass.u.loRes.value.set(gw, gh);
      accPass.u.res.value.set(w, h);
      outPass.u.res.value.set(w, h);
      resetAccum();
    }

    // Halton — a low-discrepancy sequence covers the pixel far more evenly than
    // random offsets, so the image converges in far fewer samples
    function halton(i, b) {
      let f = 1, r = 0;
      while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); }
      return r;
    }
    let frameNo = 0;
    /* The jitter index free-runs, independently of the convergence counter.
       While the camera moves, POST.samples is pinned near the top of its
       history window and would otherwise hand back the SAME sub-pixel offset
       frame after frame — no jitter at all, so no antialiasing exactly when it
       is most visible. */
    let jitterIdx = 0;
    const prevVP = new THREE.Matrix4();
    const curVP = new THREE.Matrix4();
    let havePrev = false;

    POST.render = function () {
      ensureRT();
      if (!rtScene) { renderer.render(scene, camera); return; }
      nf.value.set(camera.near, camera.far);

      if (accumDirty) { POST.samples = 0; accumDirty = false; havePrev = false; }
      const moving = !!POST.moving;
      const n = POST.samples;
      if (!moving && n >= POST.max) {             // converged — just re-present
        outPass.u.tCol.value = rtAcc[accIdx].texture;
        outPass.u.exposure.value = POST.exposure;
        outPass.u.t.value = 0;
        renderer.setRenderTarget(null); renderer.render(outPass.scene, fsCam);
        return;
      }

      // --- jitter the projection by a sub-pixel offset for this sample
      jitterIdx = (jitterIdx + 1) & 31;
      const jx = (halton(jitterIdx + 1, 2) - 0.5), jy = (halton(jitterIdx + 1, 3) - 0.5);
      camera.setViewOffset(rw, rh, jx, jy, rw, rh);
      camera.updateProjectionMatrix();

      renderer.setClearColor(0x000000, 1);
      renderer.setRenderTarget(rtScene);
      renderer.render(scene, camera);
      renderNormals(rtNorm);

      const projInv = new THREE.Matrix4().copy(camera.projectionMatrix).invert();
      const seed = jitterIdx * 13.7 + 3.1;
      giPass.u.tDepth.value = rtScene.depthTexture;
      giPass.u.tNorm.value = rtNorm.texture;
      giPass.u.tColor.value = rtScene.texture;
      giPass.u.projInv.value.copy(projInv);
      giPass.u.proj.value.copy(camera.projectionMatrix);
      giPass.u.uSeed.value = seed;
      renderer.setRenderTarget(rtGI); renderer.render(giPass.scene, fsCam);

      blurH.u.tGI.value = rtGI.texture; blurH.u.tDepth.value = rtScene.depthTexture;
      renderer.setRenderTarget(rtGIb); renderer.render(blurH.scene, fsCam);
      blurV.u.tGI.value = rtGIb.texture; blurV.u.tDepth.value = rtScene.depthTexture;
      renderer.setRenderTarget(rtGI); renderer.render(blurV.scene, fsCam);

      ssrPass.u.tDepth.value = rtScene.depthTexture;
      ssrPass.u.tNorm.value = rtNorm.texture;
      ssrPass.u.tColor.value = rtScene.texture;
      ssrPass.u.projInv.value.copy(projInv);
      ssrPass.u.proj.value.copy(camera.projectionMatrix);
      ssrPass.u.uSeed.value = seed;
      ssrPass.u.viewInv.value.copy(camera.matrixWorld);
      ssrPass.u.skyUp.value.copy(SKY_UP);
      ssrPass.u.skyDn.value.copy(SKY_DN);
      renderer.setRenderTarget(rtSSR); renderer.render(ssrPass.scene, fsCam);

      compPass.u.tCol.value = rtScene.texture;
      compPass.u.tGI.value = rtGI.texture;
      compPass.u.tSSR.value = rtSSR.texture;
      compPass.u.tDepth.value = rtScene.depthTexture;
      compPass.u.tNorm.value = rtNorm.texture;
      compPass.u.projInv.value.copy(projInv);
      renderer.setRenderTarget(rtHDR); renderer.render(compPass.scene, fsCam);

      const src = accIdx, dst = 1 - accIdx;
      const reproject = moving && havePrev;
      accPass.u.tNew.value = rtHDR.texture;
      accPass.u.tOld.value = rtAcc[src].texture;
      accPass.u.tDepth.value = rtScene.depthTexture;
      accPass.u.projInv.value.copy(projInv);
      accPass.u.viewInv.value.copy(camera.matrixWorld);
      accPass.u.prevVP.value.copy(prevVP);
      accPass.u.uReproject.value = reproject ? 1 : 0;
      accPass.u.w.value = n === 0 ? 1.0 : 1.0 / (n + 1);
      renderer.setRenderTarget(rtAcc[dst]); renderer.render(accPass.scene, fsCam);
      accIdx = dst;

      // remember this frame's view-projection for the next reprojection
      curVP.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
      prevVP.copy(curVP);
      havePrev = true;

      camera.clearViewOffset();
      camera.updateProjectionMatrix();

      outPass.u.tCol.value = rtAcc[accIdx].texture;
      outPass.u.exposure.value = POST.exposure;
      outPass.u.t.value = (frameNo = (frameNo + 1) % 1024);
      renderer.setRenderTarget(null); renderer.render(outPass.scene, fsCam);

      POST.samples = n + 1;
    };

    /* Graceful degradation, in the order that costs the least to look at.
       Called by the frame loop when measured frame time stays over budget —
       the static tier guess is only a guess, and a device that turns out to be
       slower than it claimed should end up smooth rather than correct. */
    POST.degrade = function () {
      /* Walk down the resolution ladder, skipping rungs that would not change
         anything. On a device whose own pixel ratio is already below the next
         step, setting it is a no-op — and a no-op still costs the watchdog a
         full re-measurement window before it tries again, so a phone that
         needed the sample count cut spends several seconds slow first. */
      while (dprStep < DPR_STEPS.length - 1) {
        const before = renderer.getPixelRatio();
        dprStep++;
        const want = Math.min(BASE_DPR, DPR_STEPS[dprStep]);
        if (want >= before - 1e-4) continue;         // this rung changes nothing
        resize();                                   // re-applies via POST.applyDpr
        return 'dpr ' + want.toFixed(2);
      }
      if (POST.max > 12) { POST.max = 12; return 'samples 12'; }
      /* Last resort: drop the screen-space pipeline and render forward.
         Tone mapping moves back into the renderer, and applySun has to run
         again because the sky, fog and clear colours are fed as LINEAR
         radiance while the pipeline owns the tone map and as sRGB when it does
         not. The dynamic resolution scaler, which the frame loop keeps parked
         while the pipeline is on, takes over from here. */
      POST.on = false;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = POST.exposure;
      applySun(sunKey);
      renderer.setPixelRatio(Math.min(BASE_DPR, 1.0));
      resize();
      return 'post off';
    };

    POST.dbg = { giPass, ssrPass, compPass, outPass, accPass,
                 rt: () => ({ rtScene, rtNorm, rtGI, rtSSR, rtHDR, rtAcc, accIdx }) };
  })();

  applySun('morning');

  function renderFrame() {
    if (POST.on && POST.render) POST.render(); else renderer.render(scene, camera);
  }

  /* ---------- sun presets ---------- */
  document.querySelectorAll('#sun button').forEach(btn => {
    btn.addEventListener('click', () => { applySun(btn.getAttribute('data-sun')); wake(900); });
  });

  /* Temporal accumulation converges over POST.max jittered samples, so ANY
     change to what is on screen has to restart it or the new image is blended
     into the old one. Camera motion is handled inside the pipeline; these are
     the two this viewer adds. */
  const _setView = setView;
  setView = function (name, instant) { _setView(name, instant); resetAccum(); wake(900); };

  /* Convergence readout */
  const convEl = $('conv');
  function updateConv() {
    if (!convEl) return;
    if (!POST.on) { convEl.style.display = 'none'; return; }
    const done = POST.samples >= POST.max;
    convEl.textContent = done ? 'CONVERGED' : 'REFINING ' + POST.samples + '/' + POST.max;
    convEl.classList.toggle('done', done);
  }

  /* Handle for offscreen capture + geometry audits (the pane does not always
     composite, so a synchronous render has to be reachable from outside). */
  window.__dbg = {
    THREE, renderer, scene, camera, data, POST, ctl,
    applySun, setView: (n) => setView(n, true), resetAccum,
    render: () => { renderFrame(); },
    /* Point the camera at a target. Must go through ctl, not straight at
       camera.position: the depth-of-field pass focuses on ctl.target (see the
       composite), so a camera moved behind the controller's back keeps the old
       focus distance and the whole frame renders defocused. */
    look(px, py, pz, tx, ty, tz, fov) {
      ctl.target.set(tx, ty, tz); ctl.tTarget.copy(ctl.target);
      const dx = px - tx, dy = py - ty, dz = pz - tz;
      ctl.radius = ctl.tRadius = Math.sqrt(dx * dx + dy * dy + dz * dz);
      ctl.phi = ctl.tPhi = Math.acos(Math.max(-1, Math.min(1, dy / ctl.radius)));
      ctl.theta = ctl.tTheta = Math.atan2(dx, dz);
      if (fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
      applyCamera();
      resetAccum();
    },
    resolve() { for (let i = 0; i < POST.max; i++) renderFrame(); }
  };

  /* ---------- main loop ---------- */
  setView('exterior', true);

  /* Switching design reloads the page, and each scene has its own exterior
     preset — so without this the building would jump to a different angle every
     time you compared two versions. Carry the orbit across the reload instead,
     so only the building changes. */
  (function restoreCamera() {
    let saved = null;
    try { saved = JSON.parse(sessionStorage.getItem('house3d.cam') || 'null'); } catch (_) {}
    sessionStorage.removeItem('house3d.cam');
    if (!saved || typeof saved.radius !== 'number') return;
    ctl.target.set(saved.tx, saved.ty, saved.tz); ctl.tTarget.copy(ctl.target);
    ctl.radius = ctl.tRadius = saved.radius;
    ctl.phi = ctl.tPhi = saved.phi;
    ctl.theta = ctl.tTheta = saved.theta;
    ctl.interacted = true;                       // don't auto-rotate away from it
  })();
  window.__saveCamera = function () {
    try {
      sessionStorage.setItem('house3d.cam', JSON.stringify({
        tx: ctl.target.x, ty: ctl.target.y, tz: ctl.target.z,
        radius: ctl.radius, phi: ctl.phi, theta: ctl.theta
      }));
    } catch (_) {}
  };

  applyCamera();

  /* hint recall */
  const hintEl = $('hint'), hintBtn = $('hintBtn');
  let hintHidden = false;
  function hideHint() {
    hintEl.classList.add('fade');
    hintHidden = true;
    hintBtn.classList.add('show');
  }
  hintBtn.addEventListener('click', () => {
    hintEl.classList.remove('fade');
    hintBtn.classList.remove('show');
    hintHidden = false;
    setTimeout(hideHint, 6000);
  });

  // camera is "settled" when it has finished damping toward its target
  function camSettled() {
    return !tween
      && Math.abs(ctl.tTheta - ctl.theta) < 3e-4
      && Math.abs(ctl.tPhi - ctl.phi) < 3e-4
      && Math.abs(ctl.tRadius - ctl.radius) < 3e-3
      && ctl.target.distanceToSquared(ctl.tTarget) < 1e-6;
  }

  /* Frame-time watchdog for the screen-space pipeline.

     The tier in perf.js is a guess made from a GPU name string, a core count
     and a RAM figure, and on the long tail of Android devices that guess is
     sometimes wrong by a factor of three. Rather than trust it, measure: if the
     CPU-side cost of a full pipeline frame stays over budget for a couple of
     seconds, step the quality down one notch (resolution, then sample count,
     then the pipeline itself) and measure again. A device that cannot afford
     this ends up on the forward path automatically instead of at 9 fps.

     Only sustained overruns count. Shader compilation, texture upload and the
     first shadow bake all land in the first second and none of them repeat. */
  let budgetOver = 0, budgetSamples = 0, budgetEma = 0;
  function watchBudget(ms) {
    if (!POST.on || !POST.degrade) return;
    if (++budgetSamples < 30) return;              // ignore warm-up
    budgetEma += (Math.min(ms, 120) - budgetEma) * 0.08;
    if (budgetEma > 26) {
      if (++budgetOver > 90) {
        budgetOver = 0; budgetEma = 0;
        const step = POST.degrade();
        console.info('[perf] frame budget exceeded — stepping down:', step);
      }
    } else if (budgetOver > 0) {
      budgetOver--;
    }
  }

  let last = performance.now(), firstFrame = false;
  /* Float64, not Float32. Matrix4.elements holds doubles; storing them in a
     Float32Array truncates every value, so the very next comparison against the
     untruncated original reports a difference and the detector below fires on
     EVERY frame — resetting the accumulation each time, so the image would sit
     at sample 0 forever and never resolve. */
  const _lastCam = new Float64Array(16);
  function frame(now) {
    requestAnimationFrame(frame);
    const frameMs = now - last; last = now;
    if (document.hidden || contextLost) return;  // pause when tab hidden / GPU lost
    const dt = Math.min(0.05, frameMs / 1000);
    /* The dynamic resolution scaler is OFF while the pipeline is on.
       It nudges renderer.setPixelRatio() every frame to hold a target fps, but
       every change to the drawing-buffer size makes ensureRT() dispose and
       reallocate eight render targets and a depth texture. Against a pipeline
       that is heavy by design, the scaler oscillates and reallocates constantly,
       which stutters far worse than the resolution change ever helped — and it
       resets the accumulation each time, so the image never converges.
       Supersampling is not this renderer's antialiasing strategy anyway; the
       jittered accumulation is. Low/potato tiers never enable POST, so they
       still get the scaler. */
    if (!POST.on) scaler.sample(frameMs);

    // advance camera state every frame (cheap); auto-rotate keeps exterior alive briefly
    if (tween) {
      const t = clamp((now - tween.t0) / tween.dur, 0, 1);
      const k = easeInOutCubic(t);
      ctl.target.lerpVectors(tween.from.target, tween.dest.target, k);
      ctl.radius = tween.from.radius + (tween.dest.radius - tween.from.radius) * k;
      ctl.phi = tween.from.phi + (tween.dest.phi - tween.from.phi) * k;
      ctl.theta = tween.from.theta + tween.dTheta * k;
      ctl.tTarget.copy(ctl.target); ctl.tRadius = ctl.radius; ctl.tPhi = ctl.phi; ctl.tTheta = ctl.theta;
      if (t >= 1) tween = null;
    } else {
      if (activeView === 'exterior' && !ctl.interacted && !reduceMotion && now < autoRotateUntil) {
        ctl.tTheta += dt * AUTO_ROTATE_SPEED;
      }
      const k = 1 - Math.exp(-dt * DAMPING_RATE);
      ctl.target.lerp(ctl.tTarget, k);
      ctl.radius += (ctl.tRadius - ctl.radius) * k;
      ctl.phi += (ctl.tPhi - ctl.phi) * k;
      ctl.theta += (ctl.tTheta - ctl.theta) * k;
    }
    applyCamera();

    /* Detect camera movement and hand the temporal filter a history window
       instead of throwing the history away.

       The accumulation buffer holds an average of POST.max jittered samples,
       which is only literally valid while the view is fixed. The old code
       reset it to zero on any camera change — correct, but it meant every
       frame of an orbit showed a SINGLE 2-ray global-illumination sample, and
       that is the boiling, crawling image the whole picture dissolved into as
       soon as you dragged it. The accumulate pass now reprojects the history
       through last frame's view-projection, so it stays valid through motion;
       all this has to do is pin the blend weight to a responsive value
       (1/7 ≈ 0.14, so ~86 % of the history survives each frame) and let it
       climb back toward a full average once the camera settles. */
    if (POST.on) {
      const e = camera.matrixWorld.elements;
      let moved = false;
      for (let i = 0; i < 16; i++) { if (e[i] !== _lastCam[i]) { moved = true; break; } }
      if (moved) {
        for (let i = 0; i < 16; i++) _lastCam[i] = e[i];
        /* 8 → the accumulate pass runs at w = 1/9, so ~89 % of the reprojected
           history survives each frame. Measured against a per-frame reset on
           the same camera path, that is 2.5× less frame-to-frame change.
           Pushing the history weight higher is tempting and is what starts to
           show as smearing behind moving silhouettes; the neighbourhood clamp
           only protects so far. */
        POST.samples = Math.min(POST.samples, 8);
        POST.movingUntil = now + 90;      // ride out a one-frame pause mid-drag
      }
      POST.moving = now < POST.movingUntil;
    }

    // render only when needed: moving, mid-tween, or recently interacted
    const converging = POST.on && (POST.moving || POST.samples < POST.max);
    if (now < wakeUntil || tween || !camSettled() || converging) {
      const t0 = POST.on ? performance.now() : 0;
      renderFrame();
      if (POST.on) watchBudget(performance.now() - t0);
      updateConv();
      updateLabels(window.innerWidth, window.innerHeight);
      updateCompass();
      if (!firstFrame) {
        firstFrame = true;
        /* Loading screen dismissal tied to actual first render.
           Null-guarded: the 2.5 s fail-safe below can have removed the element
           already. That happens whenever the first frame is late — the tab was
           backgrounded during boot, so requestAnimationFrame never fired and
           this branch did not reach the DOM until the user came back to a page
           whose loading screen was long gone. Dereferencing it there threw
           inside the rAF callback and killed the render loop outright. */
        const lo = $('loading');
        if (lo) {
          lo.classList.add('done');
          setTimeout(() => lo.remove(), 650);
        }
        setTimeout(hideHint, 6000);
        // Re-bake shadows after car may have loaded / first full frame
        requestAnimationFrame(refreshShadows);
      }
    }
  }
  wake(1500);                                    // render through startup
  requestAnimationFrame(frame);

  // Fail-safe: dismiss loading screen after boot if firstFrame flag hasn't cleared
  setTimeout(function () {
    const lo = $('loading');
    if (lo && !lo.classList.contains('done')) {
      lo.classList.add('done');
      setTimeout(() => lo.remove(), 650);
    }
  }, 2500);

  } catch (err) {
    bootFail('FAILED TO RENDER 3D SCENE — ' + (err.message || err));
    console.error('App boot error:', err);
  }
})();
</script>
</body>
</html>
