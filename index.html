<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, interactive-widget=resizes-visual, viewport-fit=cover">
<title>Chandrasekhar Residence · Anantapur</title>
<meta name="description" content="Interactive 3D visualization — Mr Chandrasekhar Family Residence, G+2, Anantapur.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101214; --panel:rgba(22,24,27,.72); --panel-line:rgba(255,255,255,.08);
    --ink:#e8e6e1; --ink-dim:#9a9890; --brass:#c9a36a; --brass-dim:rgba(201,163,106,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg); color:var(--ink);
    font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #c:active{cursor:grabbing}
  /* vignette */
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(120% 90% at 50% 42%, transparent 55%, rgba(0,0,0,.42) 100%)}
  /* labels */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
  .rlabel{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;will-change:transform;
    display:flex;flex-direction:column;align-items:center;gap:1px;
    padding:5px 9px 6px;border-radius:7px;
    background:rgba(18,20,22,.66);border:1px solid rgba(255,255,255,.09);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:border-color .2s, background .2s;text-align:center;white-space:nowrap;
    max-width:200px}
  .rlabel:active{background:rgba(201,163,106,.18);border-color:var(--brass-dim)}
  .rlabel:hover{border-color:var(--brass-dim);background:rgba(26,27,29,.82)}
  .rlabel .rn{font-family:Archivo,Inter,sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.14em;
    overflow:hidden;text-overflow:ellipsis;max-width:180px}
  .rlabel .rd{font-size:9px;color:var(--ink-dim);letter-spacing:.05em}
  /* title block */
  #titleblock{position:fixed;top:max(18px, env(safe-area-inset-top));left:22px;z-index:6;user-select:none}
  #titleblock h1{font-family:Archivo,Inter,sans-serif;font-weight:700;font-size:17px;letter-spacing:.34em;line-height:1.35}
  #titleblock p{font-size:10.5px;letter-spacing:.3em;color:var(--ink-dim);margin-top:4px}
  #titleblock i{display:block;width:46px;height:2px;background:var(--brass);margin-top:10px}
  /* compass */
  #compass{position:fixed;top:max(18px, env(safe-area-inset-top));right:20px;z-index:6;
    width:52px;height:52px;border-radius:50%;
    background:var(--panel);border:1px solid var(--panel-line);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  #needle{position:absolute;inset:0;transition:transform .15s ease-out}
  #needle::before{content:"";position:absolute;left:50%;top:7px;width:2px;height:19px;margin-left:-1px;
    background:linear-gradient(var(--brass),transparent)}
  #needle::after{content:"N";position:absolute;left:50%;top:5px;transform:translateX(-50%);
    font-size:8.5px;font-weight:600;color:var(--brass);letter-spacing:0}
  #compass b{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--ink-dim)}
  /* rooms panel */
  #roomsPanel{position:fixed;top:50%;right:20px;transform:translateY(-50%);z-index:6;width:228px;
    max-height:min(64vh,560px);display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:opacity .35s, transform .35s}
  #roomsPanel.off{opacity:0;pointer-events:none;transform:translateY(-50%) translateX(14px)}
  #roomsPanel h3{font-family:Archivo;font-size:10.5px;font-weight:600;letter-spacing:.26em;color:var(--brass);
    padding:14px 16px 10px;border-bottom:1px solid var(--panel-line)}
  #roomsList{list-style:none;overflow-y:auto;padding:6px 0;scrollbar-width:thin;scrollbar-color:#3a3d41 transparent}
  #roomsList::-webkit-scrollbar{width:4px}
  #roomsList::-webkit-scrollbar-thumb{background:#3a3d41;border-radius:2px}
  #roomsList li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    padding:8px 16px;cursor:pointer;border-left:2px solid transparent;transition:background .15s,border-color .15s}
  #roomsList li:hover{background:rgba(255,255,255,.045)}
  #roomsList li.sel{border-left-color:var(--brass);background:rgba(201,163,106,.08)}
  #roomsList li span{font-size:11.5px;font-weight:500;letter-spacing:.06em}
  #roomsList li em{font-style:normal;font-size:9.5px;color:var(--ink-dim);white-space:nowrap}
  /* info card */
  #infoCard{position:fixed;left:22px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:7;width:236px;
    background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:15px 16px 14px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:opacity .3s, transform .3s}
  #infoCard.hidden{opacity:0;pointer-events:none;transform:translateY(8px)}
  #infoCard h4{font-family:Archivo;font-size:13px;font-weight:600;letter-spacing:.18em;padding-right:22px}
  #infoCard .mm{margin-top:7px;font-size:12px;color:var(--ink)}
  #infoCard .ft{margin-top:2px;font-size:11px;color:var(--ink-dim)}
  /* info card */
  #infoCard{position:fixed;left:22px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:7;width:236px;
    background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:15px 16px 14px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:opacity .3s, transform .3s}
  #infoCard.hidden{opacity:0;pointer-events:none;transform:translateY(8px)}
  #infoCard h4{font-family:Archivo;font-size:13px;font-weight:600;letter-spacing:.18em;padding-right:22px}
  #infoCard .mm{margin-top:7px;font-size:12px;color:var(--ink)}
  #infoCard .ft{margin-top:2px;font-size:11px;color:var(--ink-dim)}
  #infoCard .ar{margin-top:8px;font-size:10.5px;letter-spacing:.08em;color:var(--brass)}
  #cardClose{position:absolute;top:9px;right:11px;background:none;border:none;color:var(--ink-dim);
    font-size:15px;cursor:pointer;line-height:1;padding:3px}
  #cardClose:hover{color:var(--ink)}

  /* ==========================================================================
     TOP DESIGN SELECTOR
     ========================================================================== */
  #design{position:fixed;top:max(16px, env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:8;
    display:flex;align-items:center;background:rgba(18,20,23,.88);border:1px solid var(--panel-line);
    border-radius:12px;overflow:hidden;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 32px rgba(0,0,0,.35);max-width:min(900px, calc(100vw - 32px))}
  #design .lbl{padding:9px 12px 8px;font-family:Archivo,Inter,sans-serif;font-size:9.5px;font-weight:700;
    letter-spacing:.22em;color:var(--brass);border-right:1px solid var(--panel-line);flex:none;
    background:rgba(201,163,106,.06)}
  #design .scroller{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #design .scroller::-webkit-scrollbar{display:none}
  #design button, #design a.all-link{appearance:none;background:none;border:none;color:var(--ink-dim);cursor:pointer;
    padding:8px 14px 7px;position:relative;transition:all .2s cubic-bezier(0.16,1,0.3,1);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    white-space:nowrap;flex:none;text-decoration:none}
  #design button + button, #design button + a, #design a + button{border-left:1px solid var(--panel-line)}
  #design button .d-code{font-family:Archivo,Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;line-height:1}
  #design button .d-name{font-size:8.5px;letter-spacing:.08em;color:rgba(255,255,255,.45);font-weight:500;line-height:1}
  #design button:hover{background:rgba(255,255,255,.05);color:var(--ink)}
  #design button:hover .d-name{color:rgba(255,255,255,.8)}
  #design button.on{color:var(--ink);background:rgba(201,163,106,.12)}
  #design button.on .d-code{color:var(--brass)}
  #design button.on .d-name{color:var(--ink)}
  #design button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;
    background:var(--brass);box-shadow:0 0 8px var(--brass)}
  #design a.all-link{font-family:Archivo,Inter,sans-serif;font-size:9.5px;font-weight:700;
    letter-spacing:.16em;color:var(--brass);padding:9px 13px 8px;background:rgba(201,163,106,.04)}
  #design a.all-link:hover{background:rgba(201,163,106,.15);color:#f0d6a8}

  /* ==========================================================================
     UNIFIED BOTTOM CONTROL DOCK (FLOORS + SUN + WALKTHROUGH)
     ========================================================================== */
  #bottomDock{position:fixed;bottom:max(18px, env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    z-index:7;display:flex;align-items:center;background:rgba(18,20,23,.88);border:1px solid var(--panel-line);
    border-radius:12px;overflow:hidden;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 32px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}
  .dock-group{display:flex;align-items:center}
  .dock-lbl{padding:12px 10px 11px 13px;font-family:Archivo,Inter,sans-serif;font-size:9px;font-weight:700;
    letter-spacing:.22em;color:var(--brass);opacity:.85;user-select:none;flex:none}
  .dock-divider{width:1px;height:22px;background:var(--panel-line);flex:none}

  #views, #sun{display:flex;align-items:center;background:none;border:none;border-radius:0}
  #views button, #sun button, #bottomDock .wt-link{appearance:none;background:none;border:none;color:var(--ink-dim);
    cursor:pointer;font-family:Archivo,Inter,sans-serif;font-size:10px;font-weight:600;letter-spacing:.16em;
    padding:12px 14px 11px;position:relative;transition:all .2s;white-space:nowrap;flex:none;
    text-decoration:none;display:flex;align-items:center;gap:6px}
  #views button + button, #sun button + button{border-left:1px solid rgba(255,255,255,.05)}
  #views button:hover, #sun button:hover, #bottomDock .wt-link:hover{color:var(--ink);background:rgba(255,255,255,.04)}
  #views button.on, #sun button.on{color:var(--ink)}
  #views button.on::after, #sun button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;
    height:2px;background:var(--brass);box-shadow:0 0 6px var(--brass)}
  #views button[disabled]{opacity:.32;cursor:not-allowed}
  #views button[disabled]:hover{color:var(--ink-dim);background:none}

  #bottomDock .wt-link{color:var(--brass);font-weight:700;padding:12px 15px 11px;background:rgba(201,163,106,.06)}
  #bottomDock .wt-link:hover{background:rgba(201,163,106,.16);color:#f0d6a8}
  #bottomDock .wt-link svg{width:12px;height:12px;flex-shrink:0;fill:none;stroke:currentColor;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* convergence readout */
  #conv{position:fixed;right:20px;bottom:max(18px, env(safe-area-inset-bottom));z-index:7;
    font-family:Archivo,Inter,sans-serif;font-size:9.5px;letter-spacing:.16em;color:var(--ink-dim);
    background:var(--panel);border:1px solid var(--panel-line);border-radius:9px;padding:9px 12px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:opacity .5s;pointer-events:none}
  #conv.done{opacity:0}

  /* hint */
  #hint{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;
    font-size:10.5px;letter-spacing:.12em;color:var(--ink-dim);transition:opacity .8s;white-space:nowrap}
  #hint.fade{opacity:0}
  #hint .d{display:none}
  /* loading */
  #loading{position:fixed;inset:0;z-index:20;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    transition:opacity .6s}
  #loading.done{opacity:0;pointer-events:none}
  #loading .lt{font-family:Archivo;font-weight:700;font-size:16px;letter-spacing:.4em;text-indent:.4em;text-align:center}
  #loading .ls{font-size:10px;letter-spacing:.3em;text-indent:.3em;color:var(--ink-dim)}
  #loading .bar{width:150px;height:2px;background:rgba(255,255,255,.08);border-radius:1px;overflow:hidden;margin-top:8px}
  #loading .bar i{display:block;width:40%;height:100%;background:var(--brass);border-radius:1px;
    animation:shimmer 1.2s ease-in-out infinite}
  @keyframes shimmer{0%{transform:translateX(-110%)}100%{transform:translateX(380%)}}
  /* mobile room drawer */
  #mobileRoomBtn{display:none;position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:6;
    width:42px;height:42px;border-radius:50%;border:1px solid var(--panel-line);
    background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    color:var(--brass);font-size:18px;cursor:pointer;align-items:center;justify-content:center;
    transition:background .2s}
  #mobileRoomBtn:hover,#mobileRoomBtn:active{background:rgba(201,163,106,.15)}
  #mobileDrawer{display:none;position:fixed;left:0;right:0;bottom:0;z-index:15;
    max-height:52vh;background:var(--panel);border-top:1px solid var(--panel-line);
    border-radius:14px 14px 0 0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    flex-direction:column;transform:translateY(100%);transition:transform .35s ease-out}
  #mobileDrawer.open{transform:translateY(0)}
  #mobileDrawer .drawer-handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);
    margin:10px auto 6px;flex-shrink:0}
  #mobileDrawer h3{font-family:Archivo;font-size:10.5px;font-weight:600;letter-spacing:.26em;color:var(--brass);
    padding:6px 16px 10px;border-bottom:1px solid var(--panel-line);flex-shrink:0}
  #mobileDrawer ul{list-style:none;overflow-y:auto;padding:6px 0;scrollbar-width:thin;scrollbar-color:#3a3d41 transparent;flex:1}
  #mobileDrawer ul li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    padding:12px 20px;cursor:pointer;border-left:2px solid transparent;transition:background .15s,border-color .15s}
  #mobileDrawer ul li:hover{background:rgba(255,255,255,.045)}
  #mobileDrawer ul li.sel{border-left-color:var(--brass);background:rgba(201,163,106,.08)}
  #mobileDrawer ul li span{font-size:12.5px;font-weight:500;letter-spacing:.06em}
  #drawerOverlay{display:none;position:fixed;inset:0;z-index:14;background:rgba(0,0,0,.35)}
  /* hint recall */
  #hintBtn{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom));transform:translateX(90px);z-index:7;
    width:26px;height:26px;border-radius:50%;border:1px solid var(--panel-line);
    background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:var(--ink-dim);font-size:12px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .4s}
  #hintBtn.show{opacity:1}
  #hintBtn:hover{color:var(--ink);border-color:var(--brass-dim)}
  /* aria status */
  #ariaStatus{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
  @media (max-width:959px){
    #roomsPanel{display:none}
    #mobileRoomBtn{display:flex}
    #mobileDrawer{display:flex}
    #titleblock h1{font-size:13.5px;letter-spacing:.26em}
    #titleblock p{font-size:9px}
    #design{top:max(12px, env(safe-area-inset-top));left:12px;right:12px;transform:none;max-width:none}
    #design button{padding:6px 9px 5px}
    #design button .d-code{font-size:10px}
    #design button .d-name{font-size:7.5px}
    #bottomDock{bottom:max(12px, env(safe-area-inset-bottom));left:12px;right:12px;transform:none;max-width:none;overflow-x:auto}
    #views button, #sun button, #bottomDock .wt-link{padding:10px 9px 9px;font-size:9px;letter-spacing:.12em}
    #infoCard{left:14px;right:14px;width:auto}
    #hint .d{display:none}#hint .m{display:inline}
    #hintBtn{transform:translateX(70px)}
  }
  @media (min-width:960px){ #hint .m{display:none}#hint .d{display:inline} }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:0.01ms!important;animation-iteration-count:1!important;
      transition-duration:0.01ms!important}
    #loading .bar i{animation:none}
  }
</style>
<script>
/* Which scene this page builds. Default is the full V43 house, interiors and
   all; ?v=v38 … ?v=v43 load that elevation version's exterior-only shell.
   Declared in <head> so the DESIGN chooser can render before the 3D bootstrap
   at the end of <body> has run. */
window.DESIGNS = {
  full: { dir: null,                   code: 'FULL', title: 'FULL HOUSE',       sub: 'With Interiors · V43 Rods', interiors: true  },
  v43:  { dir: 'version-forty-three',  code: 'V43',  title: 'CONTINUOUS RODS',  sub: 'Unbroken Rods · Recessed Slabs', interiors: false },
  v41:  { dir: 'version-forty-one',    code: 'V41',  title: 'CLOVER JALI',      sub: '4-Leaf Heart Clover Screen', interiors: false },
  v38:  { dir: 'version-thirty-eight', code: 'V38',  title: 'SPLAYED ROD BOX',  sub: 'Full-Height Splayed Frame', interiors: false },
  v40:  { dir: 'version-forty',        code: 'V40',  title: 'ROD BOX TO ROOF',  sub: 'Continuous Rods to Roof', interiors: false }
};
(function () {
  var q = (location.search.match(/[?&]v=([A-Za-z0-9]+)/) || [])[1];
  q = q ? q.toLowerCase() : 'full';
  // An unknown ?v= falls back to the full house rather than failing to boot.
  window.DESIGN = window.DESIGNS[q] ? q : 'full';
})();
</script>
</head>
<body>
<canvas id="c" aria-label="Interactive 3D model of Chandrasekhar Residence"></canvas>
<div id="labels"></div>

<header id="titleblock">
  <h1>CHANDRASEKHAR<br>RESIDENCE</h1>
  <p>ANANTAPUR · G+2 · EAST FACING</p>
  <i></i>
</header>

<div id="compass" aria-hidden="true"><div id="needle"></div><b></b></div>

<aside id="roomsPanel" class="off">
  <h3 id="panelTitle">ROOMS</h3>
  <ul id="roomsList"></ul>
</aside>

<div id="infoCard" class="hidden">
  <button id="cardClose" aria-label="Close">×</button>
  <h4 id="cardName"></h4>
  <div class="mm" id="cardMM"></div>
  <div class="ft" id="cardFT"></div>
  <div class="ar" id="cardAR"></div>
</div>

<!-- Top Design Selector -->
<nav id="design" aria-label="Design version">
  <span class="lbl">DESIGN</span>
  <div class="scroller" id="designPills"></div>
  <a href="elevations/" class="all-link" title="Compare all elevation versions">ALL DESIGNS →</a>
</nav>
<script>
/* Built outside the 3D bootstrap so the chooser still works if WebGL fails. */
(function () {
  var pills = document.getElementById('designPills');
  Object.keys(window.DESIGNS).forEach(function (key) {
    var d = window.DESIGNS[key], b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = '<span class="d-code">' + d.code + '</span><span class="d-name">' + d.title + '</span>';
    b.title = d.title + ' (' + d.code + ') — ' + d.sub;
    b.setAttribute('aria-pressed', String(key === window.DESIGN));
    if (key === window.DESIGN) b.classList.add('on');
    b.addEventListener('click', function () {
      if (key === window.DESIGN) return;
      if (window.__saveCamera) window.__saveCamera();   // keep the angle across the reload
      location.href = location.pathname + (key === 'full' ? '' : '?v=' + key);
    });
    pills.appendChild(b);
  });
  var on = pills.querySelector('button.on');
  if (on) on.scrollIntoView({ block: 'nearest', inline: 'center' });
})();
</script>

<!-- Unified Bottom Control Dock -->
<div id="bottomDock" aria-label="Viewer controls">
  <div class="dock-group">
    <span class="dock-lbl">LEVEL</span>
    <nav id="views">
      <button data-view="exterior" class="on" aria-pressed="true">EXTERIOR</button>
      <button data-view="floor0" aria-pressed="false">GROUND</button>
      <button data-view="floor1" aria-pressed="false">FIRST</button>
      <button data-view="floor2" aria-pressed="false">SECOND</button>
    </nav>
  </div>

  <div class="dock-divider"></div>

  <div class="dock-group">
    <span class="dock-lbl">SUN</span>
    <nav id="sun">
      <button data-sun="morning" class="on" aria-pressed="true">MORNING</button>
      <button data-sun="midday" aria-pressed="false">MIDDAY</button>
      <button data-sun="golden" aria-pressed="false">GOLDEN</button>
    </nav>
  </div>

  <div class="dock-divider"></div>

  <a href="walkthrough.html" class="wt-link" title="First-person walkthrough">
    <svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/></svg>
    <span>WALKTHROUGH</span>
  </a>
</div>

<div id="conv"></div>

<div id="hint">
  <span class="d">DRAG TO ORBIT · SCROLL TO ZOOM · RIGHT-DRAG TO PAN</span>
  <span class="m">DRAG TO ORBIT · PINCH TO ZOOM</span>

    return texCache.field = { map: asTex(c, true), ns: 0.3 };
  }

  const TEX = {
    plaster: kitPlaster, sandfloat: kitSandFloat, stone: kitStone, concrete: kitConcrete, wood: kitWood,
    tile: kitTile, paver: kitPaver, asphalt: kitAsphalt, grass: kitGrass,
    dirt: kitDirt, leaf: kitLeaf, bark: kitBark, metal: kitMetal,
    carPaint: kitCarPaint, field: kitField
  };

  /* ==========================================================================
     2 · MATERIAL TREATMENTS
     ========================================================================== */
  const C = window.HouseScene.COLORS;
  const UNMAPPED = {};

  function treatment(name) {
    switch (name) {
      case 'white':       return { tex: 'plaster', tile: 3.0, rough: 0.93, metal: 0, env: 0.45, grime: 1.0 };
      case 'white2':      return { tex: 'plaster', tile: 2.6, rough: 0.90, metal: 0, env: 0.48, grime: 0.7 };
      /* 1.0 m tile. At 2048 px that is ~0.5 mm per texel, so the grains land
         at roughly their real size instead of being stretched into patches.
         Low grime as well — the previous 0.9 was adding its own streaks on top
         of an already-blotchy map and compounding the stained look. */
      case 'eastPlaster': return { tex: 'sandfloat', tile: 1.0, rough: 0.98, metal: 0, env: 0.34, grime: 0.35 };
      case 'sand':        return { tex: 'plaster', tile: 2.8, rough: 0.94, metal: 0, env: 0.42, grime: 1.0 };
      case 'tank':        return { tex: 'plaster', tile: 1.4, rough: 0.62, metal: 0, env: 0.45, grime: 0.5 };
      case 'nbr1': case 'nbr2': case 'nbr3':
        return { tex: 'plaster', tile: 3.6, rough: 0.95, metal: 0, env: 0.38, grime: 1.4 };
      case 'stone':       return { tex: 'stone', tile: 2.4, rough: 0.62, metal: 0, env: 0.55, grime: 0.8 };
      case 'copingLight': return { tex: 'stone', tile: 2.0, rough: 0.60, metal: 0, env: 0.58, grime: 0.9 };
      case 'plinth':      return { tex: 'stone', tile: 1.8, rough: 0.72, metal: 0, env: 0.48, grime: 1.5 };
      case 'charcoal': case 'charDark': case 'solarFrm':
        return { tex: 'concrete', tile: 3.4, rough: 0.86, metal: 0, env: 0.45, grime: 1.1 };
      case 'concrete':    return { tex: 'concrete', tile: 2.6, rough: 0.92, metal: 0, env: 0.40, grime: 1.2 };
      /* Outdoor tile — terrace deck, balcony decks, the open landings.

         `matte` is the important part. It shares the vitrified-tile kit with
         the indoor floors, and that kit's roughness map is authored around
         0.35: correct for a polished living-room floor, badly wrong out here.
         Applied to 560 m² of open terrace it produced a semi-gloss plane that
         mirrored the pergola, the railing and the furniture — the deck read as
         wet, or as a swimming pool, from every angle. Real terrace tile in
         Anantapur is anti-skid: coarse, matte, and reflective only as a faint
         sheen at grazing incidence. So skip the kit's roughness map, take the
         literal value below, and keep just enough reflectivity for that sheen. */
      case 'terraceF': case 'balcTile': case 'tOut':
        return { tex: 'tile', tile: 1.35, rough: 0.78, metal: 0, env: 0.40, reflect: 0.09, matte: true };
      // Dry paving is not a mirror — it only reflects at grazing angles, and
      // the SSR pass already applies Fresnel on top of these. Anything above
      // ~0.1 here and the street reads as wet.
      case 'pave': case 'paver': case 'paver2':
        return { tex: 'paver', tile: 1.4, rough: 0.90, metal: 0, env: 0.36, reflect: 0.05 };
      case 'road':        return { tex: 'asphalt', tile: 7.0, rough: 0.96, metal: 0, env: 0.24, reflect: 0.05 };
      case 'roadLine':    return { tex: 'concrete', tile: 1.4, rough: 0.80, metal: 0, env: 0.30 };
      case 'ground':      return { tex: 'field', tile: 46, rough: 1.0, metal: 0, env: 0.28 };
      case 'plotPad':     return { tex: 'dirt', tile: 9.0, rough: 1.0, metal: 0, env: 0.28 };
      case 'soil':        return { tex: 'dirt', tile: 0.7, rough: 1.0, metal: 0, env: 0.20 };
      case 'grass':       return { tex: 'grass', tile: 2.4, rough: 1.0, metal: 0, env: 0.30 };
      case 'leafDark': case 'leafLight':
        return { tex: 'leaf', tile: 1.5, rough: 0.90, metal: 0, env: 0.42, cutout: 0.48, twoSided: true };
      case 'green': case 'green2':
        return { tex: 'leaf', tile: 1.1, rough: 0.90, metal: 0, env: 0.40, cutout: 0.40, twoSided: true };
      case 'boug': case 'ixora': case 'flowerPink':
        return { tex: 'leaf', tile: 0.45, rough: 0.85, metal: 0, env: 0.4 };
      case 'bark': case 'barkLight':
        return { tex: 'bark', tile: 0.6, rough: 0.95, metal: 0, env: 0.28 };
      case 'walnut': case 'woodF': case 'woodD': case 'skirt':
        return { tex: 'wood', tile: 1.0, rough: 0.46, metal: 0, env: 0.62, reflect: 0.22 };
      case 'ms':         return { tex: 'metal', tile: 0.8, rough: 0.42, metal: 0.30, env: 1.0, reflect: 0.35 };
      case 'frame':      return { tex: 'metal', tile: 0.6, rough: 0.36, metal: 0.65, env: 1.05, reflect: 0.5 };
      /* Balustrades and the gate. The palette calls these stainless and at
         metalness 1.0 with a light base they behave like one: a mirror pointed
         at a bright sky, which renders as a pale washed-out line exactly where
         the facade most needs a crisp one. Real architectural balustrades are
         nearly always powder-coated mild steel — a dielectric with a dark
         colour and a soft sheen. Treated as that, so the horizontals read as
         fine dark lines instead of dissolving into the wall behind them. */
      case 'steel':
        return { tex: 'metal', tile: 0.5, rough: 0.44, metal: 0.28, env: 0.80, reflect: 0.28 };
      case 'liftSteel': case 'liftDoor':
        return { rough: 0.26, metal: 1.0, env: 1.15, reflect: 0.8 };
      case 'brass': case 'accentWarm':
        return { rough: 0.30, metal: 0.92, env: 1.15, reflect: 0.7 };
      case 'chrome': case 'liftChrome':
        return { rough: 0.14, metal: 1.0, env: 1.15, reflect: 0.9 };
      case 'solar':      return { rough: 0.10, metal: 0.55, env: 1.45, reflect: 0.9 };
      case 'nbrWin':     return { rough: 0.08, metal: 0.45, env: 1.35, reflect: 0.9 };
      case 'whiteG':     return { rough: 0.08, metal: 0.02, env: 1.1, reflect: 0.6 };
      case 'tharRed': case 'carBody':
        return { tex: 'carPaint', tile: 0.5, rough: 0.16, metal: 0.85, env: 1.5, reflect: 0.95 };
      case 'carDark':    return { rough: 0.55, metal: 0.25, env: 0.6 };
      case 'fabric': case 'fabric2': case 'curtain': case 'curtain2': case 'rug':
        return { tex: 'plaster', tile: 0.7, rough: 0.95, metal: 0, env: 0.3 };
      /* The east vertical fins. Thin members, so a small tile: box-projected
         UVs give a 40 mm-wide fin a near-constant u, which makes it display one
         entire copy of the texture down its face — any low-frequency blob in
         the map then lands on the screen as a metre-wide stain. Low grime too;
         a vertical fin sheds rather than collects. Colour is left exactly as
         the palette has it. */
      case 'fin': case 'fin2':
        return { tex: 'plaster', tile: 1.5, rough: 0.88, metal: 0, env: 0.55, grime: 0.35 };
      // Handled by their own branches in the re-skin loop, but named here so
      // they do not register as unmapped and make the coverage report lie.
      case 'glass': case 'carGlass':  return { handledElsewhere: true };
      case 'lamp': case 'downlight':  return { handledElsewhere: true };
      case 'dark':       return { rough: 0.55, metal: 0.1, env: 0.4 };

      /* ---- interior surfaces ----------------------------------------------
         The elevation study this pipeline came from had no interiors, so none
         of the following had a case and all 22 fell through to `default`,
         landing in UNMAPPED and taking a generic plaster kit. They are
         `interior: true` so they pick up the warm indoor IBL rather than
         reflecting open sky, which is the single biggest indoor realism tell. */
      // Vitrified floor tiles, one tone per room type. Polished but not mirrors:
      // a domestic floor returns the room, not the window.
      case 'tLiving': case 'tBed': case 'tKitch': case 'tOffice': case 'tWalk':
        return { tex: 'tile', tile: 0.9, rough: 0.30, metal: 0, env: 0.58, reflect: 0.26, interior: true };
      case 'tBath': case 'tUtil':
        return { tex: 'tile', tile: 0.6, rough: 0.26, metal: 0, env: 0.62, reflect: 0.30, interior: true };
      case 'tCirc':
        return { tex: 'tile', tile: 1.0, rough: 0.30, metal: 0, env: 0.58, reflect: 0.26, interior: true };
      case 'tPooja':
        return { tex: 'tile', tile: 0.8, rough: 0.34, metal: 0, env: 0.58, reflect: 0.26, interior: true };
      // Soft goods — no reflection, no gloss, and a cloth weave rather than plaster
      case 'mattress': case 'pillow': case 'bedding':
        return { tex: 'plaster', tile: 0.35, rough: 0.97, metal: 0, env: 0.22, interior: true };
      // Worktops: stone. `counter` is the cabinet body, `counterTop` the slab.
      case 'counter':
        return { tex: 'stone', tile: 1.1, rough: 0.55, metal: 0, env: 0.45, interior: true };
      case 'counterTop':
        return { tex: 'stone', tile: 0.7, rough: 0.22, metal: 0, env: 0.70, reflect: 0.30, interior: true };
      // A switched-off panel is the darkest, glossiest thing in any room
      case 'tv':
        return { rough: 0.09, metal: 0.05, env: 0.9, reflect: 0.55, interior: true };
      // Pooja: cast brass murtis, stone/painted figures, and matte pigments
      case 'murtiGold':
        return { tex: 'metal', tile: 0.25, rough: 0.30, metal: 0.82, env: 1.0, reflect: 0.40, interior: true };
      case 'murtiDark': case 'murtiBlue':
        return { tex: 'stone', tile: 0.3, rough: 0.52, metal: 0.10, env: 0.5, interior: true };
      case 'saffron': case 'vermilion': case 'lotusPink': case 'peetaRed':
        return { rough: 0.92, metal: 0, env: 0.25, interior: true };
      default:
        // Anything reaching here is an untextured surface. Recorded so coverage
        // can be asserted rather than assumed — see the report below.
        UNMAPPED[name] = (UNMAPPED[name] || 0) + 1;
        return { tex: 'plaster', tile: 2.4, rough: 0.85, metal: 0, env: 0.5 };
    }
  }

  /* ---- palette: white + a grey scale, nothing warm ----------------------
     Every warm note is gone. The lime-white now reads as white, the greige
     becomes a true neutral light grey, and the timber doors become dark grey
     like the rest of the metalwork. A monochrome scheme cannot clash with
     itself — the only job left is spacing the values evenly, which is what
     makes it read as designed rather than as beige.

     Value ladder, lightest to darkest:
       white2 / white   body plaster, soffits, reveals   — bright
       fin / fin2       east screen                       — bright
       copingLight      wall copings                      — light
       eastPlaster      east face                         — light grey, TEXTURED
       sand / stone     secondary planes                  — light grey
       plinth           base course                       — mid grey
       charDark         slab fascias, soffits             — grey
       charcoal         compound wall, site masonry       — deeper grey
       walnut / woodD   doors                             — dark grey
       steel            balustrades, gate                 — anthracite
       ms               grilles, railings                 — graphite
       frame            window frames                     — near-black          */
  const COL = {
    white:      0xf7f6f4,   // brighter — it should read as white, not cream
    white2:     0xfbfaf9,
    fin:        0xf1f0ee,
    fin2:       0xf7f6f5,
    // East face: a light NEUTRAL grey, half a step off the body, so the
    // sand-float has something to sit on and the plane reads as its own.
    eastPlaster:0xd9dad9,
    sand:       0xd6d7d6,
    stone:      0xd4d5d4,
    copingLight:0xe9eae9,
    tank:       0xe9eaea,
    plinth:     0x9fa1a1,
    charDark:   0x76797a,   // slab fascias + soffits
    charcoal:   0x6a6d6e,   // compound wall + site masonry
    /* Doors in timber. 'walnut' is the door leaf and 'woodD' its mouldings
       and frames, so both are wood; 'woodF' is balcony furniture, kept in the
       same family. The grain map is neutral now, so these colours land true
       instead of the muddy grey-brown a warm map would have given.
       One warm accent against white walls and graphite metal — which is the
       classic reason it works, and the only warmth left in the scheme. */
    walnut:     0x8a5c31,   // GF / FF / terrace door leaves — teak
    woodD:      0x6b4524,   // door mouldings, frames, furniture edges
    woodF:      0x9a6e40,   // balcony furniture tops
    skirt:      0x4a4e51,   // skirting stays grey — it is not joinery
    // and the brass line becomes a satin grey, so nothing gold remains
    brass:      0x8d9295,
    accentWarm: 0x93989b,
    ms:         0x3c4043,
    frame:      0x26292c,
    steel:      0x44484c,
    chrome:     0x9aa1a7,
    solarFrm:   0x4a4640,

    ground:  0x9c9078, plotPad: 0xa3977d, soil: 0x5d4b34,
    grass:   0x66794a, road: 0x494b4f,
    leafDark: 0x34492a, leafLight: 0x5d7838,
    green: 0x4a5f34, green2: 0x5a7239,
    boug: 0xa8496f, ixora: 0xbc5c33, flowerPink: 0xc06a86
  };

  const hex2name = {};
  for (const k in C) { if (!(C[k] in hex2name)) hex2name[C[k]] = k; }

  function boxUV(geo, tile) {
    const p = geo.attributes.position, n = geo.attributes.normal;
    if (!p || !n) return;
    const uv = new Float32Array(p.count * 2), inv = 1 / tile;
    for (let i = 0; i < p.count; i++) {
      const px = p.getX(i), py = p.getY(i), pz = p.getZ(i);
      const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
      let u, v;
      if (ay >= ax && ay >= az) { u = px; v = pz; }
      else if (ax >= az) { u = pz; v = py; }
      else { u = px; v = py; }
      uv[2 * i] = u * inv; uv[2 * i + 1] = v * inv;
    }
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  }

  /* ==========================================================================
     3 · SKY, IBL, SUN
     ========================================================================== */
  /* Anantapur: 14°N, semi-arid, ~300 clear days a year. The sky is a pale
     hazy blue rather than an alpine one, there is dust in the air, and the
     ground is dry ochre — so warm bounce reaches every shaded face. That bounce
     is the climate signature and it is present in all three presets.

     The three now differ mainly in SUN ANGLE, which is what actually changes a
     facade. Hue moves only a little. The previous set swung the whole sky from
     blue (0x87b2da) to grey-lavender (0x9fa2b6) and the haze from cold to
     orange, so they read as three different colour schemes rather than one
     house at three hours of the same day. */
  const SUNS = {
    morning: {                                    // ~9 am, low ESE
      dir: [0.83, 0.39, 0.22], sunC: 0xfff0d8, sunI: 2.30,
      hemiSky: 0xc3d4e4, hemiGnd: 0xd0a878, hemiI: 0.34,
      skyTop: 0x3a72b4, skyMid: 0x9dc0dd, skyBot: 0xe8ddc8,
      fog: 0xd6dbd8, exp: 0.96, fillC: 0xdcc9a8, fillI: 0.17,
      envHz: '#e9e2d0', envGnd: '#b18f61'
    },
    midday: {                                     // high sun, bleached and flat
      dir: [0.30, 0.90, 0.24], sunC: 0xfff8ec, sunI: 2.55,
      hemiSky: 0xbed0e4, hemiGnd: 0xcda875, hemiI: 0.38,
      skyTop: 0x3570b0, skyMid: 0xa2c4e0, skyBot: 0xe4dcc9,
      fog: 0xd4dad9, exp: 0.91, fillC: 0xdac9ac, fillI: 0.16,
      envHz: '#e7e0ce', envGnd: '#b2926a'
    },
    golden: {                                     // ~5 pm, raking, warm not orange
      dir: [0.88, 0.235, 0.20], sunC: 0xffdcae, sunI: 2.20,
      hemiSky: 0xc8cbd4, hemiGnd: 0xc89a68, hemiI: 0.30,
      skyTop: 0x3a6ba2, skyMid: 0xb9bfcb, skyBot: 0xf0cfa4,
      fog: 0xe2cfb4, exp: 0.99, fillC: 0xd0b490, fillI: 0.15,
      envHz: '#f0dcbc', envGnd: '#a07f56'
    }
  };
  let sunKey = 'morning';

  /* Render-pipeline state. Declared here, well above its own section, because
     `resize()` and `applySun()` both read it and both run during boot — a
     `const` further down leaves them reaching into its temporal dead zone,
     which throws rather than reading undefined. buildPipeline() fills in the
     rest of the fields further down. */
  const POST = { on: false, lite: false, exposure: SUNS.morning.exp, render: null,
                 samples: 0, max: 1, moving: false, movingUntil: 0 };
  let accumDirty = true;
  function resetAccum() { accumDirty = true; POST.samples = 0; }
  const SUN_DIR = new THREE.Vector3().fromArray(SUNS.morning.dir).normalize();

  function cloudNoiseCanvas(size) {
    const c = cv(size), x = c.getContext('2d');
    x.fillStyle = '#828282'; x.fillRect(0, 0, size, size);
    for (let i = 0; i < 1100; i++) {
      const r = 5 + Math.pow(Math.random(), 2.2) * 72;
      const px = Math.random() * size, py = Math.random() * size;
      const bright = Math.random() > 0.44;
      const a = 0.05 + Math.random() * 0.13;
      for (const ox of [0, -size, size]) for (const oy of [0, -size, size]) {
        if ((ox && Math.abs(px + ox - size / 2) > size / 2 + r) ||
            (oy && Math.abs(py + oy - size / 2) > size / 2 + r)) continue;
        const g = x.createRadialGradient(px + ox, py + oy, 0, px + ox, py + oy, r);
        g.addColorStop(0, (bright ? 'rgba(255,255,255,' : 'rgba(18,18,18,') + a.toFixed(3) + ')');
        g.addColorStop(1, 'rgba(128,128,128,0)');
        x.fillStyle = g; x.fillRect(px + ox - r, py + oy - r, r * 2, r * 2);
      }
    }
    return c;
  }
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      top: { value: new THREE.Color(SUNS.morning.skyTop) },
      mid: { value: new THREE.Color(SUNS.morning.skyMid) },
      bot: { value: new THREE.Color(SUNS.morning.skyBot) },
      sunDir: { value: SUN_DIR.clone() },
      sunTint: { value: new THREE.Color(0xffeecf) },
      skyGain: { value: 1.15 },
      tNoise: { value: asTex(cloudNoiseCanvas(512), false) }
    },
    vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `
      varying vec3 vDir;
      uniform vec3 top; uniform vec3 mid; uniform vec3 bot; uniform vec3 sunDir; uniform vec3 sunTint;
      uniform float skyGain;
      uniform sampler2D tNoise;
      /* Every colour reaching this shader is LINEAR radiance, converted on the
         JS side. A raw ShaderMaterial is not touched by three's tone mapping or
         output encoding, so writing sRGB-valued numbers here used to look right
         on a direct-to-canvas render purely by accident — the canvas
         reinterpreted them as sRGB. Feed the same numbers into an HDR buffer
         that a real tone map then reads as radiance and the sky blows out to a
         white wash. */
      void main(){
        vec3 d = normalize(vDir);
        float h = clamp(d.y, -1.0, 1.0);
        vec3 col = h > 0.0 ? mix(mid, top, pow(h, 0.52)) : mix(mid, bot, pow(-h, 0.5));
        // Horizon haze — widened and strengthened to meet the scene fog the
        // distant ground now fades into, so the two arrive at the same colour
        // from opposite sides of the horizon instead of butting up against it.
        float haze = pow(1.0 - abs(h), 4.5);
        col = mix(col, vec3(0.86, 0.88, 0.88), haze * 0.30);
        float s = max(dot(d, normalize(sunDir)), 0.0);
        if (h > 0.012) {
          vec2 uv = d.xz / (d.y + 0.34);
          float n1 = texture2D(tNoise, uv * 0.30 + vec2(0.13, 0.40)).r;
          float n2 = texture2D(tNoise, uv * 0.84 + vec2(0.55, 0.10)).r;
          float n3 = texture2D(tNoise, uv * 2.20 + vec2(0.31, 0.77)).r;
          float n = n1 * 0.58 + n2 * 0.29 + n3 * 0.13;
          float cov = smoothstep(0.505, 0.655, n);
          float fade = smoothstep(0.055, 0.30, h);
          float dense = smoothstep(0.58, 0.78, n);
          vec3 cloudCol = mix(vec3(1.35, 1.34, 1.30), vec3(0.66, 0.68, 0.75), dense * 0.9);
          cloudCol += sunTint * pow(s, 3.0) * 0.45;
          col = mix(col, cloudCol, cov * fade * 0.88);
        }
        col *= skyGain;
        col += sunTint * pow(s, 1400.0) * 26.0;               // sun disc
        col += sunTint * pow(s, 6.0) * 0.28;                  // forward glare
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  const skyDome = new THREE.Mesh(new THREE.SphereGeometry(1000, 48, 24), skyMat);
  skyDome.frustumCulled = false;
  scene.add(skyDome);

  // fromEquirectangular is the robust path — pmrem.fromScene() over a custom
  // ShaderMaterial sky yields a malformed env map that NaNs every PBR surface.
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  let envRT = null;
  function buildEnv(S) {
    const w = HI ? 1024 : (TIER === 'medium' ? 512 : 256), h = w >> 1;
    const c = cv(w, h), x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, h);
    const hex = (n) => '#' + ('000000' + n.toString(16)).slice(-6);
    g.addColorStop(0.00, hex(S.skyTop));
    g.addColorStop(0.40, hex(S.skyMid));
    g.addColorStop(0.50, S.envHz);
    g.addColorStop(0.52, S.envGnd);
    g.addColorStop(1.00, S.envGnd);
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 18; i++) {
      const cx = Math.random() * w, cy = h * (0.12 + Math.random() * 0.28);
      const cg = x.createRadialGradient(cx, cy, 0, cx, cy, 26 + Math.random() * 54);
      cg.addColorStop(0, 'rgba(255,253,248,0.55)'); cg.addColorStop(1, 'rgba(255,253,248,0)');
      x.fillStyle = cg; x.fillRect(0, 0, w, h);
    }
    const d = new THREE.Vector3().fromArray(S.dir).normalize();
    const az = Math.atan2(d.x, d.z), el = Math.asin(d.y);
    const sx = (az / (Math.PI * 2) + 0.5) * w, sy = (0.5 - el / Math.PI) * h;
    const sg = x.createRadialGradient(sx, sy, 0, sx, sy, w * 0.11);
    sg.addColorStop(0, 'rgba(255,248,228,1)'); sg.addColorStop(1, 'rgba(255,248,228,0)');
    x.fillStyle = sg; x.fillRect(0, 0, w, h);
    const eq = new THREE.CanvasTexture(c);
    eq.mapping = THREE.EquirectangularReflectionMapping;
    if ('colorSpace' in eq && THREE.SRGBColorSpace) eq.colorSpace = THREE.SRGBColorSpace; else eq.encoding = THREE.sRGBEncoding;
    const rt = pmrem.fromEquirectangular(eq);
    eq.dispose();
    if (envRT) envRT.dispose();
    envRT = rt;
    scene.environment = rt.texture;
    buildInteriorEnv(S);
  }

  /* Second IBL, for surfaces that cannot see the sky.
     This pipeline was written for an exterior-only model, so every glossy
     surface reflected the sky dome. Indoors that is wrong and very visible: a
     polished floor tile or a granite worktop three rooms deep would mirror open
     blue, which reads as plastic more than any other single error. Interior
     treatments get this instead — the room's own bounce, warm and low-contrast,
     tinted by the sun preset so the two IBLs stay in the same light. */
  let intRT = null;
  function buildInteriorEnv(S) {
    const w = HI ? 256 : 128, h = w >> 1;
    const c = cv(w, h), x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, h);
    // ceiling bounce above, wall tone at the horizon, floor bounce below
    g.addColorStop(0.00, '#efe9dd');
    g.addColorStop(0.45, '#ddd4c4');
    g.addColorStop(0.55, '#c7bda9');
    g.addColorStop(1.00, '#9d947f');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    // a soft window-shaped patch so reflections have somewhere bright to land
    const wg = x.createRadialGradient(w * 0.72, h * 0.38, 0, w * 0.72, h * 0.38, w * 0.16);
    const sk = '#' + ('000000' + S.skyMid.toString(16)).slice(-6);
    wg.addColorStop(0, sk); wg.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = wg; x.fillRect(0, 0, w, h);
    const eq = new THREE.CanvasTexture(c);
    eq.mapping = THREE.EquirectangularReflectionMapping;
    if ('colorSpace' in eq && THREE.SRGBColorSpace) eq.colorSpace = THREE.SRGBColorSpace; else eq.encoding = THREE.sRGBEncoding;
    const rt = pmrem.fromEquirectangular(eq);
    eq.dispose();
    if (intRT) intRT.dispose();
    intRT = rt;
    INTERIOR_MATS.forEach(m => { m.envMap = rt.texture; m.needsUpdate = true; });
  }
  const INTERIOR_MATS = [];

  const hemi = new THREE.HemisphereLight(SUNS.morning.hemiSky, SUNS.morning.hemiGnd, SUNS.morning.hemiI);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(SUNS.morning.sunC, SUNS.morning.sunI);
  sun.castShadow = Q.shadows !== false;
  const SHMAP = Math.min(MAXTEX, HI ? 4096 : (Q.shadowMap || 2048));
  sun.shadow.mapSize.set(SHMAP, SHMAP);
  const shc = sun.shadow.camera;
  shc.left = -42; shc.right = 42; shc.top = 42; shc.bottom = -42; shc.near = 20; shc.far = 210;
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.035;
  const sunTarget = new THREE.Object3D();
  sunTarget.position.set(8.3, 4.0, -4.4);
  scene.add(sunTarget); sun.target = sunTarget; scene.add(sun);
  const fill = new THREE.DirectionalLight(SUNS.morning.fillC, SUNS.morning.fillI);
  fill.position.set(-50, 34, -26);
  scene.add(fill);

  /* Aerial perspective. The far-ground disc ends at r = 900 m and the sky dome
     is at 1000 m, so with the old 250–1100 range the ground still had a
     quarter of its own colour left where it ran out — a hard brown line ruled
     across the bottom of the sky, which is the one thing that gave away that
     the landscape is a disc on a table. Ending the fog inside the disc's own
     radius means the field reaches the sky colour before it reaches its edge,
     and the horizon becomes a haze band instead of a seam. Nothing on the plot
     is anywhere near 150 m, so the building is untouched. */
  scene.fog = new THREE.Fog(SUNS.morning.fog, 150, 780);
  scene.background = new THREE.Color(SUNS.morning.fog);

  const SKY_UP = new THREE.Color(), SKY_DN = new THREE.Color();
  function applySun(key) {
    const S = SUNS[key] || SUNS.morning;
    sunKey = key;
    SUN_DIR.fromArray(S.dir).normalize();
    sun.position.copy(SUN_DIR).multiplyScalar(110).add(sunTarget.position);
    sun.color.setHex(S.sunC); sun.intensity = S.sunI;
    hemi.color.setHex(S.hemiSky); hemi.groundColor.setHex(S.hemiGnd); hemi.intensity = S.hemiI;
    fill.color.setHex(S.fillC); fill.intensity = S.fillI;
    // The sky dome, the fog colour and the clear colour all feed a linear HDR
    // buffer when the pipeline is on, so they must be linear radiance. On the
    // fallback path they go straight to an sRGB canvas and must not be.
    const asLin = (hex) => POST.on ? new THREE.Color(hex).convertSRGBToLinear() : new THREE.Color(hex);
    skyMat.uniforms.top.value.copy(asLin(S.skyTop));
    skyMat.uniforms.mid.value.copy(asLin(S.skyMid));
    skyMat.uniforms.bot.value.copy(asLin(S.skyBot));
    skyMat.uniforms.sunDir.value.copy(SUN_DIR);
    skyMat.uniforms.sunTint.value.copy(asLin(S.sunC));
    skyMat.uniforms.skyGain.value = POST.on ? 1.15 : 1.0;
    scene.fog.color.copy(asLin(S.fog));
    scene.background.copy(asLin(S.fog));
    SKY_UP.setHex(S.skyMid).convertSRGBToLinear();
    SKY_DN.set(S.envGnd).convertSRGBToLinear();
    POST.exposure = S.exp;
    if (!POST.on) renderer.toneMappingExposure = S.exp;
    buildEnv(S);
    if (Q.shadows !== false) renderer.shadowMap.needsUpdate = true;
    document.querySelectorAll('#sun button').forEach(b => {
      b.classList.toggle('on', b.getAttribute('data-sun') === key);
      b.setAttribute('aria-pressed', b.getAttribute('data-sun') === key);
    });
    resetAccum();
  }

  /* ---------- house ---------- */
  const data = window.HouseScene.build(THREE);
  scene.add(data.root);

  /* ==========================================================================
     4 · RE-SKIN
     The donor pipeline built the scene here; this viewer already did so above,
     and owns group visibility through setView(). Only the re-skin is kept.
     ========================================================================== */

  /* Grime. Water runs down a wall, collects dirt, and leaves it where the wall
     meets the ground and under every horizontal that sheds. No real building is
     the same tone top to bottom, and a uniform one is the single most reliable
     "this is CG" signal on a plaster facade. Patched into the standard shader
     so it works off true world position rather than baked UVs. */
  function addGrime(m, amount) {
    m.onBeforeCompile = (sh) => {
      sh.uniforms.uGrime = { value: amount };
      sh.vertexShader = 'varying vec3 vWP_;\nvarying vec3 vWN_;\n' + sh.vertexShader.replace(
        '#include <begin_vertex>',
        '#include <begin_vertex>\n  vWP_ = (modelMatrix * vec4(transformed, 1.0)).xyz;\n  vWN_ = normalize(mat3(modelMatrix) * objectNormal);'
      );
      sh.fragmentShader = 'varying vec3 vWP_;\nvarying vec3 vWN_;\nuniform float uGrime;\n' + sh.fragmentShader.replace(
        '#include <map_fragment>',
        `#include <map_fragment>
         {
           float vert = 1.0 - abs(vWN_.y);                       // walls, not slabs
           float splash = exp(-max(vWP_.y - 0.05, 0.0) * 4.5);   // rain splash-back
           float base   = exp(-max(vWP_.y - 0.05, 0.0) * 1.1) * 0.45;
           float g = (splash * 0.85 + base) * vert * uGrime;
           // horizontal dust ledges: dirt sits on top of every up-facing plane
           float ledge = max(vWN_.y, 0.0) * 0.10 * uGrime;
           diffuseColor.rgb *= (1.0 - clamp(g, 0.0, 0.42));
           diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * vec3(0.94, 0.92, 0.86), clamp(ledge, 0.0, 0.3));
         }`
      );
    };
    m.customProgramCacheKey = () => 'grime' + amount.toFixed(2);
  }

  /* ---- coincident-plane ordering -------------------------------------
     A geometry audit of this model finds ~250 places where two DIFFERENT
     materials put an up-facing (or camera-facing) plane on exactly the same
     coordinate: a floor finish laid on the slab it covers, a coping on the
     wall it caps, a door frame flush with its reveal, skirting against the
     plaster. Every one of them is a coin toss at render time — with equal
     depth values the winner is whichever mesh the sort happens to draw last,
     and that order changes as the camera moves. The result is surfaces that
     swap material mid-orbit and speckle along the triangle seams.

     Fixing 250 coincidences one at a time in the procedural builder is neither
     safe nor necessary, because they all share a structure: one of the pair is
     the thing that was built, the other is the thing that was applied to it,
     and the applied one is always what you should see. So say so once, here —
     the same technique already used to separate the exterior shell from the
     per-floor copies of the same wall, one level finer.

     Layer 1 = a finish laid on structure. Layer 2 = joinery, trim and hardware
     fixed to a finish. The offset is a fraction of a depth unit, far too small
     to move anything visibly, and it is deterministic — which is the whole
     point. */
  const DEPTH_LAYER = {
    terraceF: 1, balcTile: 1, tOut: 1, pave: 1, paver: 1, paver2: 1, roadLine: 1,
    tLiving: 1, tBed: 1, tBath: 1, tKitch: 1, tUtil: 1, tCirc: 1, tOffice: 1,
    tPooja: 1, tWalk: 1, copingLight: 1, plinth: 1, soil: 1, grass: 1, rug: 1,
    skirt: 2, woodD: 2, walnut: 2, woodF: 2, frame: 2, ms: 2, steel: 2,
    brass: 2, chrome: 2, accentWarm: 2, liftSteel: 2, liftDoor: 2, liftChrome: 2,
    counterTop: 2, tv: 2, solar: 2, solarFrm: 2
  };
  const DEPTH_STEP = 0.9;
  /* Within a tier, two different materials still land on the same offset and
     the tie is back. Break it with a stable hash of the key: an extra 0 – 0.6
     of a depth unit, always the same value for the same material name, and
     always less than one tier step so the ordering above still wins. Which of
     two same-tier materials ends up in front is arbitrary — but it is the same
     arbitrary answer from every camera angle on every device, and that is the
     entire problem being solved here. A stable wrong answer is invisible; an
     unstable right one flickers. */
  function depthOffset(key) {
    const layer = DEPTH_LAYER[key] || 0;
    let h = 0;
    for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) % 997;
    return -(DEPTH_STEP * layer + (h / 997) * 0.6);
  }

  say('APPLYING PBR MATERIALS');
  const REFLECTIVE = [];                     // meshes worth tracing reflections for
  const doneMat = new Set();
  const COVERAGE = {};
  /* V19's garden is real 3D geometry that already carries its own photographic
     leaf cards, hedge and grass-blade textures, built in houseScene from the
     owner's own plant photos. Re-skinning it here would overwrite all of that
     with generic procedural foliage, so it is left alone — it still gets a
     normal-buffer material below, so GI, SSR and the edge pass all see it. */
  const gardenGroup = data.root.getObjectByName('garden');
  const inGarden = (o) => {
    for (let p = o; p; p = p.parent) if (p === gardenGroup) return true;
    return false;
  };

  data.root.traverse(o => {
    if (!o.isMesh || !o.material) return;
    const key = o.userData.matKey || hex2name[o.material.color ? o.material.color.getHex() : -1] || '';
    COVERAGE[key] = (COVERAGE[key] || 0) + 1;
    if (inGarden(o)) {
      o.castShadow = true; o.receiveShadow = true;
      o.userData.reflect = 0;
      return;
    }
    const t = treatment(key);
    const m = o.material;

    if (!doneMat.has(m)) {
      doneMat.add(m);
      m.userData.name = key;
      if (key === 'glass' || key === 'carGlass') {
        /* depthWrite stays ON for glazing. Every screen-space pass pairs the
           depth texture with the normal buffer, and with depth writing off the
           two disagreed at exactly the pixels that matter most: the normal
           buffer held the pane (reflectivity 0.9) while the depth buffer held
           the wall behind it, so SSR traced its mirror ray from a point that
           was up to a room's depth away from the surface it was reflecting
           off. Windows returned a smeared copy of the wrong part of the scene.
           These are single sheets of glazing that never intersect each other,
           so back-to-front sorting keeps the blend correct with depth on. */
        m.transparent = true; m.depthWrite = true;
        m.roughness = 0.045; m.metalness = 0.0;
        m.envMapIntensity = 1.6;
        if (key === 'carGlass') { m.color.setHex(0x171b1f); m.opacity = 0.86; }
        else { m.color.setHex(0x1e262c); m.opacity = 0.72; }
      } else if (key === 'lamp' || key === 'downlight') {
        if (m.emissive) m.emissive.setHex(0xffdcae);
        m.emissiveIntensity = 2.2; m.envMapIntensity = 0.2;
      } else {
        if ('roughness' in m) m.roughness = t.rough;
        if ('metalness' in m) m.metalness = t.metal || 0;
        m.envMapIntensity = t.env != null ? t.env : 0.5;
        if (COL[key] != null && m.color) m.color.copy(new THREE.Color(COL[key]).convertSRGBToLinear());
        /* Highlight shoulder, not a full-range squeeze.

           The old curve (0.035 + 0.76c) pulled the lime-white down 20 % — which
           it should, 0.87 linear is brighter than snow — but it also LIFTED the
           window frames by 16 %, because the +0.035 floor does proportionally
           most to the darkest values. It compressed the picture from both ends
           at once and took wall-to-railing contrast from 3.4:1 to 3.0:1.

           A shoulder only touches the top. Whites land where they should and
           every dark stays exactly as dark as the palette intended. */
        if (m.color) {
          const sh = (v) => v <= 0.45 ? v : 0.45 + (v - 0.45) * 0.58;
          m.color.r = sh(m.color.r);
          m.color.g = sh(m.color.g);
          m.color.b = sh(m.color.b);
        }
        m.bumpMap = null; m.bumpScale = 1;      // houseScene ships its own; it fights the normalMap
        if (t.tex && TEX[t.tex]) {
          const kit = TEX[t.tex]();
          m.map = kit.map;
          if (kit.normalMap) { m.normalMap = kit.normalMap; m.normalScale = new THREE.Vector2(kit.ns, kit.ns); }
          /* `matte` treatments keep their literal roughness. The kits are
             shared across surfaces that are made of the same STUFF but not
             finished the same way — the same vitrified-tile kit dresses a
             polished living-room floor and an anti-skid roof terrace — and the
             kit's roughness map encodes the polished one. Taking it wholesale
             is what turned the terrace into a mirror. */
          if (kit.roughnessMap && !t.matte) { m.roughnessMap = kit.roughnessMap; m.roughness = 1.0; }
          if (t.cutout && kit.alphaMap) { m.alphaMap = kit.alphaMap; m.alphaTest = t.cutout; }
        }
        if (t.twoSided) m.side = THREE.DoubleSide;
        if (t.grime) addGrime(m, t.grime);
        if (key) {
          m.polygonOffset = true;
          m.polygonOffsetFactor = m.polygonOffsetUnits = depthOffset(key);
        }
        // Indoor surfaces reflect the room, not the sky (see buildInteriorEnv)
        if (t.interior) {
          INTERIOR_MATS.push(m);
          if (intRT) m.envMap = intRT.texture;
        }
      }
      m.needsUpdate = true;
    }

    if (t.tex) boxUV(o.geometry, t.tile);

    const isGlass = key === 'glass' || key === 'carGlass';
    o.castShadow = !(isGlass || key === 'ground' || key === 'plotPad' || key === 'road' || key === 'roadLine');
    o.receiveShadow = !isGlass;
    o.userData.reflect = isGlass ? 0.9 : (t.reflect || 0);
    if (o.userData.reflect > 0.05) REFLECTIVE.push(o);
  });

  /* Coverage report. "Every surface is textured" is a claim worth checking
     rather than asserting, so every palette key that appears in the geometry is
     counted and every key that fell through to the default branch is named. */
  const MATERIAL_COVERAGE = {
    keysInScene: Object.keys(COVERAGE).sort(),
    unmapped: Object.keys(UNMAPPED),
    gardenSkipped: !!gardenGroup
  };
  if (MATERIAL_COVERAGE.unmapped.length) {
    console.warn('[coverage] surfaces with no explicit treatment:', MATERIAL_COVERAGE.unmapped);
  } else {
    console.info('[coverage] all ' + MATERIAL_COVERAGE.keysInScene.length + ' surface types explicitly textured');
  }

  /* Dual representation: every shell wall exists twice — once in the exterior
     shell and once in the floor group that shares its plane. That is by design
     (a floor view needs its own walls), and the two are coincident, so on a
     floor view they z-fight along every wall. The floor groups render very
     slightly in front. Exterior view is unaffected: the floor groups are hidden.

     makeBag hands the SAME material instance to every group, so this has to
     clone — setting polygonOffset in place would push the exterior forward
     against itself too. One clone per material key per floor group, which is
     what walkthrough.html does for the same reason. */
  data.floors.forEach(f => {
    const clones = new Map();
    f.group.traverse(o => {
      if (!o.isMesh || !o.material) return;
      const key = o.userData.matKey || o.material.uuid;
      let c = clones.get(key);
      if (!c) {
        c = o.material.clone();
        /* Stack on top of whatever coincident-plane layer the material already
           carries (see DEPTH_LAYER) rather than overwriting it — the floor
           copy has to beat the exterior shell AND keep its finish above its
           own structure. Replacing the value flattened the second ordering. */
        const base = c.polygonOffset ? c.polygonOffsetFactor : 0;
        c.polygonOffset = true;
        c.polygonOffsetFactor = base - 1.2;
        c.polygonOffsetUnits = base - 1.2;
        clones.set(key, c);
      }
      o.material = c;
    });
  });

  /* ==========================================================================
     5 · SURROUNDINGS, FOLIAGE FUZZ, SERVICES
     ========================================================================== */
  let seed = 20260814;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;

  /* The site ground box is 230 m and its edge shows against the sky from any
     drone-height camera, which reads as a diorama on a table. A field plane out
     past the fog distance gives a real ground-to-sky horizon.

     No trees, foliage cards or services are added here: V19 builds its own 3D
     garden (trunks, canopy volumes, hedge, grass tufts) and adding a second set
     would double it up. Nothing in this file adds an element to the design. */
  (function farGround() {
    const m = new THREE.MeshStandardMaterial({
      color: new THREE.Color(COL.ground).convertSRGBToLinear().multiplyScalar(0.76).addScalar(0.035),
      roughness: 1.0, metalness: 0.0, envMapIntensity: 0.28, map: TEX.field().map,
      polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2
    });
    const g = new THREE.CircleGeometry(900, 64);
    g.rotateX(-Math.PI / 2);
    // world-space UVs, matching how boxUV maps the site ground box — a
    // local-space mapping offsets the field pattern and the join shows as a
    // straight line ruled across the landscape
    const uv = g.attributes.uv, pos = g.attributes.position;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, (pos.getX(i) + 10.5) / 46, (pos.getZ(i) - 9.0) / 46);
    const mesh = new THREE.Mesh(g, m);
    mesh.position.set(10.5, 0.0, -9.0);
    mesh.receiveShadow = false; mesh.castShadow = false; mesh.frustumCulled = false;
    scene.add(mesh);
  })();

  const FLOOR_NAMES = ['GROUND', 'FIRST', 'SECOND'];
  const VIEW_KEYS = ['exterior', 'floor0', 'floor1', 'floor2'];

  /* room highlight planes + label elements */
  const labelsLayer = $('labels');
  const hlMat = new THREE.MeshBasicMaterial({ color: 0xc9a36a, transparent: true, opacity: 0.33, depthWrite: false });
  const floorsUI = data.floors.map((f, fi) => {
    const rooms = f.rooms.map(r => {
      const w = (r.x1 - r.x0) / 1000, d = (r.y1 - r.y0) / 1000;
      const hl = new THREE.Mesh(new THREE.PlaneGeometry(w, d), hlMat);
      hl.rotation.x = -Math.PI / 2;
      hl.position.set((r.x0 + r.x1) / 2000, f.floorY + 0.02, -(r.y0 + r.y1) / 2000);
      hl.visible = false; hl.renderOrder = 3;
      f.group.add(hl);
      const el = document.createElement('div');
      el.className = 'rlabel';
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      el.innerHTML = '<span class="rn">' + r.name + '</span>';
      el.style.display = 'none';
      labelsLayer.appendChild(el);
      const room = { r, hl, el, fi, cx: (r.x0 + r.x1) / 2000, cz: -(r.y0 + r.y1) / 2000 };
      el.addEventListener('click', e => { e.stopPropagation(); selectRoom(room, false); });
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); selectRoom(room, false); }
      });
      return room;
    });
    return { rooms, group: f.group, floorY: f.floorY };
  });

  /* ---------- camera controls (custom orbit) ---------- */
  const ctl = {
    target: new THREE.Vector3(), tTarget: new THREE.Vector3(),
    theta: 0, phi: 1.1, radius: 30,
    tTheta: 0, tPhi: 1.1, tRadius: 30,
    interacted: false
  };
  /* Pre-allocated Vector3 temporaries for zero-GC path */
  const _tmpP = new THREE.Vector3(), _tmpT = new THREE.Vector3(), _tmpOff = new THREE.Vector3();
  const _right = new THREE.Vector3(), _up = new THREE.Vector3();

  function setFromView(v, snap) {
    _tmpP.set(v.pos[0], v.pos[1], v.pos[2]);
    _tmpT.set(v.target[0], v.target[1], v.target[2]);
    _tmpOff.copy(_tmpP).sub(_tmpT);
    const r = _tmpOff.length();
    const phi = Math.acos(clamp(_tmpOff.y / r, -1, 1));
    const theta = Math.atan2(_tmpOff.x, _tmpOff.z);
    ctl.tTarget.copy(_tmpT); ctl.tRadius = r; ctl.tPhi = phi; ctl.tTheta = theta;
    if (snap) { ctl.target.copy(_tmpT); ctl.radius = r; ctl.phi = phi; ctl.theta = theta; }
  }
  function applyCamera() {
    const sp = Math.sin(ctl.phi), cp = Math.cos(ctl.phi);
    camera.position.set(
      ctl.target.x + ctl.radius * sp * Math.sin(ctl.theta),
      ctl.target.y + ctl.radius * cp,
      ctl.target.z + ctl.radius * sp * Math.cos(ctl.theta)
    );
    camera.lookAt(ctl.target);
  }

  /* tween between views */
  let tween = null;
  function flyTo(dest, dur) {
    const norm = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
    const from = {
      target: ctl.target.clone(), radius: ctl.radius, phi: ctl.phi, theta: ctl.theta
    };
    let dTheta = norm(dest.theta - ctl.theta);
    tween = {
      from, dest, dTheta, t0: performance.now(), dur: (dur || 1.15) * 1000
    };
  }
  function flyToView(v) {
    _tmpP.set(v.pos[0], v.pos[1], v.pos[2]);
    _tmpT.set(v.target[0], v.target[1], v.target[2]);
    _tmpOff.copy(_tmpP).sub(_tmpT);
    const r = _tmpOff.length();
    flyTo({
      target: _tmpT.clone(), radius: r,
      phi: Math.acos(clamp(_tmpOff.y / r, -1, 1)),
      theta: Math.atan2(_tmpOff.x, _tmpOff.z)
    });
  }

  /* pointer input — accumulate deltas so high-rate mice don't drop moves */
  const pointers = new Map();
  let lastPinch = 0, moved = 0, downAt = null;
  let ptrMoveQueued = false;
  let pendDx = 0, pendDy = 0, pendShift = false, pendBtn = 0;
  let pendPinch = 0, hasPendPinch = false;
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, button: e.button });
    ctl.interacted = true; tween = null; moved = 0; downAt = { x: e.clientX, y: e.clientY };
    autoRotateUntil = 0; // stop auto-rotate once the user takes control
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      lastPinch = Math.hypot(a.x - b.x, a.y - b.y);
    }
  });
  canvas.addEventListener('pointermove', e => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    pendDx += dx; pendDy += dy;
    pendShift = e.shiftKey; pendBtn = p.button;
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const pinch = Math.hypot(a.x - b.x, a.y - b.y);
      pendPinch = pinch; hasPendPinch = true;
    }
    if (ptrMoveQueued) return;
    ptrMoveQueued = true;
    requestAnimationFrame(() => {
      ptrMoveQueued = false;
      const adx = pendDx, ady = pendDy;
      pendDx = 0; pendDy = 0;
      if (pointers.size === 1) {
        if (pendBtn === 2 || pendShift) pan(adx, ady);
        else {
          ctl.tTheta -= adx * ORBIT_SENSITIVITY;
          ctl.tPhi = clamp(ctl.tPhi - ady * TILT_SENSITIVITY, MIN_PHI, MAX_PHI);
        }
      } else if (pointers.size === 2) {
        if (hasPendPinch) {
          if (lastPinch > 0) ctl.tRadius = clamp(ctl.tRadius * lastPinch / pendPinch, MIN_RADIUS, MAX_RADIUS);
          lastPinch = pendPinch;
          hasPendPinch = false;
        }
        pan(adx * 0.5, ady * 0.5);
      }
    });
  });
  const endPtr = e => {
    pointers.delete(e.pointerId);
    lastPinch = 0;
    if (downAt && moved < 6 && e.button !== 2) clearSelection();
    downAt = null;
  };
  canvas.addEventListener('pointerup', endPtr);
  canvas.addEventListener('pointercancel', endPtr);
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    ctl.interacted = true; tween = null;
    ctl.tRadius = clamp(ctl.tRadius * Math.exp(e.deltaY * SCROLL_SENSITIVITY), MIN_RADIUS, MAX_RADIUS);
  }, { passive: false });

  function pan(dx, dy) {
    const f = ctl.radius * PAN_FACTOR;
    const m = camera.matrix.elements;
    _right.set(m[0], m[1], m[2]);
    _up.set(m[4], m[5], m[6]);
    ctl.tTarget.addScaledVector(_right, -dx * f).addScaledVector(_up, dy * f);
    const b = data.bounds;
    ctl.tTarget.x = clamp(ctl.tTarget.x, b.minX, b.maxX);
    ctl.tTarget.z = clamp(ctl.tTarget.z, b.minZ, b.maxZ);
    ctl.tTarget.y = clamp(ctl.tTarget.y, 0, b.maxY);
  }

  /* ---------- view switching ---------- */
  let activeView = 'exterior';
  const ariaStatus = $('ariaStatus');
  function announce(msg) { ariaStatus.textContent = msg; }
  function setView(name, instant) {
    activeView = name;
    const fi = VIEW_KEYS.indexOf(name) - 1; // -1 for exterior
    // Exterior = full multi-storey shell + all outdoor decks.
    // Floor buttons = that floor's dollhouse rooms + matching outdoor amenity
    // (portico on G, east/north balconies on 1 & 2). Outdoor decks live in
    // separate outdoor0/1/2 groups so the shell can hide without losing them.
    const isExt = name === 'exterior';
    data.exterior.visible = isExt;
    data.floors.forEach((f, i) => {
      f.group.visible = isExt ? false : (i === fi);
    });
    if (data.outdoors) {
      data.outdoors.forEach((g, i) => {
        g.visible = isExt ? true : (i === fi);
      });
    }
    clearSelection();
    document.querySelectorAll('#views button').forEach(b => {
      b.classList.toggle('on', b.dataset.view === name);
      b.setAttribute('aria-pressed', b.dataset.view === name);
    });
    buildPanel(fi);
    labelsLayer.style.display = fi >= 0 ? 'block' : 'none';
    if (instant) setFromView(data.views[name], true);
    else flyToView(data.views[name]);
    $('hint').dataset.mode = name;
    announce(fi >= 0 ? FLOOR_NAMES[fi] + ' floor view' : 'Exterior view');
  }
  document.querySelectorAll('#views button').forEach(b =>
    b.addEventListener('click', () => { if (!b.disabled) setView(b.dataset.view); }));

  /* The elevation versions are exterior shells — data.floors is empty, so the
     dollhouse pills have nothing to show and buildPanel() would index into an
     empty floorsUI. Disable them and stay on the exterior for those scenes. */
  const hasInteriors = data.floors.length > 0;
  if (!hasInteriors) {
    document.querySelectorAll('#views button').forEach(b => {
      if (b.dataset.view !== 'exterior') {
        b.disabled = true;
        b.setAttribute('aria-disabled', 'true');
        b.title = 'Interiors are only modelled on the full house — pick FULL under DESIGN';
      }
    });
  }

  /* ---------- rooms panel ---------- */
  const panel = $('roomsPanel'), list = $('roomsList'), panelTitle = $('panelTitle');
  const mobileBtn = $('mobileRoomBtn'), mobileDrawer = $('mobileDrawer');
  const mobileList = $('mobileRoomsList'), drawerTitle = $('drawerTitle');
  const drawerOverlay = $('drawerOverlay');

  function openDrawer() { mobileDrawer.classList.add('open'); drawerOverlay.style.display = 'block'; }
  function closeDrawer() { mobileDrawer.classList.remove('open'); drawerOverlay.style.display = 'none'; }
  mobileBtn.addEventListener('click', openDrawer);
  drawerOverlay.addEventListener('click', closeDrawer);

  function buildPanel(fi) {
    const frag = document.createDocumentFragment();
    const mobileFrag = document.createDocumentFragment();
    if (fi < 0) {
      panel.classList.add('off');
      mobileBtn.style.display = 'none';
      closeDrawer();
      list.replaceChildren();
      mobileList.replaceChildren();
      return;
    }
    panel.classList.remove('off');
    mobileBtn.style.display = '';
    panelTitle.textContent = FLOOR_NAMES[fi] + ' FLOOR';
    drawerTitle.textContent = FLOOR_NAMES[fi] + ' FLOOR';
    floorsUI[fi].rooms.forEach(room => {
      const li = document.createElement('li');
      li.setAttribute('role', 'button');
      li.setAttribute('tabindex', '0');
      li.innerHTML = '<span>' + room.r.name + '</span>';
      li.addEventListener('click', () => selectRoom(room, true));
      li.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectRoom(room, true); }
      });
      room.li = li;
      frag.appendChild(li);

      // mobile drawer clone
      const mli = document.createElement('li');
      mli.setAttribute('role', 'button');
      mli.setAttribute('tabindex', '0');
      mli.innerHTML = '<span>' + room.r.name + '</span>';
      mli.addEventListener('click', () => { selectRoom(room, true); closeDrawer(); });
      mli.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectRoom(room, true); closeDrawer(); }
      });
      room.mli = mli;
      mobileFrag.appendChild(mli);
    });

    mobileList.replaceChildren(mobileFrag);

  /* ---------- selection / info card ---------- */
  const card = $('infoCard');
  let selected = null;
  function clearSelection() {
    if (selected) {
      selected.hl.visible = false;
      if (selected.li) selected.li.classList.remove('sel');
      if (selected.mli) selected.mli.classList.remove('sel');
    }
    selected = null;
    card.classList.add('hidden');
  }
  function selectRoom(room, fly) {
    clearSelection();
    selected = room;
    room.hl.visible = true;
    if (room.li) room.li.classList.add('sel');
    if (room.mli) room.mli.classList.add('sel');
    $('cardName').textContent = room.r.name;
    // Prefer plan coordinates (always present); fall back to dims string
    let wMM = Math.round(room.r.x1 - room.r.x0);
    let dMM = Math.round(room.r.y1 - room.r.y0);
    if (!(wMM > 0 && dMM > 0) && room.r.dims) {
      const parts = room.r.dims.split(/\s*[×x]\s*/i);
      if (parts.length === 2) {
        wMM = parseInt(parts[0], 10);
        dMM = parseInt(parts[1], 10);
      }
    }
    if (wMM > 0 && dMM > 0) {
      $('cardMM').textContent = (wMM / 1000).toFixed(2) + ' × ' + (dMM / 1000).toFixed(2) + ' m';
      $('cardFT').textContent = ftin(wMM) + ' × ' + ftin(dMM);
      const sqft = (wMM * dMM) / (304.8 * 304.8);
      $('cardAR').textContent = sqft.toFixed(0) + ' sq ft';
    }
    card.classList.remove('hidden');
    announce('Selected ' + room.r.name);
    if (fly) {
      const fY = data.floors[room.fi].floorY;
      _tmpT.set(room.cx, fY + 0.4, room.cz);
      flyTo({
        target: _tmpT.clone(),
        radius: Math.max(8, ctl.radius * 0.7),
        phi: clamp(ctl.phi, 0.5, 1.05),
        theta: ctl.theta
      }, 0.9);
