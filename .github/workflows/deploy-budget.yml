name: deploy-budget

# Fails the push / PR if the Vercel deploy would exceed its size budget or a
# committed file is too large. Same script Vercel runs as its ignored build step.
on:
  push:
  pull_request:

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/deploy-budget.mjs
